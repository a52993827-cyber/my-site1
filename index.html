<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой сайт</title>
    <style>
        :root {
            --ink: #1d1b4d;
            --sun: #ffd23f;
            --coral: #ff6b6b;
            --mint: #3ddbb0;
            --paper: #fff8ec;
            --bg: linear-gradient(135deg, #ff6b6b, #ffd23f, #3ddbb0);
            --text: #333;
            --settings-bg: #f0f0f0;
            --menu-bg: #f0f0f0;
            --game-cell-bg: #e8e8e8;
            --game-cell-border: #bbb;
            --avatar-bg: #ffd23f;
        }

        body.dark-theme {
            --ink: #d0d0d0;
            --sun: #e6b800;
            --coral: #ff6b6b;
            --mint: #2e8b57;
            --paper: #2a2a2a;
            --bg: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            --text: #b0b0b0;
            --settings-bg: #3a3a3a;
            --menu-bg: #2a2a2a;
            --game-cell-bg: #3a3a3a;
            --game-cell-border: #555;
        }

        * { box-sizing: border-box;}
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            transition: background 0.5s;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px 28px;
            background: var(--paper);
            border: 4px solid var(--ink);
            border-radius: 28px;
            box-shadow: 10px 10px 0 var(--ink);
            text-align: center;
            animation: slideUp 0.6s ease-out;
            transition: background 0.5s, border-color 0.5s;
        }
        .avatar {
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            font-size: 60px;
            background: var(--avatar-bg);
            border: 4px solid var(--ink);
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.5s, border-color 0.5s, transform 0.2s;
            user-select: none;
        }
        .avatar:active {
            transform: scale(0.95);
        }
        h1{
            margin: 0 0 6px;
            font-size: 2rem;
            color: var(--ink);
        }
        p {
            line-height: 1.5;
            color: var(--text);
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 20px 0 26px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
        }
        li {
            padding: 8px 14px;
            background: var(--mint);
            border: 3px solid var(--ink);
            border-radius: 999px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
            color: var(--ink);
        }
        li:active {
            transform: scale(0.98);
        }

        /* --- КНОПКИ --- */
        button {
            font: inherit;
            font-weight: bold;
            padding: 14px 28px;
            color: #000000;
            background: var(--sun);
            border: 4px solid var(--ink);
            border-radius: 16px;
            box-shadow: 5px 5px 0 var(--ink);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0 var(--ink);
        }
        button:active {
            transform: translate(5px, 5px);
            box-shadow: 0 0 0 var(--ink);
        }
        button:focus-visible {
            outline: 4px solid var(--coral);
            outline-offset: 4px;
        }
        #hello {
            min-height: 1.5em;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--ink);
        }

        /* --- МОДАЛЬНОЕ ОКНО --- */
        #myModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #closeModal {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: var(--sun);
            border: 4px solid var(--ink);
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            z-index: 1001;
            box-shadow: 5px 5px 0 var(--ink);
            color: #000000;
        }
        #closeModal:active {
            transform: translate(5px, 5px);
            box-shadow: 0 0 0 var(--ink);
        }
        #modalContent {
            width: 98%;
            height: 98%;
            background: var(--paper);
            border-radius: 20px;
            border: 4px solid var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: var(--ink);
        }

        .corner-btn {
            position: fixed;
            top: 20px;
            z-index: 999;
            padding: 10px 20px;
            background: var(--mint);
            border: 3px solid var(--ink);
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--ink);
            color: #000000;
        }

        #btn-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            padding: 0;
            border-radius: 50%;
            font-size: 24px;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 998;
        }

        /* --- ПАНЕЛЬ НАСТРОЕК --- */
        .settings-panel {
            width: 100%;
            height: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            background: var(--paper);
            overflow-y: auto;
        }
        .settings-section {
            margin-bottom: 20px;
            padding: 15px;
            background: var(--settings-bg);
            border: 2px solid var(--ink);
            border-radius: 12px;
        }
        .settings-section h3 {
            margin-top: 0;
            color: var(--ink);
        }
        .avatar-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .avatar-option {
            font-size: 40px;
            cursor: pointer;
            padding: 5px;
            border: 3px solid transparent;
            border-radius: 10px;
            transition: border-color 0.2s;
        }
        .avatar-option.selected {
            border-color: var(--coral);
            background: #fff;
        }
        .stats-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }
        .stats-list li {
            background: transparent;
            border: none;
            padding: 5px 0;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            color: var(--text);
        }
        .btn-danger {
            background: #ff4d4d;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
            margin-top: 10px;
            border: 4px solid #1d1b4d;
            box-shadow: 5px 5px 0 #1d1b4d;
        }

        /* --- ОКНО РЕГИСТРАЦИИ --- */
        #welcomeScreen, #deviceScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .welcome-card {
            background: var(--paper);
            padding: 40px;
            border: 4px solid var(--ink);
            border-radius: 28px;
            box-shadow: 10px 10px 0 var(--ink);
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: slideUp 0.6s ease-out;
        }
        .welcome-card h2 {
            color: var(--ink);
            margin-top: 0;
        }
        .welcome-card input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 3px solid var(--ink);
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            background: var(--sun);
            color: #000000;
        }
        .welcome-card input:focus {
            outline: 4px solid var(--coral);
        }

        /* --- ВЫБОР УСТРОЙСТВА --- */
        .device-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .device-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            background: var(--sun);
            border: 4px solid var(--ink);
            border-radius: 16px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 5px 5px 0 var(--ink);
            transition: transform 0.1s, box-shadow 0.1s;
            color: #000;
        }
        .device-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0 var(--ink);
        }
        .device-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0 var(--ink);
        }
        .device-btn span {
            font-size: 32px;
        }

        /* --- МЕНЮ ИГР --- */
        .games-menu-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--menu-bg);
            transition: background 0.5s;
        }
        .games-menu-header {
            padding: 10px 70px 10px 10px;
            background: #00e5b5;
            border-bottom: 2px solid #1a1a1a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        .games-menu-header h3 {
            margin: 0;
            color: #1a1a1a;
        }
        .random-btn {
            padding: 5px 15px;
            background: #ffd23f;
            border: 2px solid #1a1a1a;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 0 #1a1a1a;
            color: #000;
        }
        .games-grid {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            flex: 1;
            overflow-y: auto;
        }
        .game-cell {
            width: 33%;
            height: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--game-cell-bg);
            cursor: pointer;
            border: 1px solid var(--game-cell-border);
            font-size: 16px;
            font-weight: bold;
            flex-direction: column;
            color: var(--ink);
            transition: background 0.2s;
        }
        .game-cell:hover {
            filter: brightness(0.9);
        }
        .game-cell span {
            font-size: 60px;
            margin-bottom: 5px;
        }

        /* --- ПАЛИТРА ЦВЕТОВ ДЛЯ АВАТАРКИ --- */
        .color-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: border-color 0.2s, transform 0.2s;
        }
        .color-option:hover {
            transform: scale(1.1);
        }
        .color-option.selected {
            border-color: var(--coral);
            box-shadow: 0 0 0 2px var(--paper);
        }

        /* --- СОВРЕМЕННЫЙ ФОН ДЛЯ ВСТРОЕННЫХ ИГР --- */
        .modern-game-bg {
            background: linear-gradient(145deg, #0f0c29, #302b63, #24243e);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        .embedded-game {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            color: #fff;
        }
        .embedded-game h2 {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            margin-top: 0;
        }
        .ttt-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            width: 240px;
            height: 240px;
            margin-bottom: 15px;
        }
        .ttt-cell {
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            font-size: 40px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            padding: 0;
            box-shadow: none;
            transition: background 0.2s, border-color 0.2s;
        }
        .ttt-cell:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
            transform: none;
            box-shadow: none;
        }
        .ttt-status {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 15px;
            min-height: 25px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }
        .guess-input {
            padding: 10px;
            font-size: 18px;
            width: 120px;
            text-align: center;
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            outline: none;
        }
        .guess-input:focus {
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        .guess-message {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin: 10px 0;
            min-height: 25px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }
        .guess-attempts {
            color: #aaa;
            margin-top: 15px;
        }
        /* Переопределяем стили кнопок внутри современных игр */
        .modern-game-bg button {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 3px solid rgba(255, 255, 255, 0.5);
            box-shadow: none;
        }
        .modern-game-bg button:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: none;
            transform: none;
        }
        .modern-game-bg button:active {
            background: rgba(255, 255, 255, 0.3);
            transform: none;
        }

        /* --- ПЕРЕКЛЮЧАТЕЛЬ УСТРОЙСТВ В НАСТРОЙКАХ --- */
        .device-switch {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .device-switch-btn {
            flex: 1;
            min-width: 90px;
            padding: 10px;
            background: var(--paper);
            border: 3px solid var(--ink);
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 3px 3px 0 var(--ink);
            transition: transform 0.1s, box-shadow 0.1s;
            color: var(--ink);
        }
        .device-switch-btn.active {
            background: var(--sun);
            color: #000;
        }
        .device-switch-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 0 0 0 var(--ink);
        }

        /* --- СТИЛИ ДЛЯ ВСТРОЕННЫХ ИГР --- */
        .game-canvas {
            border-radius: 12px;
            background: #1a1a2e;
            border: 3px solid rgba(255, 255, 255, 0.3);
            max-width: 100%;
        }
        .hangman-word {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 8px;
            margin: 20px 0;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        .hangman-letters {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            max-width: 400px;
            margin-top: 15px;
        }
        .hangman-letter-btn {
            width: 40px;
            height: 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            box-shadow: none;
            padding: 0;
        }
        .hangman-letter-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }
        .rps-choices {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .rps-choice {
            font-size: 60px;
            cursor: pointer;
            padding: 15px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s;
            user-select: none;
        }
        .rps-choice:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        .rps-result {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            margin: 15px 0;
            min-height: 30px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }
        .reaction-target {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #3ddbb0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            cursor: pointer;
            margin: 20px auto;
            transition: background 0.2s;
        }
        .color-game-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }
        .color-game-btn {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            cursor: pointer;
            border: 4px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.2s;
        }
        .color-game-btn:hover {
            transform: scale(1.1);
        }
        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 280px;
            margin: 20px auto;
        }
        .puzzle-cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
        }
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 280px;
            margin: 20px auto;
        }
        .memory-card {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            color: #fff;
            user-select: none;
        }
        .memory-card.flipped {
            background: #3ddbb0;
        }
        .memory-card.matched {
            background: #ffd23f;
            color: #000;
        }
        /* --- ВЫБОР СЛОЖНОСТИ В КРЕСТИКАХ --- */
        .ttt-difficulty {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .ttt-diff-btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: none;
        }
        .ttt-diff-btn.active {
            background: #ffd23f;
            color: #000;
            border-color: #ffd23f;
        }

        /* --- МЕНЮ РИСОВАНИЯ --- */
        .drawing-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px;
            width: 100%;
            height: 100%;
            background: var(--paper);
            overflow-y: auto;
        }
        .drawing-menu-btn {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: var(--mint);
            border: 3px solid var(--ink);
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            color: var(--ink);
            text-align: left;
            box-shadow: 4px 4px 0 var(--ink);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .drawing-menu-btn:active {
            transform: scale(0.98);
        }
        .drawing-menu-btn span {
            font-size: 32px;
        }
        .drawing-menu-btn div {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .drawing-menu-btn small {
            font-size: 12px;
            font-weight: normal;
            opacity: 0.7;
        }
        
        /* --- НОВЫЙ ИНТЕРФЕЙС РИСОВАНИЯ --- */
        .drawing-workspace {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
            height: 100%;
            padding: 15px;
            background: #f0f0f0;
            box-sizing: border-box;
            align-items: center;
            justify-content: center;
        }
        .drawing-canvas-area {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: #fff;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            flex: 1;
            height: 100%;
            max-width: 850px;
            justify-content: center;
        }
        .drawing-canvas-area canvas {
            background: #fff;
            border: 2px solid #ccc;
            border-radius: 8px;
            touch-action: none;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .drawing-side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 200px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-height: 100%;
            overflow-y: auto;
        }
        .bot-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            margin-bottom: 5px;
        }
        .bot-face {
            font-size: 50px;
            animation: float 2s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .bot-text {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            line-height: 1.3;
            min-height: 36px;
        }
        .side-btn {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #ccc;
            background: #f9f9f9;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 2px 2px 0 #ccc;
            transition: transform 0.1s;
        }
        .side-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }
        .side-btn.check-btn {
            background: #3ddbb0;
            border-color: #1d1b4d;
            box-shadow: 3px 3px 0 #1d1b4d;
            font-size: 16px;
            padding: 14px;
        }
        .side-btn.next-btn {
            background: #ffd23f;
            border-color: #1d1b4d;
            box-shadow: 3px 3px 0 #1d1b4d;
            font-size: 16px;
            padding: 14px;
        }
        .side-btn.active-tool {
            background: #ffd23f;
            border-color: #1d1b4d;
            box-shadow: 2px 2px 0 #1d1b4d;
        }
        .color-palette {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .color-swatch {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #ccc;
            cursor: pointer;
            padding: 0;
        }
        .color-swatch.active {
            border-color: #ff6b6b;
            box-shadow: 0 0 0 2px #fff, 0 0 0 4px #ff6b6b;
        }
        .task-sample {
            max-width: 100%;
            border: 2px dashed #aaa;
            border-radius: 8px;
            background: #fff;
            margin-bottom: 10px;
        }

        /* --- МОБИЛЬНАЯ АДАПТАЦИЯ --- */
        @media (max-width: 768px) {
            .drawing-workspace {
                flex-direction: column-reverse; /* Панель снизу, холст сверху */
                padding: 5px;
                gap: 10px;
            }
            .drawing-side-panel {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
                padding: 10px;
                gap: 10px;
                height: auto;
                max-height: 40vh;
            }
            .bot-container {
                flex-direction: row;
                width: 100%;
                justify-content: center;
                margin-bottom: 0;
                gap: 10px;
            }
            .bot-face {
                font-size: 30px;
            }
            .bot-text {
                font-size: 12px;
                min-height: auto;
            }
            .side-btn {
                padding: 8px 12px;
                font-size: 13px;
                flex: 1 1 auto;
                text-align: center;
            }
            .color-palette {
                width: 100%;
                justify-content: center;
            }
            .color-swatch {
                width: 30px;
                height: 30px;
            }
            .drawing-canvas-area {
                padding: 5px;
                width: 100%;
                flex: 1;
                min-height: 0;
                height: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Окно приветствия (Имя) -->
    <div id="welcomeScreen">
        <div class="welcome-card">
            <h2>Добро пожаловать!</h2>
            <p>Давай познакомимся. Как тебя зовут?</p>
            <input type="text" id="inputName" placeholder="Введи своё имя..." maxlength="20">
            <button onclick="saveName()" style="width: 100%;">Далее ▶</button>
        </div>
    </div>

    <!-- Окно выбора устройства -->
    <div id="deviceScreen" style="display: none;">
        <div class="welcome-card">
            <h2>С какого устройства вы зашли?</h2>
            <p>Это поможет нам настроить интерфейс и игры под вас.</p>
            <div class="device-options">
                <div class="device-btn" onclick="saveDevice('phone')">
                    <span>📱</span> Телефон
                </div>
                <div class="device-btn" onclick="saveDevice('tablet')">
                    <span>📟</span> Планшет
                </div>
                <div class="device-btn" onclick="saveDevice('desktop')">
                    <span>💻</span> Компьютер
                </div>
            </div>
        </div>
    </div>

    <button id="btn-settings" class="corner-btn" style="left: 20px;">⚙️</button>
    <button id="btn-share" class="corner-btn" style="right: 20px;">🔗 Поделиться</button>

    <main class="card">
        <div class="avatar" id="avatar">🐢</div>
        <h1 id="mainTitle">Привет, я Александр!</h1>
        <p id="greetingText">Учусь на веб-дизайнера</p>
        <ul>
            <li id="btn-games">🎮 Игры</li>
            <li id="btn-paint">🎨 Рисование</li>
            <li id="btn-space">🚀 Космос</li>
            <li id="btn-cats">🐱 Котики</li>
        </ul>
        <button id="btn">Нажми меня</button>
        <p id="hello"></p>
    </main>

    <button id="btn-top" title="Наверх">⬆️</button>

    <div id="myModal">
        <button id="closeModal">Закрыть ❌</button>
        <div id="modalContent">
            <!-- Контент появится здесь -->
        </div>
    </div>

    <script>
        // --- РЕГИСТРАЦИЯ / ПРИВЕТСТВИЕ ---
        const welcomeScreen = document.getElementById("welcomeScreen");
        const deviceScreen = document.getElementById("deviceScreen");
        const inputName = document.getElementById("inputName");
        const mainTitle = document.getElementById("mainTitle");
        const greetingText = document.getElementById("greetingText");

        const savedName = localStorage.getItem("userName");
        const savedDevice = localStorage.getItem("userDevice");

        if (savedName) {
            welcomeScreen.style.display = "none";
            mainTitle.textContent = `Привет, ${savedName}!`;
            greetingText.textContent = "Как прошёл твой день? Надеюсь, отлично! Давай поиграем?";
            
            if (savedDevice) {
                deviceScreen.style.display = "none";
                applyDeviceSettings(savedDevice);
            } else {
                deviceScreen.style.display = "flex";
            }
        } else {
            welcomeScreen.style.display = "flex";
            deviceScreen.style.display = "none";
        }

        function saveName() {
            const name = inputName.value.trim();
            if (name === "") {
                alert("Пожалуйста, введи своё имя!");
                return;
            }
            localStorage.setItem("userName", name);
            welcomeScreen.style.display = "none";
            mainTitle.textContent = `Привет, ${name}!`;
            greetingText.textContent = "Как прошёл твой день? Надеюсь, отлично! Давай поиграем?";
            deviceScreen.style.display = "flex";
        }

        inputName.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                saveName();
            }
        });

        // --- ВЫБОР УСТРОЙСТВА ---
        function saveDevice(device) {
            localStorage.setItem("userDevice", device);
            deviceScreen.style.display = "none";
            applyDeviceSettings(device);
        }

        function applyDeviceSettings(device) {
            window.userDevice = device;
            if (device === 'phone') {
                document.body.style.padding = '12px';
            } else {
                document.body.style.padding = '24px';
            }
        }

        // --- СПИСКИ ИГР (по 15 на каждое устройство) ---
        
        // 15 игр для компьютера
        const desktopGames = [
            'dino', '2048', 'blockblast', 'sudoku', 'watersort', 'onet',
            'tictactoe', 'guessnumber', 'flappybird',
            'hangman', 'rps', 'reaction', 'colorgame', 'puzzle', 'memory'
        ];
        
        // 15 игр для мобильных (без dino и 2048, + 2 мобильные)
        const mobileGames = [
            'blockblast', 'sudoku', 'watersort', 'onet',
            'tictactoe', 'guessnumber', 'flappybird',
            'hangman', 'rps', 'reaction', 'colorgame', 'puzzle', 'memory',
            'taptrainer', 'counter'
        ];

        function getAvailableGames() {
            const device = localStorage.getItem("userDevice");
            if (device === 'phone' || device === 'tablet') {
                return mobileGames;
            }
            return desktopGames;
        }

        const gameInfo = {
            'dino': { icon: '🦖', name: 'Динозаврик' },
            '2048': { icon: '🧩', name: '2048' },
            'blockblast': { icon: '🧱', name: 'Block Blast' },
            'sudoku': { icon: '🔢', name: 'Судоку' },
            'watersort': { icon: '🧪', name: 'Water Sort' },
            'onet': { icon: '🀄', name: 'Onet' },
            'tictactoe': { icon: '⭕', name: 'Крестики-нолики' },
            'guessnumber': { icon: '🎯', name: 'Угадай число' },
            'flappybird': { icon: '🐦', name: 'Flappy Bird' },
            'hangman': { icon: '🔤', name: 'Виселица' },
            'rps': { icon: '✊', name: 'Камень-ножницы' },
            'reaction': { icon: '⚡', name: 'Реакция' },
            'colorgame': { icon: '🎨', name: 'Угадай цвет' },
            'puzzle': { icon: '🔢', name: 'Пазл с числами' },
            'memory': { icon: '🃏', name: 'Найди пару' },
            'taptrainer': { icon: '👆', name: 'Тап-тренер' },
            'counter': { icon: '🔘', name: 'Счётчик' }
        };

        const avatars = ["🐢", "🦊", "🐼", "🦖", "🐱", "🐶", "🦁", "🐸", "🐵", "🐧", "🦄", "🐉"];

        const avatarColors = [
            { name: 'Жёлтый', hex: '#ffd23f' },
            { name: 'Мятный', hex: '#3ddbb0' },
            { name: 'Коралловый', hex: '#ff6b6b' },
            { name: 'Голубой', hex: '#6bc5ff' },
            { name: 'Лавандовый', hex: '#b19cd9' },
            { name: 'Персиковый', hex: '#ffb347' },
            { name: 'Розовый', hex: '#ff99cc' },
            { name: 'Салатовый', hex: '#a8e6cf' },
            { name: 'Серый', hex: '#c0c0c0' },
            { name: 'Белый', hex: '#ffffff' }
        ];

        // --- Тёмная тема ---
        const body = document.body;
        if (localStorage.getItem("theme") === "dark") {
            body.classList.add("dark-theme");
        }

        // --- Загрузка аватара и его цвета ---
        const avatarElement = document.getElementById("avatar");
        const savedAvatar = localStorage.getItem("savedAvatar") || "🐢";
        avatarElement.textContent = savedAvatar;

        const savedAvatarColor = localStorage.getItem("savedAvatarColor") || "#ffd23f";
        document.documentElement.style.setProperty('--avatar-bg', savedAvatarColor);

        // --- Модальное окно ---
        const modal = document.getElementById("myModal");
        const modalContent = document.getElementById("modalContent");
        const closeBtn = document.getElementById("closeModal");

        function openModal(htmlContent) {
            modalContent.innerHTML = htmlContent;
            modal.style.display = "flex";
        }

        closeBtn.addEventListener("click", () => {
            modal.style.display = "none";
            modalContent.innerHTML = "";
        });

        function closeModalFunc() {
            modal.style.display = "none";
            modalContent.innerHTML = "";
        }

        // --- 1. Кнопка "Нажми меня" ---
        const phrases = ["Ура, я это сделал!"];
        let n = 0;
        document.getElementById("btn").addEventListener("click", function () {
            document.getElementById("hello").textContent = phrases[n % phrases.length];
            n++;
        });

        // --- 2. Настройки ---
        document.getElementById("btn-settings").addEventListener("click", () => {
            const isDark = body.classList.contains("dark-theme");
            const currentAvatar = localStorage.getItem("savedAvatar") || "🐢";
            const currentName = localStorage.getItem("userName") || "Гость";
            const currentColor = localStorage.getItem("savedAvatarColor") || "#ffd23f";
            const currentDevice = localStorage.getItem("userDevice") || "desktop";

            const allUniqueGames = [...new Set([...desktopGames, ...mobileGames])];
            let statsHtml = '';
            allUniqueGames.forEach(game => {
                let count = parseInt(localStorage.getItem("playCount_" + game) || "0");
                if (gameInfo[game]) {
                    statsHtml += `<li><span>${gameInfo[game].icon} ${gameInfo[game].name}</span> <span>${count} раз</span></li>`;
                }
            });

            let colorOptionsHtml = avatarColors.map(color => `
                <div class="color-option ${color.hex === currentColor ? 'selected' : ''}" 
                     style="background-color: ${color.hex};" 
                     title="${color.name}"
                     onclick="selectAvatarColor('${color.hex}')">
                </div>
            `).join('');

            openModal(`
                <div class="settings-panel">
                    <h2 style="text-align: center; margin-top: 0;">⚙️ Настройки</h2>
                    
                    <div class="settings-section">
                        <h3>Твоё имя</h3>
                        <p style="font-size: 20px; font-weight: bold;">${currentName}</p>
                        <button onclick="changeName()" style="width: 100%; padding: 10px; margin-top: 10px;">✏️ Сменить имя</button>
                    </div>

                    <div class="settings-section">
                        <h3>Твоё устройство</h3>
                        <p style="font-size: 16px; margin-bottom: 10px;">Выбери устройство, чтобы изменить набор игр:</p>
                        <div class="device-switch">
                            <button class="device-switch-btn ${currentDevice === 'phone' ? 'active' : ''}" 
                                    onclick="changeDeviceFromSettings('phone')">📱 Телефон</button>
                            <button class="device-switch-btn ${currentDevice === 'tablet' ? 'active' : ''}" 
                                    onclick="changeDeviceFromSettings('tablet')">📟 Планшет</button>
                            <button class="device-switch-btn ${currentDevice === 'desktop' ? 'active' : ''}" 
                                    onclick="changeDeviceFromSettings('desktop')">💻 Компьютер</button>
                        </div>
                    </div>
                    
                    <div class="settings-section">
                        <h3>Выбери аватар</h3>
                        <div class="avatar-list">
                            ${avatars.map(emoji => `
                                <span class="avatar-option ${emoji === currentAvatar ? 'selected' : ''}" 
                                      onclick="selectAvatar('${emoji}')">${emoji}</span>
                            `).join('')}
                        </div>
                    </div>

                    <div class="settings-section">
                        <h3>Цвет фона аватарки</h3>
                        <div class="color-list">
                            ${colorOptionsHtml}
                        </div>
                    </div>

                    <div class="settings-section">
                        <h3>Тема оформления</h3>
                        <button onclick="toggleThemeFromSettings()" style="width: 100%; padding: 10px;">
                            ${isDark ? '☀️ Включить светлую тему' : '🌙 Включить тёмную тему'}
                        </button>
                    </div>
                    
                    <div class="settings-section">
                        <h3>Статистика игр</h3>
                        <ul class="stats-list">${statsHtml}</ul>
                    </div>
                    
                    <div class="settings-section" style="border-color: #ff4d4d;">
                        <h3 style="color: #ff4d4d;">Опасная зона</h3>
                        <button class="btn-danger" onclick="resetAllSettings()">🗑️ Сбросить всё</button>
                    </div>
                </div>
            `);
        });

        function changeName() {
            const newName = prompt("Введи новое имя:", localStorage.getItem("userName") || "");
            if (newName && newName.trim() !== "") {
                localStorage.setItem("userName", newName.trim());
                mainTitle.textContent = `Привет, ${newName.trim()}!`;
                document.getElementById("btn-settings").click();
            }
        }

        function changeDeviceFromSettings(device) {
            localStorage.setItem("userDevice", device);
            applyDeviceSettings(device);
            document.getElementById("btn-settings").click();
        }

        function selectAvatar(emoji) {
            localStorage.setItem("savedAvatar", emoji);
            avatarElement.textContent = emoji;
            document.querySelectorAll('.avatar-option').forEach(el => {
                el.classList.toggle('selected', el.textContent === emoji);
            });
        }

        function selectAvatarColor(hex) {
            localStorage.setItem("savedAvatarColor", hex);
            document.documentElement.style.setProperty('--avatar-bg', hex);
            document.getElementById("btn-settings").click();
        }

        function toggleThemeFromSettings() {
            body.classList.toggle("dark-theme");
            const isDark = body.classList.contains("dark-theme");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            document.getElementById("btn-settings").click();
        }

        function resetAllSettings() {
            if (confirm("Сбросить ВСЕ настройки, имя и статистику?")) {
                localStorage.clear();
                location.reload();
            }
        }

        // --- 3. ИГРЫ ---
        function backToGamesMenu() {
            document.getElementById("btn-games").click();
        }

        function saveGameResult(game) {
            let count = parseInt(localStorage.getItem("playCount_" + game) || "0") + 1;
            localStorage.setItem("playCount_" + game, count);
        }

        document.getElementById("btn-games").addEventListener("click", () => {
            const availableGames = getAvailableGames();
            
            let gamesHtml = '';
            availableGames.forEach(game => {
                if (gameInfo[game]) {
                    gamesHtml += `<div class="game-cell" onclick="showRules('${game}')">
                        <span>${gameInfo[game].icon}</span>${gameInfo[game].name}
                    </div>`;
                }
            });

            openModal(`
                <div class="games-menu-container">
                    <div class="games-menu-header">
                        <h3>Выбери игру (${availableGames.length}):</h3>
                        <button class="random-btn" onclick="startRandomGame()">🎲 Случайная</button>
                    </div>
                    <div class="games-grid">
                        ${gamesHtml}
                    </div>
                </div>
            `);
        });

        function startRandomGame() {
            const availableGames = getAvailableGames();
            const randomGame = availableGames[Math.floor(Math.random() * availableGames.length)];
            showRules(randomGame);
        }

        function showRules(gameType) {
            let rulesText = "";
            let warningText = ""; 

            const rules = {
                'dino': { text: "Нажимай ПРОБЕЛ или СТРЕЛКУ ВВЕРХ, чтобы динозаврик прыгал. Не врезайся в кактусы!", warn: "Перед началом игры обязательно нажми левой кнопкой мыши по игровому полю!" },
                '2048': { text: "Используй СТРЕЛКИ на клавиатуре, чтобы двигать плитки. Соединяй одинаковые цифры, чтобы получить 2048!", warn: "Перед началом игры обязательно нажми левой кнопкой мыши по игровому полю!" },
                'blockblast': { text: "Перетаскивай блоки на поле, чтобы заполнить линии и очистить их. Игра закончится, когда не будет места для нового блока.", warn: "Перед началом игры нажми левой кнопкой мыши по полю!" },
                'sudoku': { text: "Заполни сетку 9x9 цифрами от 1 до 9 так, чтобы в каждой строке, столбце и квадрате 3x3 цифры не повторялись.", warn: "Перед началом игры нажми левой кнопкой мыши по полю!" },
                'watersort': { text: "Переливай воду между колбами, чтобы собрать в каждой колбе воду одного цвета.", warn: "Перед началом игры нажми левой кнопкой мыши по полю!" },
                'onet': { text: "Находи одинаковые картинки и соединяй их линией, которая не пересекает другие картинки.", warn: "Перед началом игры нажми левой кнопкой мыши по полю!" },
                'tictactoe': { text: "Классические крестики-нолики. Выбери уровень сложности бота и играй за ❌. Собери три своих знака в ряд!", warn: "" },
                'guessnumber': { text: "Я загадал число от 1 до 100. Попробуй угадать его за минимальное количество попыток!", warn: "" },
                'flappybird': { text: "Нажимай ПРОБЕЛ, кликай мышкой или тапай по экрану, чтобы птичка летела вверх. Пролетай между трубами!", warn: "" },
                'hangman': { text: "Угадай слово по буквам. У тебя есть 6 попыток. Каждая неверная буква приближает поражение!", warn: "" },
                'rps': { text: "Камень побеждает ножницы, ножницы побеждают бумагу, бумага побеждает камень. Выбери свой ход!", warn: "" },
                'reaction': { text: "Нажми на круг как можно быстрее, когда он появится! Чем быстрее реакция — тем больше очков.", warn: "" },
                'colorgame': { text: "Выбери правильный цвет, который соответствует названию. Будь внимателен!", warn: "" },
                'puzzle': { text: "Найди число, которое просит игра. Числа каждый раз новые! После прохождения игра начнётся заново.", warn: "" },
                'memory': { text: "Найди все пары одинаковых картинок. Переворачивай по две карточки за ход.", warn: "" },
                'taptrainer': { text: "Нажимай на появляющиеся круги как можно быстрее! Тренируй скорость и точность.", warn: "" },
                'counter': { text: "Нажимай на кнопку как можно быстрее за 10 секунд! Побей свой рекорд!", warn: "" }
            };

            if (rules[gameType]) {
                rulesText = rules[gameType].text;
                warningText = rules[gameType].warn;
            }

            openModal(`
                <div style="width: 100%; height: 100%; display: flex; flex-direction: column; background: #fff8ec; padding: 20px; box-sizing: border-box;">
                    <h2 style="color: #1d1b4d; text-align: center;">Правила игры</h2>
                    <p style="color: #333; font-size: 18px; line-height: 1.6; flex: 1;">${rulesText}</p>
                    ${warningText ? `<p style="color: red; font-weight: bold; font-size: 16px; margin-bottom: 20px;">${warningText}</p>` : ''}
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <button onclick="backToGamesMenu()" style="padding: 12px 24px; background: #ff4d4d; border: 4px solid #1d1b4d; border-radius: 16px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 5px 5px 0 #1d1b4d; color: white;">← В меню игр</button>

        // --- ЗАПУСК ИГР ---
        function startGame(gameType) {
            saveGameResult(gameType);

            // --- ВСТРОЕННЫЕ ИГРЫ ---
            if (gameType === 'tictactoe') {
                openModal(`

                            <button onclick="initHangman()" style="margin-top: 15px;">Заново</button>

            if (gameType === 'rps') {

                    <div class="modern-game-bg" style="width: 100%; height: 100%;">

                            <div class="rps-choices">

                                <div class="rps-choice" onclick="playRPS('scissors')">✌️</div>

            if (gameType === 'reaction') {

                    <div class="modern-game-bg" style="width: 100%; height: 100%;">

                            <button onclick="startReaction()">Старт</button>

                `);
                setTimeout(() => initReaction(), 50);

            }

            if (gameType === 'colorgame') {
                openModal(`
                    <div class="modern-game-bg" style="width: 100%; height: 100%;">
                        <div class="embedded-game">
                            <h2>Угадай цвет</h2>
                            <div class="ttt-status" id="color-status">Нажми на цвет, который соответствует названию</div>
                            <div id="color-word" style="font-size: 32px; font-weight: bold; margin: 20px 0; color: #fff;"></div>
                            <div class="color-game-options" id="color-options"></div>
                            <div class="ttt-status" id="color-score">Счёт: 0</div>

                    </div>
                `);
                setTimeout(() => initColorGame(), 50);
                return;
            }

            if (gameType === 'puzzle') {
                openModal(`
                    <div class="modern-game-bg" style="width: 100%; height: 100%;">
                        <div class="embedded-game">
                            <h2>Пазл с числами</h2>
                            <div class="ttt-status" id="puzzle-status">Нажимай на числа!</div>
                            <div class="puzzle-grid" id="puzzle-grid"></div>

                    </div>
                `);
                setTimeout(() => initPuzzle(), 50);

            }

            if (gameType === 'memory') {
                openModal(`
                    <div class="modern-game-bg" style="width: 100%; height: 100%;">
                        <div class="embedded-game">
                            <h2>Найди пару</h2>
                            <div class="ttt-status" id="memory-status">Найди все пары!</div>
                            <div class="memory-grid" id="memory-grid"></div>
                            <button onclick="initMemory()" style="margin-top: 15px;">Заново</button>
                        </div>
                    </div>
                `);
                setTimeout(() => initMemory(), 50);

            }

            if (gameType === 'taptrainer') {
                openModal(`
                    <div class="modern-game-bg" style="width: 100%; height: 100%;">
                        <div class="embedded-game">
                            <h2>Тап-тренер</h2>
                            <div class="ttt-status" id="tap-status">Нажимай на круги как можно быстрее!</div>
                            <div id="tap-area" style="width: 100%; height: 300px; position: relative; background: rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden;"></div>
                            <div class="ttt-status" id="tap-score">Очки: 0</div>
                        </div>
                    </div>
                `);
                setTimeout(() => initTapTrainer(), 50);
                return;
            }

            if (gameType === 'counter') {
                openModal(`
                    <div class="modern-game-bg" style="width: 100%; height: 100%;">
                        <div class="embedded-game">
                            <h2>Счётчик</h2>
                            <div class="ttt-status" id="counter-status">Нажми "Старт" и жми кнопку 10 секунд!</div>
                            <div style="font-size: 48px; font-weight: bold; color: #ffd23f; margin: 20px 0;" id="counter-value">0</div>
                            <button onclick="startCounter()" id="counter-btn">Старт</button>
                        </div>
                    </div>
                `);
                setTimeout(() => initCounter(), 50);
                return;
            }

            // --- ВНЕШНИЕ ИГРЫ (IFRAME) ---
            const gameUrls = {
                'dino': 'https://imkennyyip.github.io/chrome-dinosaur-game/',
                '2048': 'https://monicatvera.github.io/2048/',
                'blockblast': 'https://blockblast.pro/',
                'sudoku': 'https://sudokum.ru/',
                'watersort': 'https://cpscount.com/water-sort/',
                'onet': 'https://gamesnacks.com/games/onetconnectclassic/'
            };

            const gameUrl = gameUrls[gameType];
            if (!gameUrl) {
                alert("Эта игра временно недоступна.");
                return;
            }

            openModal(`
                <div style="width: 100%; height: 100%; display: flex; flex-direction: column;">
                    <div style="padding: 10px; background: #1a1a1a; display: flex; gap: 10px; justify-content: center;">
                        <button onclick="backToGamesMenu()" style="padding: 8px 20px; background: #ff4d4d; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; box-shadow: none;">❌ Выйти в меню</button>
                    </div>
                    <iframe src="${gameUrl}" style="width: 100%; height: 100%; border: none;" allowfullscreen></iframe>
                </div>
            `);
        }

        // ============================================
        // === ВСТРОЕННЫЕ ИГРЫ ===
        // ============================================

        // --- КРЕСТИКИ-НОЛИКИ (с уровнями сложности) ---
        let tttBoard = ['', '', '', '', '', '', '', '', ''];
        let tttCurrentPlayer = 'X';
        let tttGameActive = true;
        let tttDifficulty = 'medium';

        function initTicTacToe() {
            tttBoard = ['', '', '', '', '', '', '', '', ''];
            tttCurrentPlayer = 'X';
            tttGameActive = true;
            renderTicTacToe();
            document.getElementById('ttt-status').textContent = 'Твой ход (❌)';
        }

        function setTttDifficulty(diff) {
            tttDifficulty = diff;
            document.querySelectorAll('.ttt-diff-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.diff === diff);
            });
            initTicTacToe();
        }

        function renderTicTacToe() {
            const boardEl = document.getElementById('ttt-board');
            if (!boardEl) return;
            boardEl.innerHTML = '';
            tttBoard.forEach((cell, index) => {
                const btn = document.createElement('button');
                btn.className = 'ttt-cell';
                btn.textContent = cell;
                btn.onclick = () => handleTicTacToeClick(index);
                boardEl.appendChild(btn);
            });
        }

        function handleTicTacToeClick(index) {
            if (!tttGameActive || tttBoard[index] !== '' || tttCurrentPlayer !== 'X') return;
            
            tttBoard[index] = 'X';
            tttCurrentPlayer = 'O';
            renderTicTacToe();
            
            if (checkTicTacToeWin('X')) {
                document.getElementById('ttt-status').textContent = '🎉 Ты победил!';
                tttGameActive = false;
                return;
            }
            if (tttBoard.every(cell => cell !== '')) {
                document.getElementById('ttt-status').textContent = '🤝 Ничья!';
                tttGameActive = false;
                return;
            }

            document.getElementById('ttt-status').textContent = 'Ход бота (⭕)...';
            
            setTimeout(() => {
                if (!tttGameActive) return;
                botMove();
            }, 500);
        }

        function botMove() {
            const emptyCells = tttBoard.map((cell, index) => cell === '' ? index : null).filter(val => val !== null);
            if (emptyCells.length === 0) return;
            
            let chosenIndex = null;
            
            if (tttDifficulty === 'easy') {
                chosenIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            } else if (tttDifficulty === 'medium') {
                if (Math.random() < 0.5) {
                    chosenIndex = getBestMove('O') ?? getBestMove('X') ?? emptyCells[Math.floor(Math.random() * emptyCells.length)];
                } else {
                    chosenIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                }
            } else {
                chosenIndex = getBestMove('O') ?? getBestMove('X') ?? emptyCells[Math.floor(Math.random() * emptyCells.length)];
            }
            
            if (chosenIndex === null || chosenIndex === undefined) {
                chosenIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            }
            
            tttBoard[chosenIndex] = 'O';
            tttCurrentPlayer = 'X';
            renderTicTacToe();

            if (checkTicTacToeWin('O')) {
                document.getElementById('ttt-status').textContent = '😢 Бот победил!';
                tttGameActive = false;
                return;
            }
            if (tttBoard.every(cell => cell !== '')) {
                document.getElementById('ttt-status').textContent = '🤝 Ничья!';
                tttGameActive = false;
                return;
            }
            document.getElementById('ttt-status').textContent = 'Твой ход (❌)';
        }

        function getBestMove(player) {
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            for (let p of winPatterns) {
                const vals = p.map(i => tttBoard[i]);
                const countPlayer = vals.filter(v => v === player).length;
                const countEmpty = vals.filter(v => v === '').length;
                if (countPlayer === 2 && countEmpty === 1) {
                    return p[vals.indexOf('')];
                }
            }
            return null;
        }

        function checkTicTacToeWin(player) {
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            return winPatterns.some(pattern => pattern.every(index => tttBoard[index] === player));
        }

        function resetTicTacToe() {
            initTicTacToe();
        }

        // --- УГАДАЙ ЧИСЛО ---
        let guessTarget = 0;
        let guessAttempts = 0;

        function initGuessGame() {
            guessTarget = Math.floor(Math.random() * 100) + 1;
            guessAttempts = 0;
            const msg = document.getElementById('guess-message');
            if (msg) {
                msg.textContent = 'Введи число и нажми "Проверить"';
                msg.style.color = '#fff';
            }
            const input = document.getElementById('guess-input');
            if (input) input.value = '';
            const att = document.getElementById('guess-attempts');
            if (att) att.textContent = 'Попыток: 0';
        }

        function checkGuess() {
            const input = document.getElementById('guess-input');
            const message = document.getElementById('guess-message');
            const attemptsEl = document.getElementById('guess-attempts');
            
            if (!input || !message || !attemptsEl) return;

            const guess = parseInt(input.value);
            if (isNaN(guess) || guess < 1 || guess > 100) {
                message.textContent = 'Пожалуйста, введи число от 1 до 100.';
                message.style.color = '#ff6b6b';
                return;
            }

            guessAttempts++;
            attemptsEl.textContent = `Попыток: ${guessAttempts}`;

            if (guess === guessTarget) {
                message.textContent = `🎉 Поздравляю! Ты угадал число ${guessTarget} за ${guessAttempts} попыток!`;
                message.style.color = '#3ddbb0';
            } else if (guess < guessTarget) {
                message.textContent = `📈 Моё число больше, чем ${guess}.`;
                message.style.color = '#ff6b6b';
            } else {
                message.textContent = `📉 Моё число меньше, чем ${guess}.`;
                message.style.color = '#ff6b6b';
            }
            input.value = '';
            input.focus();
        }

        function resetGuessGame() {
            initGuessGame();
        }

        // --- FLAPPY BIRD ---
        let flappyState = {
            birdY: 250, birdV: 0, pipes: [], score: 0, running: false,
            gameOver: false, animId: null, frame: 0
        };

        function initFlappy() {
            const canvas = document.getElementById('flappyCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            flappyState = {
                birdY: 250, birdV: 0, pipes: [], score: 0, running: false,
                gameOver: false, animId: null, frame: 0
            };
            drawFlappy(ctx);
            canvas.onclick = () => {
                if (!flappyState.running && !flappyState.gameOver) startFlappy();
                else if (flappyState.running) flappyState.birdV = -6;
            };
            document.onkeydown = (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    if (!flappyState.running && !flappyState.gameOver) startFlappy();
                    else if (flappyState.running) flappyState.birdV = -6;
                }
            };
        }

        function drawFlappy(ctx) {
            const w = 400, h = 500;
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, w, h);
            
            flappyState.pipes.forEach(p => {
                ctx.fillStyle = '#3ddbb0';
                ctx.fillRect(p.x, 0, 60, p.top);
                ctx.fillRect(p.x, p.top + 150, 60, h - p.top - 150);
            });
            
            ctx.fillStyle = '#ffd23f';
            ctx.beginPath();
            ctx.arc(80, flappyState.birdY, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1d1b4d';
            ctx.beginPath();
            ctx.arc(85, flappyState.birdY - 5, 3, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Счёт: ' + flappyState.score, w / 2, 40);
            
            if (flappyState.gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 36px sans-serif';
                ctx.fillText('Игра окончена!', w / 2, h / 2 - 20);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 24px sans-serif';
                ctx.fillText('Счёт: ' + flappyState.score, w / 2, h / 2 + 20);
            }
        }

        function startFlappy() {
            const canvas = document.getElementById('flappyCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            flappyState = {
                birdY: 250, birdV: 0, pipes: [], score: 0, running: true,
                gameOver: false, animId: null, frame: 0
            };
            flappyLoop(ctx);
        }

        function flappyLoop(ctx) {
            if (!flappyState.running) return;
            flappyState.frame++;
            flappyState.birdV += 0.5;
            flappyState.birdY += flappyState.birdV;
            
            if (flappyState.birdY > 485 || flappyState.birdY < 15) {
                flappyState.running = false;
                flappyState.gameOver = true;
                drawFlappy(ctx);
                return;
            }
            
            if (flappyState.frame % 80 === 0) {
                flappyState.pipes.push({ x: 400, top: 80 + Math.random() * 200 });
            }
            
            flappyState.pipes.forEach(p => p.x -= 3);
            flappyState.pipes = flappyState.pipes.filter(p => p.x > -60);
            
            for (let p of flappyState.pipes) {
                if (80 + 15 > p.x && 80 - 15 < p.x + 60) {
                    if (flappyState.birdY - 15 < p.top || flappyState.birdY + 15 > p.top + 150) {
                        flappyState.running = false;
                        flappyState.gameOver = true;
                        drawFlappy(ctx);
                        return;
                    }
                }
                if (!p.scored && p.x + 60 < 80) {
                    p.scored = true;
                    flappyState.score++;
                }
            }
            
            drawFlappy(ctx);
            flappyState.animId = requestAnimationFrame(() => flappyLoop(ctx));
        }

        // --- ВИСЕЛИЦА ---
        const hangmanWords = ['АРХИТЕКТУРА', 'ДВОРЕЦ', 'СОБОР', 'ЛОНДОН', 'ПОЖАР', 'КУПОЛ', 'КОЛОННА', 'СИММЕТРИЯ', 'ТЮДОР', 'СТЮАРТ'];
        let hangmanState = {};

        function initHangman() {
            const word = hangmanWords[Math.floor(Math.random() * hangmanWords.length)];
            hangmanState = {
                word: word, guessed: new Set(), wrong: 0, maxWrong: 6, gameOver: false
            };
            renderHangman();
        }

        function renderHangman() {
            const wordEl = document.getElementById('hangman-word');
            const lettersEl = document.getElementById('hangman-letters');
            const statusEl = document.getElementById('hangman-status');
            if (!wordEl || !lettersEl || !statusEl) return;
            
            wordEl.textContent = hangmanState.word.split('').map(l => 
                hangmanState.guessed.has(l) ? l : '_'
            ).join(' ');
            
            lettersEl.innerHTML = '';
            const alphabet = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ';
            for (let letter of alphabet) {
                const btn = document.createElement('button');
                btn.className = 'hangman-letter-btn';
                btn.textContent = letter;
                btn.disabled = hangmanState.guessed.has(letter) || hangmanState.gameOver;
                btn.onclick = () => guessHangmanLetter(letter);
                lettersEl.appendChild(btn);
            }
            
            if (hangmanState.gameOver) {
                statusEl.textContent = hangmanState.wrong >= hangmanState.maxWrong 
                    ? `💀 Ты проиграл! Слово: ${hangmanState.word}` 
                    : '🎉 Ты победил!';
            } else {
                statusEl.textContent = `Ошибок: ${hangmanState.wrong}/${hangmanState.maxWrong}`;
            }
        }

        function guessHangmanLetter(letter) {
            if (hangmanState.gameOver || hangmanState.guessed.has(letter)) return;
            hangmanState.guessed.add(letter);
            
            if (!hangmanState.word.includes(letter)) {
                hangmanState.wrong++;
            }
            
            const won = hangmanState.word.split('').every(l => hangmanState.guessed.has(l));
            if (won || hangmanState.wrong >= hangmanState.maxWrong) {
                hangmanState.gameOver = true;
            }
            
            renderHangman();
        }

        // --- КАМЕНЬ-НОЖНИЦЫ-БУМАГА ---
        let rpsState = {};

        function initRPS() {
            rpsState = { playerScore: 0, botScore: 0 };
            renderRPS('Выбери свой ход!');
        }

        function renderRPS(msg) {
            const resultEl = document.getElementById('rps-result');
            const scoreEl = document.getElementById('rps-score');
            if (resultEl) resultEl.textContent = msg;
            if (scoreEl) scoreEl.textContent = `Счёт: ${rpsState.playerScore} - ${rpsState.botScore}`;
        }

        function playRPS(player) {
            const choices = ['rock', 'scissors', 'paper'];
            const bot = choices[Math.floor(Math.random() * 3)];
            const emojis = { rock: '✊', scissors: '✌️', paper: '✋' };
            
            let result = '';
            if (player === bot) {
                result = `🤝 Ничья! Бот тоже выбрал ${emojis[bot]}`;
            } else if (
                (player === 'rock' && bot === 'scissors') ||
                (player === 'scissors' && bot === 'paper') ||
                (player === 'paper' && bot === 'rock')
            ) {
                rpsState.playerScore++;
                result = `🎉 Ты победил! Бот выбрал ${emojis[bot]}`;
            } else {
                rpsState.botScore++;

        // --- ПАЗЛ С ЧИСЛАМИ (полностью переработан) ---
        let puzzleState = {};

        // Надёжное перемешивание (алгоритм Фишера-Йетса)
        function shuffleArray(arr) {
            const array = [...arr];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initPuzzle() {
            // 1. Перемешиваем числа для сетки (от 1 до 12)
            const gridNumbers = shuffleArray(Array.from({length: 12}, (_, i) => i + 1));
            
            // 2. Перемешиваем ОЧЕРЕДЬ поиска (в каком порядке просить числа)
            const searchQueue = shuffleArray(Array.from({length: 12}, (_, i) => i + 1));
            
            puzzleState = { 
                gridNumbers: gridNumbers,
                searchQueue: searchQueue,
                currentIndex: 0 // индекс текущего искомого числа в searchQueue
            };
            
            renderPuzzle();
        }

        function renderPuzzle() {
            const grid = document.getElementById('puzzle-grid');
            if (!grid) return;
            grid.innerHTML = '';
            
            // Выводим сетку с перемешанными числами
            puzzleState.gridNumbers.forEach((num) => {
                const cell = document.createElement('div');
                cell.className = 'puzzle-cell';
                cell.textContent = num;
                cell.onclick = () => clickPuzzle(num, cell);
                grid.appendChild(cell);
            });
            
            // Показываем, какое число искать сейчас
            const targetNumber = puzzleState.searchQueue[puzzleState.currentIndex];
            document.getElementById('puzzle-status').textContent = `Найди число: ${targetNumber}`;
        }

        function clickPuzzle(num, cell) {
            const targetNumber = puzzleState.searchQueue[puzzleState.currentIndex];
            
            if (num === targetNumber) {
                cell.style.background = '#3ddbb0';
                cell.style.color = '#000';
                cell.style.pointerEvents = 'none';
                
                puzzleState.currentIndex++;
                
                if (puzzleState.currentIndex >= 12) {
                    document.getElementById('puzzle-status').textContent = '🎉 Ты справился! Новая игра через секунду...';
                    setTimeout(() => {
                        initPuzzle();
                    }, 1000);
                } else {
                    renderPuzzle(); // Перерисовываем, чтобы показать новое искомое число
                }
            } else {
                cell.style.background = '#ff6b6b';
                setTimeout(() => { cell.style.background = ''; }, 200);
            }
        }

        function renderMemory() {

        function clickMemory(idx) {
            if (memoryState.lock || memoryState.flipped.includes(idx) || memoryState.matched.includes(idx)) return;
            
            memoryState.flipped.push(idx);
            renderMemory();
            
            if (memoryState.flipped.length === 2) {
                memoryState.lock = true;
                const [a, b] = memoryState.flipped;
                if (memoryState.deck[a] === memoryState.deck[b]) {
                    memoryState.matched.push(a, b);
                    memoryState.flipped = [];
                    memoryState.lock = false;
                    renderMemory();
                    if (memoryState.matched.length === memoryState.deck.length) {
                        document.getElementById('memory-status').textContent = '🎉 Ты нашёл все пары!';
                    }
                } else {
