        // ============================================
        // === WATER SORT (200 уровней, анимация, звук) ===
        // ============================================

        const WATER_COLORS = [
            '#ff6b6b', '#3ddbb0', '#6bc5ff', '#ffd23f',
            '#b19cd9', '#ffb347', '#ff99cc', '#a8e6cf',
            '#c0c0c0', '#ffffff', '#8b4513', '#00e5b5'
        ];

        const WATER_TUBE_CAPACITY = 4;

        let waterSortState = {
            tubes: [],
            selectedTube: -1,
            level: 1,
            animating: false,
            moves: 0,
            capacity: 4
        };

        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ctx = getAudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'select') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(650, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
                    osc.start(); osc.stop(ctx.currentTime + 0.12);
                } else if (type === 'pour') {
                    const bufferSize = Math.floor(ctx.sampleRate * 0.4);
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
                    }
                    const noise = ctx.createBufferSource();
                    noise.buffer = buffer;
                    const noiseGain = ctx.createGain();
                    noiseGain.gain.setValueAtTime(0.06, ctx.currentTime);
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    noise.connect(noiseGain);
                    noiseGain.connect(ctx.destination);
                    noise.start();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.35);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                    osc.start(); osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'win') {
                    [523, 659, 784, 1047].forEach((freq, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.type = 'square';
                        o.frequency.value = freq;
                        o.connect(g); g.connect(ctx.destination);
                        g.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.12);
                        g.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + i * 0.12 + 0.02);
                        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.12 + 0.25);
                        o.start(ctx.currentTime + i * 0.12);
                        o.stop(ctx.currentTime + i * 0.12 + 0.3);
                    });
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
                    osc.start(); osc.stop(ctx.currentTime + 0.25);
                }
            } catch (e) { /* игнорируем ошибки аудио */ }
        }

        function getLevelConfig(level) {
            let colors, empty, capacity = 4;
            if (level <= 20) { colors = 3; empty = 2; }
            else if (level <= 50) { colors = 4; empty = 2; }
            else if (level <= 90) { colors = 5; empty = 2; }
            else if (level <= 140) { colors = 6; empty = 2; }
            else if (level <= 170) { colors = 7; empty = 1; }
            else { colors = 8; empty = 1; }
            return { colors, empty, capacity, seed: level * 1337 + 42 };
        }

        function mulberry32(seed) {
            return function() {
                seed |= 0; seed = seed + 0x6D2B79F5 | 0;
                let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function shuffleWithRng(arr, rng) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function loadProgress() {
            const saved = parseInt(localStorage.getItem('waterSortLevel') || '1');
            waterSortState.level = Math.max(1, Math.min(200, saved));
        }

        function saveProgress() {
            localStorage.setItem('waterSortLevel', waterSortState.level);
        }

        function initWaterSort() {
            loadProgress();
            buildLevel(waterSortState.level);
            renderWaterSort();
            updateWaterSortHud();
        }

        function buildLevel(level) {
            const cfg = getLevelConfig(level);
            const rng = mulberry32(cfg.seed);

            let liquids = [];
            for (let c = 0; c < cfg.colors; c++) {
                for (let k = 0; k < cfg.capacity; k++) {
                    liquids.push(WATER_COLORS[c % WATER_COLORS.length]);
                }
            }
            liquids = shuffleWithRng(liquids, rng);

            const tubes = [];
            for (let i = 0; i < cfg.colors; i++) {
                const tube = [];
                for (let j = 0; j < cfg.capacity; j++) {
                    tube.push(liquids.pop());
                }
                tubes.push(tube);
            }
            for (let i = 0; i < cfg.empty; i++) tubes.push([]);

            waterSortState.tubes = tubes;
            waterSortState.selectedTube = -1;
            waterSortState.animating = false;
            waterSortState.moves = 0;
            waterSortState.capacity = cfg.capacity;
        }

        function updateWaterSortHud() {
            const lvlEl = document.getElementById('watersort-level');
            const movesEl = document.getElementById('watersort-moves');
            if (lvlEl) lvlEl.textContent = `Уровень ${waterSortState.level} / 200`;
            if (movesEl) movesEl.textContent = `Ходов: ${waterSortState.moves}`;
        }

        function renderWaterSort() {
            const area = document.getElementById('watersort-area');
            if (!area) return;
            area.innerHTML = '';
            area.style.position = 'relative';

            const capacity = waterSortState.capacity || 4;

            waterSortState.tubes.forEach((tube, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'watersort-tube-wrapper';
                wrapper.dataset.index = index;
                wrapper.style.cssText = `
                    position: relative;
                    width: 54px;
                    height: 190px;
                    cursor: pointer;
                    display: flex;
                    justify-content: center;
                    align-items: flex-end;
                    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
                `;

                if (waterSortState.selectedTube === index) {
                    wrapper.style.transform = 'translateY(-18px)';
                }

                const tubeEl = document.createElement('div');
                tubeEl.className = 'watersort-tube';
                tubeEl.style.cssText = `
                    width: 46px;
                    height: 180px;
                    border: 4px solid rgba(255,255,255,0.85);
                    border-top: none;
                    border-radius: 0 0 23px 23px;
                    display: flex;
                    flex-direction: column-reverse;
                    justify-content: flex-start;
                    align-items: stretch;
                    position: relative;
                    background: rgba(0,0,0,0.25);
                    overflow: hidden;
                    transition: border-color 0.2s, box-shadow 0.2s;
                `;

                if (waterSortState.selectedTube === index) {
                    tubeEl.style.borderColor = '#ffd23f';
                    tubeEl.style.boxShadow = '0 0 16px rgba(255,210,63,0.9)';
                }

                tube.forEach(color => {
                    const seg = document.createElement('div');
                    seg.style.cssText = `
                        width: 100%;
                        height: ${100 / capacity}%;
                        background: ${color};
                        flex-shrink: 0;
                        border-bottom: 1px solid rgba(0,0,0,0.12);
                        transition: height 0.25s, opacity 0.25s;
                    `;
                    tubeEl.appendChild(seg);
                });

                wrapper.appendChild(tubeEl);
                wrapper.onclick = () => handleWaterSortClick(index);
                area.appendChild(wrapper);
            });
        }

        function setWaterStatus(text) {
            const el = document.getElementById('watersort-status');
            if (el) el.textContent = text;
        }

        function handleWaterSortClick(index) {
            if (waterSortState.animating) return;

            const tubes = waterSortState.tubes;

            if (waterSortState.selectedTube === index) {
                waterSortState.selectedTube = -1;
                renderWaterSort();
                setWaterStatus('Нажми на колбу, чтобы выбрать');
                playSound('select');
                return;
            }

            if (waterSortState.selectedTube === -1) {
                if (tubes[index].length > 0) {
                    waterSortState.selectedTube = index;
                    renderWaterSort();
                    setWaterStatus('Выбери колбу, куда перелить');
                    playSound('select');
                }
                return;
            }

            const fromIdx = waterSortState.selectedTube;
            const fromTube = tubes[fromIdx];
            const toTube = tubes[index];
            const capacity = waterSortState.capacity;

            if (toTube.length >= capacity) {
                waterSortState.selectedTube = -1;
                renderWaterSort();
                setWaterStatus('Колба полна!');
                playSound('error');
                return;
            }

            const colorToMove = fromTube[fromTube.length - 1];
            const topColor = toTube.length > 0 ? toTube[toTube.length - 1] : null;

            if (toTube.length > 0 && topColor !== colorToMove) {
                waterSortState.selectedTube = -1;
                renderWaterSort();
                setWaterStatus('Нельзя смешивать разные цвета!');
                playSound('error');
                return;
            }

            let count = 0;
            for (let i = fromTube.length - 1; i >= 0; i--) {
                if (fromTube[i] === colorToMove) count++;
                else break;
            }
            const space = capacity - toTube.length;
            const amount = Math.min(count, space);

            animatePour(fromIdx, index, colorToMove, amount);
        }

        function animatePour(fromIdx, toIdx, color, amount) {
            waterSortState.animating = true;
            waterSortState.selectedTube = -1;

            const area = document.getElementById('watersort-area');
            if (!area) { finishPour(fromIdx, toIdx, color, amount); return; }

            const wrappers = area.querySelectorAll('.watersort-tube-wrapper');
            const fromWrapper = wrappers[fromIdx];
            const toWrapper = wrappers[toIdx];

            if (!fromWrapper || !toWrapper) {
                finishPour(fromIdx, toIdx, color, amount);
                return;
            }

            const fromTubeEl = fromWrapper.querySelector('.watersort-tube');
            const toTubeEl = toWrapper.querySelector('.watersort-tube');

            fromWrapper.style.transform = 'translateY(-40px) rotate(35deg)';
            fromWrapper.style.zIndex = '10';
            fromWrapper.style.transition = 'transform 0.3s ease-out';

            const fromRect = fromTubeEl.getBoundingClientRect();
            const toRect = toTubeEl.getBoundingClientRect();
            const areaRect = area.getBoundingClientRect();

            const startX = fromRect.right - 8;
            const startY = fromRect.top + 20;
            const endX = toRect.left + toRect.width / 2;
            const endY = toRect.top;

            const stream = document.createElement('div');
            stream.style.cssText = `
                position: absolute;
                left: ${startX - areaRect.left}px;
                top: ${startY - areaRect.top}px;
                width: 8px;
                height: 0px;
                background: ${color};
                border-radius: 4px;
                pointer-events: none;
                z-index: 20;
                box-shadow: 0 0 8px ${color};
                transform-origin: top center;
                transition: height 0.35s ease-in, left 0.35s ease-in, top 0.35s ease-in;
            `;
            area.appendChild(stream);

            requestAnimationFrame(() => {
                stream.style.left = `${endX - areaRect.left - 4}px`;
                stream.style.top = `${endY - areaRect.top}px`;
                stream.style.height = `${Math.abs(endY - startY) + 20}px`;
            });

            playSound('pour');

            setTimeout(() => {
                const fromSegs = fromTubeEl.querySelectorAll('div');
                for (let i = 0; i < amount; i++) {
                    const seg = fromSegs[fromSegs.length - 1 - i];
                    if (seg) {
                        seg.style.height = '0%';
                        seg.style.opacity = '0';
                    }
                }

                const capacity = waterSortState.capacity;
                const segHeight = 100 / capacity;
                for (let i = 0; i < amount; i++) {
                    const seg = document.createElement('div');
                    seg.style.cssText = `
                        width: 100%;
                        height: 0%;
                        background: ${color};
                        flex-shrink: 0;
                        border-bottom: 1px solid rgba(0,0,0,0.12);
                        transition: height 0.3s ease-out;
                    `;
                    toTubeEl.appendChild(seg);
                    requestAnimationFrame(() => {
                        seg.style.height = `${segHeight}%`;
                    });
                }
            }, 350);

            setTimeout(() => {
                if (stream.parentNode) stream.remove();
                fromWrapper.style.transform = 'translateY(0) rotate(0deg)';
                fromWrapper.style.zIndex = '';
                finishPour(fromIdx, toIdx, color, amount);
            }, 750);
        }

        function finishPour(fromIdx, toIdx, color, amount) {
            const tubes = waterSortState.tubes;
            const fromTube = tubes[fromIdx];
            const toTube = tubes[toIdx];

            for (let i = 0; i < amount; i++) {
                toTube.push(fromTube.pop());
            }

            waterSortState.moves++;
            waterSortState.animating = false;

            renderWaterSort();
            updateWaterSortHud();
            checkWaterSortWin();
        }

        function checkWaterSortWin() {
            const capacity = waterSortState.capacity;
            const isWin = waterSortState.tubes.every(tube => {
                if (tube.length === 0) return true;
                if (tube.length !== capacity) return false;
                return tube.every(c => c === tube[0]);
            });

            if (isWin) {
                playSound('win');
                setWaterStatus('🎉 Уровень пройден!');
                addQuestProgress('c_9', 1);

                setTimeout(() => {
                    if (waterSortState.level >= 200) {
                        setWaterStatus('🏆 Поздравляю! Ты прошёл все 200 уровней!');
                        setTimeout(() => {
                            if (confirm('Ты прошёл все 200 уровней! Начать заново?')) {
                                waterSortState.level = 1;
                                saveProgress();
                                buildLevel(1);
                                renderWaterSort();
                                updateWaterSortHud();
                                setWaterStatus('Нажми на колбу, чтобы выбрать');
                            }
                        }, 800);
                    } else {
                        waterSortState.level++;
                        saveProgress();
                        buildLevel(waterSortState.level);
                        renderWaterSort();
                        updateWaterSortHud();
                        setWaterStatus('Нажми на колбу, чтобы выбрать');
                    }
                }, 1400);
            } else {
                setWaterStatus('Продолжай...');
            }
        }

        let drawTool = 'brush';
        let drawColor = '#000';
        let isDrawing = false;
        let lastX = 0, lastY = 0;

        function initFreeDraw(w, h, isMobile) {
            const canvas = document.getElementById('freeCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDraw = (e) => {
                e.preventDefault();
                isDrawing = true;
                const pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getPos(e);
                
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                
                if (drawTool === 'eraser') {
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = isMobile ? 30 : 20;
                } else {
                    ctx.strokeStyle = drawColor;
                    ctx.lineWidth = isMobile ? 10 : 6;
                }
                ctx.stroke();
                
                lastX = pos.x;
                lastY = pos.y;
            };

            const stopDraw = () => { isDrawing = false; };

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('mouseout', stopDraw);
            
            canvas.addEventListener('touchstart', startDraw, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stopDraw);
            canvas.addEventListener('touchcancel', stopDraw);
        }

        let eraseTask = '';
        let eraseOriginalPixels = 0;
        function initEraseGame(w, h) {
            const canvas = document.getElementById('eraseCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, w, h);
            
            const tasks = ['sun_and_cloud', 'car_extra_wheel', 'tree_extra_branch'];
            eraseTask = tasks[Math.floor(Math.random() * tasks.length)];
            
            ctx.lineWidth = 4;
            
            if (eraseTask === 'sun_and_cloud') {
                ctx.fillStyle = '#ffd23f';
                ctx.strokeStyle = '#333';
                ctx.beginPath();
                ctx.arc(w/2, h/2, w/6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                for (let i = 0; i < 8; i++) {
                    const angle = (i * Math.PI) / 4;
                    ctx.beginPath();
                    ctx.moveTo(w/2 + Math.cos(angle) * (w/6 + 10), h/2 + Math.sin(angle) * (w/6 + 10));
                    ctx.lineTo(w/2 + Math.cos(angle) * (w/6 + 25), h/2 + Math.sin(angle) * (w/6 + 25));
                    ctx.stroke();
                }
                ctx.fillStyle = 'rgba(200, 200, 200, 0.8)';
                ctx.beginPath();
                ctx.arc(w/2 - 40, h/2 - 40, 30, 0, Math.PI * 2);
                ctx.arc(w/2 + 10, h/2 - 50, 40, 0, Math.PI * 2);
                ctx.arc(w/2 + 50, h/2 - 20, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
            else if (eraseTask === 'car_extra_wheel') {
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.roundRect(w/4, h/2, w/2, h/5, 10);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#6bc5ff';
                ctx.beginPath();
                ctx.moveTo(w/4 + 40, h/2);
                ctx.lineTo(w/4 + 70, h/2 - 40);
                ctx.lineTo(w/2 + 30, h/2 - 40);
                ctx.lineTo(w/2 + 60, h/2);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#333';
                ctx.beginPath(); ctx.arc(w/4 + 30, h/2 + h/5, 25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(w/2 + 50, h/2 + h/5, 25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#333';
                ctx.beginPath(); ctx.arc(w/2, h/2 + h/5, 25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
            else if (eraseTask === 'tree_extra_branch') {
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(w/2 - 20, h/2, 40, h/3);
                ctx.strokeRect(w/2 - 20, h/2, 40, h/3);
                ctx.fillStyle = '#3ddbb0';
                ctx.beginPath();
                ctx.arc(w/2, h/3, w/5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.strokeStyle = '#8b4513';
                ctx.lineWidth = 10;
                ctx.beginPath();
                ctx.moveTo(w/2 + 20, h/2 + 40);
                ctx.lineTo(w/2 + 80, h/2 + 20);
                ctx.stroke();
            }

            eraseOriginalPixels = countPixelsInZone(ctx, w, h, eraseTask);

            let drawing = false;
            let lastX = 0, lastY = 0;

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const start = (e) => {
                e.preventDefault();
                drawing = true;
                const pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 25;
            };

            const draw = (e) => {
                if (!drawing) return;
                e.preventDefault();
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                lastX = pos.x;
                lastY = pos.y;
            };

            const stop = () => { drawing = false; };

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('mouseout', stop);
            
            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stop);
            canvas.addEventListener('touchcancel', stop);

            document.getElementById('erase-bot-face').textContent = '🤖';
            document.getElementById('erase-bot-text').textContent = 'Сотри то, чего не должно быть!';
            document.getElementById('erase-next-btn').style.display = 'none';
        }

        function countPixelsInZone(ctx, w, h, task) {
            let imgData;
            if (task === 'sun_and_cloud') {
                imgData = ctx.getImageData(w/2 - 70, h/2 - 70, 140, 90).data;
            } else if (task === 'car_extra_wheel') {
                imgData = ctx.getImageData(w/2 - 35, h/2 + h/5 - 35, 70, 70).data;
            } else if (task === 'tree_extra_branch') {
                imgData = ctx.getImageData(w/2 + 10, h/2 + 10, 80, 60).data;
            }
            let count = 0;
            for (let i = 3; i < imgData.length; i += 4) {
                if (imgData[i] > 0) count++;
            }
            return count;
        }

        function checkEraseDrawing() {
            const canvas = document.getElementById('eraseCanvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            
            const botFace = document.getElementById('erase-bot-face');
            const botText = document.getElementById('erase-bot-text');
            const nextBtn = document.getElementById('erase-next-btn');

            const currentPixels = countPixelsInZone(ctx, w, h, eraseTask);
            
            if (currentPixels < eraseOriginalPixels * 0.2) {
                botFace.textContent = '😄';
                botText.textContent = 'Ура! Ты всё стёр!';
                nextBtn.style.display = 'block';
            } else {
                botFace.textContent = '😢';
                botText.textContent = 'Ещё не всё стёрто. Попробуй ещё!';
            }
        }

        function drawShape(ctx, type, cx, cy, size) {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.fillStyle = '#ddd';
            
            if (type === 'house') {
                ctx.fillRect(cx - size/2, cy, size, size*0.7);
                ctx.strokeRect(cx - size/2, cy, size, size*0.7);
                ctx.beginPath();
                ctx.moveTo(cx - size/2 - 10, cy);
                ctx.lineTo(cx, cy - size*0.5);
                ctx.lineTo(cx + size/2 + 10, cy);
                ctx.closePath();
                ctx.fillStyle = '#ff6b6b';
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(cx - 15, cy + size*0.3, 30, size*0.4);
                ctx.fillStyle = '#add8e6';
                ctx.fillRect(cx - size*0.35, cy + size*0.1, 25, 25);
            } 
            else if (type === 'car') {
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.roundRect(cx - size/2, cy, size, size*0.4, 10);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#6bc5ff';
                ctx.beginPath();
                ctx.moveTo(cx - size*0.2, cy);
                ctx.lineTo(cx - size*0.1, cy - size*0.3);
                ctx.lineTo(cx + size*0.2, cy - size*0.3);
                ctx.lineTo(cx + size*0.3, cy);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#333';
                ctx.beginPath(); ctx.arc(cx - size*0.3, cy + size*0.4, size*0.15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx + size*0.3, cy + size*0.4, size*0.15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
            else if (type === 'tree') {
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(cx - size*0.1, cy, size*0.2, size*0.6);
                ctx.strokeRect(cx - size*0.1, cy, size*0.2, size*0.6);
                ctx.fillStyle = '#3ddbb0';
                ctx.beginPath();
                ctx.arc(cx, cy, size*0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }

        document.getElementById("btn-space").addEventListener("click", () => {
            openModal(`<img src="space.gif.gif" alt="Космос" style="max-width: 100%; max-height: 100%; object-fit: contain;">`);
        });

        document.getElementById("btn-cats").addEventListener("click", () => {
            openModal(`<img src="cat.jpeg.JPEG" alt="Котик" style="max-width: 100%; max-height: 100%; object-fit: contain;">`);
        });

        document.getElementById("btn-share").addEventListener("click", async () => {
            const url = "https://a52993827-cyber.github.io/my-site/html/";
            try {
                await navigator.clipboard.writeText(url);
                alert("Ссылка скопирована! Можешь отправить её другу: " + url);
            } catch (err) {
                prompt("Скопируй эту ссылку и отправь другу:", url);
            }
        });

        const btnTop = document.getElementById("btn-top");
        window.addEventListener("scroll", () => {
            if (window.scrollY > 200) {
                btnTop.style.display = "flex";
            } else {
                btnTop.style.display = "none";
            }
        });
        btnTop.addEventListener("click", () => {
            window.scrollTo({ top: 0, behavior: "smooth" });
        });

        // Инициализация при запуске
        updateCoinDisplay();
        updateQuestBadge();
    </script>
</body>
