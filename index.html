        // --- 1. СВОБОДНОЕ РИСОВАНИЕ ---
        let drawTool = 'brush';
        let drawColor = '#000';
        let isDrawing = false;
        let lastX = 0, lastY = 0;

        function initFreeDraw(w, h, isMobile) {
            const canvas = document.getElementById('freeCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDraw = (e) => {
                e.preventDefault();
                isDrawing = true;
                const pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getPos(e);
                
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                
                if (drawTool === 'eraser') {
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = isMobile ? 30 : 20;
                } else {
                    ctx.strokeStyle = drawColor;
                    ctx.lineWidth = isMobile ? 10 : 6;
                }
                ctx.stroke();
                
                lastX = pos.x;
                lastY = pos.y;
            };

            const stopDraw = () => {
                isDrawing = false;
            };

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('mouseout', stopDraw);
            
            canvas.addEventListener('touchstart', startDraw, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stopDraw);
            canvas.addEventListener('touchcancel', stopDraw);
        }

        function setDrawTool(tool) {
            drawTool = tool;
            document.getElementById('tool-brush').classList.toggle('active-tool', tool === 'brush');
            document.getElementById('tool-eraser').classList.toggle('active-tool', tool === 'eraser');
        }

        function setDrawColor(color, el) {
            drawColor = color;
            document.querySelectorAll('.color-swatch').forEach(swatch => swatch.classList.remove('active'));
            if (el) el.classList.add('active');
            setDrawTool('brush');
        }

        function clearCanvas(id) {
            const canvas = document.getElementById(id);
            if (canvas) {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        // --- 2. СДЕЛАЙ ПОХОЖИЙ РИСУНОК ---
        let copyTargetShape = '';
        function initCopyGame(w, h) {
            const refCanvas = document.getElementById('referenceCanvas');
            const mainCanvas = document.getElementById('copyCanvas');
            if (!refCanvas || !mainCanvas) return;

            const shapes = ['house', 'car', 'tree'];
            copyTargetShape = shapes[Math.floor(Math.random() * shapes.length)];
            
            const refCtx = refCanvas.getContext('2d');
            refCtx.clearRect(0, 0, refCanvas.width, refCanvas.height);
            drawShape(refCtx, copyTargetShape, refCanvas.width / 2, refCanvas.height / 2, refCanvas.width * 0.7);

            const ctx = mainCanvas.getContext('2d');
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 4;
            
            let drawing = false;
            let lastX = 0, lastY = 0;

            const getPos = (e) => {
                const rect = mainCanvas.getBoundingClientRect();
                const scaleX = mainCanvas.width / rect.width;
                const scaleY = mainCanvas.height / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const start = (e) => {
                e.preventDefault();
                drawing = true;
                const pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
            };

            const draw = (e) => {
                if (!drawing) return;
                e.preventDefault();
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                lastX = pos.x;
                lastY = pos.y;
            };

            const stop = () => { drawing = false; };

            mainCanvas.addEventListener('mousedown', start);
            mainCanvas.addEventListener('mousemove', draw);
            mainCanvas.addEventListener('mouseup', stop);
            mainCanvas.addEventListener('mouseout', stop);
            
            mainCanvas.addEventListener('touchstart', start, { passive: false });
            mainCanvas.addEventListener('touchmove', draw, { passive: false });
            mainCanvas.addEventListener('touchend', stop);
            mainCanvas.addEventListener('touchcancel', stop);

            // Сброс бота
            document.getElementById('copy-bot-face').textContent = '🤖';
            document.getElementById('copy-bot-text').textContent = 'Повтори рисунок с образца!';
            document.getElementById('copy-next-btn').style.display = 'none';
        }

        function checkCopyDrawing() {
            const canvas = document.getElementById('copyCanvas');
            const ctx = canvas.getContext('2d');
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let pixels = 0;
            for (let i = 3; i < imgData.data.length; i += 4) {
                if (imgData.data[i] > 0) pixels++;
            }
            
            const botFace = document.getElementById('copy-bot-face');
            const botText = document.getElementById('copy-bot-text');
            const nextBtn = document.getElementById('copy-next-btn');

            if (pixels > 500) { // Если что-то нарисовано
                botFace.textContent = '🎉';
                botText.textContent = 'Отлично! Похоже на образец!';
                nextBtn.style.display = 'block';
            } else {
                botFace.textContent = '🤔';
                botText.textContent = 'Пока пусто. Попробуй нарисовать что-нибудь!';
            }
        }

        // --- 3. ДОРИСУЙ, ЧТОБЫ ПОЛУЧИЛОСЬ ПРАВИЛЬНО ---
        let completeTask = '';
        function initCompleteGame(w, h) {
            const canvas = document.getElementById('completeCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, w, h);
            
            const tasks = ['house_no_roof', 'car_no_wheels', 'smiley_no_eyes'];
            completeTask = tasks[Math.floor(Math.random() * tasks.length)];
            
            ctx.strokeStyle = '#333';
            ctx.fillStyle = '#ddd';
            ctx.lineWidth = 4;
            
            if (completeTask === 'house_no_roof') {
                ctx.fillRect(w/4, h/2, w/2, h/3);
                ctx.strokeRect(w/4, h/2, w/2, h/3);
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(w/2 - 20, h/2 + h/4, 40, h/12 + 20);
                ctx.fillStyle = '#add8e6';
                ctx.fillRect(w/4 + 20, h/2 + 20, 30, 30);
            } 
            else if (completeTask === 'car_no_wheels') {
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.roundRect(w/4, h/2, w/2, h/5, 10);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#6bc5ff';
                ctx.beginPath();
                ctx.moveTo(w/4 + 40, h/2);
                ctx.lineTo(w/4 + 70, h/2 - 40);
                ctx.lineTo(w/2 + 30, h/2 - 40);
                ctx.lineTo(w/2 + 60, h/2);
                ctx.fill();
                ctx.stroke();
            }
            else if (completeTask === 'smiley_no_eyes') {
                ctx.fillStyle = '#ffd23f';
                ctx.beginPath();
                ctx.arc(w/2, h/2, w/4, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(w/2, h/2 + 20, w/6, 0, Math.PI);
                ctx.stroke();
            }

            let drawing = false;
            let lastX = 0, lastY = 0;

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const start = (e) => {
                e.preventDefault();
                drawing = true;
                const pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 4;
            };

            const draw = (e) => {
                if (!drawing) return;
                e.preventDefault();
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                lastX = pos.x;
                lastY = pos.y;
            };

            const stop = () => { drawing = false; };

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('mouseout', stop);
            
            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stop);
            canvas.addEventListener('touchcancel', stop);

            // Сброс бота
            document.getElementById('complete-bot-face').textContent = '🤖';
            document.getElementById('complete-bot-text').textContent = 'Дорисуй то, чего не хватает!';
            document.getElementById('complete-next-btn').style.display = 'none';
        }

        function checkCompleteDrawing() {
            const canvas = document.getElementById('completeCanvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            
            const botFace = document.getElementById('complete-bot-face');
            const botText = document.getElementById('complete-bot-text');
            const nextBtn = document.getElementById('complete-next-btn');

            // Бот проверяет зоны (не пиксель-в-пиксель)
            let success = false;
            
            if (completeTask === 'house_no_roof') {
                // Проверяем зону крыши (верхняя часть холста)
                const imgData = ctx.getImageData(w/4, h/4, w/2, h/4).data;
                let darkPixels = 0;
                for (let i = 3; i < imgData.length; i += 4) {
                    if (imgData[i] > 0) darkPixels++;
                }
                if (darkPixels > 100) success = true; // Если что-то нарисовано сверху
            } 
            else if (completeTask === 'car_no_wheels') {
                // Проверяем зоны колёс (низ)
                const imgData1 = ctx.getImageData(w/4, h/2 + h/5, w/4, h/4).data;
                const imgData2 = ctx.getImageData(w/2, h/2 + h/5, w/4, h/4).data;
                let pixels1 = 0, pixels2 = 0;
                for (let i = 3; i < imgData1.length; i += 4) if (imgData1[i] > 0) pixels1++;
                for (let i = 3; i < imgData2.length; i += 4) if (imgData2[i] > 0) pixels2++;
                if (pixels1 > 50 && pixels2 > 50) success = true;
            }
            else if (completeTask === 'smiley_no_eyes') {
                // Проверяем зону глаз (центр)
                const imgData = ctx.getImageData(w/2 - 40, h/2 - 40, 80, 40).data;
                let darkPixels = 0;
                for (let i = 3; i < imgData.length; i += 4) {
                    if (imgData[i] > 0) darkPixels++;
                }
                if (darkPixels > 30) success = true;
            }

            if (success) {
                botFace.textContent = '🎉';
                botText.textContent = 'Отлично! Теперь всё правильно!';
                nextBtn.style.display = 'block';
            } else {
                botFace.textContent = '🤔';
                botText.textContent = 'Кажется, чего-то не хватает. Попробуй ещё!';
            }
        }

        // --- 4. СОТРИ ЛИШНЕЕ ---
        let eraseTask = '';
        let eraseOriginalPixels = 0;
        function initEraseGame(w, h) {
            const canvas = document.getElementById('eraseCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, w, h);
            
            const tasks = ['sun_and_cloud', 'car_extra_wheel', 'tree_extra_branch'];
            eraseTask = tasks[Math.floor(Math.random() * tasks.length)];
            
            ctx.lineWidth = 4;
            
            if (eraseTask === 'sun_and_cloud') {
                ctx.fillStyle = '#ffd23f';
                ctx.strokeStyle = '#333';
                ctx.beginPath();
                ctx.arc(w/2, h/2, w/6, 0, Math.PI * 2); // Центр смещен для баланса
                ctx.fill();
                ctx.stroke();
                for (let i = 0; i < 8; i++) {
                    const angle = (i * Math.PI) / 4;
                    ctx.beginPath();
                    ctx.moveTo(w/2 + Math.cos(angle) * (w/6 + 10), h/2 + Math.sin(angle) * (w/6 + 10));
                    ctx.lineTo(w/2 + Math.cos(angle) * (w/6 + 25), h/2 + Math.sin(angle) * (w/6 + 25));
                    ctx.stroke();
                }
                // Лишняя туча
                ctx.fillStyle = 'rgba(200, 200, 200, 0.8)';
                ctx.beginPath();
                ctx.arc(w/2 - 40, h/2 - 40, 30, 0, Math.PI * 2);
                ctx.arc(w/2 + 10, h/2 - 50, 40, 0, Math.PI * 2);
                ctx.arc(w/2 + 50, h/2 - 20, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
            else if (eraseTask === 'car_extra_wheel') {
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.roundRect(w/4, h/2, w/2, h/5, 10);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#6bc5ff';
                ctx.beginPath();
                ctx.moveTo(w/4 + 40, h/2);
                ctx.lineTo(w/4 + 70, h/2 - 40);
                ctx.lineTo(w/2 + 30, h/2 - 40);
                ctx.lineTo(w/2 + 60, h/2);
                ctx.fill();
                ctx.stroke();
                // 2 нормальных колеса
                ctx.fillStyle = '#333';
                ctx.beginPath(); ctx.arc(w/4 + 30, h/2 + h/5, 25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(w/2 + 50, h/2 + h/5, 25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                // Лишнее колесо посередине
                ctx.fillStyle = '#333';
                ctx.beginPath(); ctx.arc(w/2, h/2 + h/5, 25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
            else if (eraseTask === 'tree_extra_branch') {
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(w/2 - 20, h/2, 40, h/3);
                ctx.strokeRect(w/2 - 20, h/2, 40, h/3);
                ctx.fillStyle = '#3ddbb0';
                ctx.beginPath();
                ctx.arc(w/2, h/3, w/5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                // Лишняя ветка
                ctx.strokeStyle = '#8b4513';
                ctx.lineWidth = 10;
                ctx.beginPath();
                ctx.moveTo(w/2 + 20, h/2 + 40);
                ctx.lineTo(w/2 + 80, h/2 + 20);
                ctx.stroke();
            }

            // Запоминаем, сколько было пикселей в зоне "лишнего"
            eraseOriginalPixels = countPixelsInZone(ctx, w, h, eraseTask);

            let drawing = false;
            let lastX = 0, lastY = 0;

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const start = (e) => {
                e.preventDefault();
                drawing = true;
                const pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
                ctx.strokeStyle = '#fff'; // Стираем белым
                ctx.lineWidth = 25; // Увеличенный ластик
            };

            const draw = (e) => {
                if (!drawing) return;
                e.preventDefault();
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                lastX = pos.x;
                lastY = pos.y;
            };

            const stop = () => { drawing = false; };

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('mouseout', stop);
            
            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stop);
            canvas.addEventListener('touchcancel', stop);

            // Сброс бота
            document.getElementById('erase-bot-face').textContent = '🤖';
            document.getElementById('erase-bot-text').textContent = 'Сотри то, чего не должно быть!';
            document.getElementById('erase-next-btn').style.display = 'none';
        }

        function countPixelsInZone(ctx, w, h, task) {
            let imgData;
            if (task === 'sun_and_cloud') {
                imgData = ctx.getImageData(w/2 - 70, h/2 - 70, 140, 90).data; // Чуть больше зона
            } else if (task === 'car_extra_wheel') {
                imgData = ctx.getImageData(w/2 - 35, h/2 + h/5 - 35, 70, 70).data;
            } else if (task === 'tree_extra_branch') {
                imgData = ctx.getImageData(w/2 + 10, h/2 + 10, 80, 60).data;
            }
            let count = 0;
            for (let i = 3; i < imgData.length; i += 4) {
                if (imgData[i] > 0) count++;
            }
            return count;
        }

        function checkEraseDrawing() {
            const canvas = document.getElementById('eraseCanvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            
            const botFace = document.getElementById('erase-bot-face');
            const botText = document.getElementById('erase-bot-text');
            const nextBtn = document.getElementById('erase-next-btn');

            // Проверяем, стёрто ли лишнее (сравниваем количество пикселей)
            const currentPixels = countPixelsInZone(ctx, w, h, eraseTask);
            
            // Если осталось менее 20% от исходного количества — значит, стёрли
            if (currentPixels < eraseOriginalPixels * 0.2) {
                botFace.textContent = '😄';
                botText.textContent = 'Ура! Ты всё стёр!';
                nextBtn.style.display = 'block';
            } else {
                botFace.textContent = '😢';
                botText.textContent = 'Ещё не всё стёрто. Попробуй ещё!';
            }
        }

        // --- ОБЩАЯ ФУНКЦИЯ ДЛЯ РИСОВАНИЯ ФИГУР ---
        function drawShape(ctx, type, cx, cy, size) {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.fillStyle = '#ddd';
            
            if (type === 'house') {
                ctx.fillRect(cx - size/2, cy, size, size*0.7);
                ctx.strokeRect(cx - size/2, cy, size, size*0.7);
                ctx.beginPath();
                ctx.moveTo(cx - size/2 - 10, cy);
                ctx.lineTo(cx, cy - size*0.5);
                ctx.lineTo(cx + size/2 + 10, cy);
                ctx.closePath();
                ctx.fillStyle = '#ff6b6b';
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(cx - 15, cy + size*0.3, 30, size*0.4);
                ctx.fillStyle = '#add8e6';
                ctx.fillRect(cx - size*0.35, cy + size*0.1, 25, 25);
            } 
            else if (type === 'car') {
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.roundRect(cx - size/2, cy, size, size*0.4, 10);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#6bc5ff';
                ctx.beginPath();
                ctx.moveTo(cx - size*0.2, cy);
                ctx.lineTo(cx - size*0.1, cy - size*0.3);
                ctx.lineTo(cx + size*0.2, cy - size*0.3);
                ctx.lineTo(cx + size*0.3, cy);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#333';
                ctx.beginPath(); ctx.arc(cx - size*0.3, cy + size*0.4, size*0.15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx + size*0.3, cy + size*0.4, size*0.15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
            else if (type === 'tree') {
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(cx - size*0.1, cy, size*0.2, size*0.6);
                ctx.strokeRect(cx - size*0.1, cy, size*0.2, size*0.6);
                ctx.fillStyle = '#3ddbb0';
                ctx.beginPath();
                ctx.arc(cx, cy, size*0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
        }

        // Полифилл для roundRect
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }

        // --- ОСТАЛЬНЫЕ КНОПКИ ---
        document.getElementById("btn-space").addEventListener("click", () => {
            openModal(`<img src="space.gif.gif" alt="Космос" style="max-width: 100%; max-height: 100%; object-fit: contain;">`);
        });

        document.getElementById("btn-cats").addEventListener("click", () => {
            openModal(`<img src="cat.jpeg.JPEG" alt="Котик" style="max-width: 100%; max-height: 100%; object-fit: contain;">`);
        });

        document.getElementById("btn-share").addEventListener("click", async () => {
            const url = "https://a52993827-cyber.github.io/my-site/html/";
            try {
                await navigator.clipboard.writeText(url);
                alert("Ссылка скопирована! Можешь отправить её другу: " + url);
            } catch (err) {
                prompt("Скопируй эту ссылку и отправь другу:", url);
            }
        });

        // Кнопка "Наверх"
        const btnTop = document.getElementById("btn-top");
        window.addEventListener("scroll", () => {
            if (window.scrollY > 200) {
                btnTop.style.display = "flex";
            } else {
                btnTop.style.display = "none";
            }
        });
        btnTop.addEventListener("click", () => {
            window.scrollTo({ top: 0, behavior: "smooth" });
        });
    </script>
