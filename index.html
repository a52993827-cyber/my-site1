<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Всё в одном</title>
    <style>
        :root {
            --ink: #1d1b4d;
            --sun: #ffd23f;
            --coral: #ff6b6b;
            --mint: #3ddbb0;
            --paper: #fff8ec;
            --bg: linear-gradient(135deg, #ff6b6b, #ffd23f, #3ddbb0);
            --text: #333;
            --settings-bg: #f0f0f0;
            --menu-bg: #f0f0f0;
            --game-cell-bg: #e8e8e8;
            --game-cell-border: #bbb;
            --avatar-bg: #ffd23f;
        }

        body.dark-theme {
            --ink: #d0d0d0;
            --sun: #e6b800;
            --coral: #ff6b6b;
            --mint: #2e8b57;
            --paper: #2a2a2a;
            --bg: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            --text: #b0b0b0;
            --settings-bg: #3a3a3a;
            --menu-bg: #2a2a2a;
            --game-cell-bg: #3a3a3a;
            --game-cell-border: #555;
        }

        * { box-sizing: border-box;}
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            transition: background 0.5s;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px 28px;
            background: var(--paper);
            border: 4px solid var(--ink);
            border-radius: 28px;
            box-shadow: 10px 10px 0 var(--ink);
            text-align: center;
            animation: slideUp 0.6s ease-out;
            transition: background 0.5s, border-color 0.5s;
            margin-top: 80px;
        }
        .avatar {
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            font-size: 60px;
            background: var(--avatar-bg);
            border: 4px solid var(--ink);
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.5s, border-color 0.5s, transform 0.2s;
            user-select: none;
        }
        .avatar:active {
            transform: scale(0.95);
        }
        h1{
            margin: 0 0 6px;
            font-size: 2rem;
            color: var(--ink);
        }
        p {
            line-height: 1.5;
            color: var(--text);
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 20px 0 26px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
        }
        li {
            padding: 8px 14px;
            background: var(--mint);
            border: 3px solid var(--ink);
            border-radius: 999px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
            color: var(--ink);
        }
        li:active {
            transform: scale(0.98);
        }

        button {
            font: inherit;
            font-weight: bold;
            padding: 14px 28px;
            color: #000000;
            background: var(--sun);
            border: 4px solid var(--ink);
            border-radius: 16px;
            box-shadow: 5px 5px 0 var(--ink);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0 var(--ink);
        }
        button:active {
            transform: translate(5px, 5px);
            box-shadow: 0 0 0 var(--ink);
        }
        button:focus-visible {
            outline: 4px solid var(--coral);
            outline-offset: 4px;
        }
        #hello {
            min-height: 1.5em;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--ink);
        }

        #myModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #closeModal {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: var(--sun);
            border: 4px solid var(--ink);
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            z-index: 1001;
            box-shadow: 5px 5px 0 var(--ink);
            color: #000000;
        }
        #closeModal:active {
            transform: translate(5px, 5px);
            box-shadow: 0 0 0 var(--ink);
        }
        #modalContent {
            width: 98%;
            height: 98%;
            background: var(--paper);
            border-radius: 20px;
            border: 4px solid var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: var(--ink);
        }

        /* --- ШАПКА --- */
        .top-bar {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 999;
            pointer-events: none;
        }
        
        .top-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            pointer-events: auto;
        }

        .corner-btn {
            padding: 10px 15px;
            background: var(--mint);
            border: 3px solid var(--ink);
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--ink);
            color: #000000;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .corner-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 0 0 0 var(--ink);
        }

        #btn-quests {
            background: var(--sun);
            position: relative;
        }

        .badge {
            display: none;
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff4d4d;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--ink);
            font-size: 13px;
            font-weight: bold;
            justify-content: center;
            align-items: center;
            animation: popIn 0.3s ease-out;
        }

        /* --- КНОПКА МОНЕТ --- */
        .coin-balance {
            background: var(--paper);
            border: 3px solid var(--ink);
            border-radius: 12px;
            padding: 6px 12px;
            font-weight: bold;
            font-size: 18px;
            color: var(--ink);
            box-shadow: 3px 3px 0 var(--ink);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .coin-icon {
            width: 26px;
            height: 26px;
            background: radial-gradient(circle at 30% 30%, #fff4a3, #ffd23f 40%, #d4a000 80%);
            border: 2px solid var(--ink);
            border-radius: 50%;
            box-shadow: inset 0 -2px 4px rgba(0,0,0,0.3), 0 2px 0 var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #8b6500;
            font-weight: 900;
            position: relative;
        }
        .coin-icon::after {
            content: '★';
            font-size: 12px;
            color: #b8860b;
            text-shadow: 0 1px 0 #fff5cc;
        }

        @media (max-width: 550px) {
            .card { margin-top: 110px; }
            .corner-btn { padding: 8px 12px; font-size: 14px; }
            .coin-balance { padding: 6px 10px; font-size: 16px; }
            .coin-icon { width: 22px; height: 22px; }
        }

        #btn-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            padding: 0;
            border-radius: 50%;
            font-size: 24px;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 998;
        }

        /* --- МЕНЮ КВЕСТОВ (СТАРАЯ СТРУКТУРА, НОВЫЕ ЦВЕТА) --- */
        .quests-container {
            width: 100%;
            height: 100%;
            padding: 20px;
            background: linear-gradient(180deg, #3ddbb0 0%, #2bc19a 100%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }
        
        .quest-header {
            text-align: center;
            margin-bottom: 10px;
            background: var(--paper);
            padding: 15px;
            border: 4px solid var(--ink);
            border-radius: 16px;
            box-shadow: 5px 5px 0 var(--ink);
        }
        .quest-header h2 {
            margin: 0 0 5px;
            color: var(--ink);
            font-size: 26px;
        }
        .quest-header p {
            margin: 0;
            color: var(--text);
            font-size: 14px;
            font-weight: bold;
        }

        .quest-card {
            background: var(--paper);
            border: 4px solid var(--ink);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 5px 5px 0 var(--ink);
            transition: all 0.3s;
        }
        
        .quest-card.completed {
            background: #a8f0d8; /* Светло-мятный для выполненных */
            border-color: var(--ink);
        }

        .quest-icon {
            font-size: 35px;
            width: 55px;
            height: 55px;
            display: grid;
            place-items: center;
            background: #fff;
            border-radius: 12px;
            border: 3px solid var(--ink);
            flex-shrink: 0;
        }

        .quest-info {
            flex: 1;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .quest-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--ink);
        }
        .quest-desc {
            font-size: 12px;
            color: var(--text);
            line-height: 1.2;
        }
        .quest-progress {
            font-size: 11px;
            font-weight: bold;
            color: var(--ink);
            margin-top: 4px;
            background: rgba(0,0,0,0.08);
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
            align-self: flex-start;
        }

        .quest-reward {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 70px;
            border-left: 2px dashed rgba(0,0,0,0.2);
            padding-left: 10px;
            flex-shrink: 0;
        }
        .quest-reward-amount {
            font-size: 18px;
            font-weight: bold;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .quest-reward-amount .coin-icon {
            width: 20px;
            height: 20px;
            font-size: 10px;
        }
        
        .claim-btn {
            background: var(--sun);
            border: 3px solid var(--ink);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--ink);
            margin-top: 6px;
            width: 100%;
            color: #000;
            text-transform: uppercase;
        }
        .claim-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 0 0 0 var(--ink);
        }
        .claim-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: 3px 3px 0 var(--ink);
            color: #666;
        }

        /* --- ОСТАЛЬНОЕ --- */
        .settings-panel {
            width: 100%;
            height: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            background: var(--paper);
            overflow-y: auto;
        }
        .settings-section {
            margin-bottom: 20px;
            padding: 15px;
            background: var(--settings-bg);
            border: 2px solid var(--ink);
            border-radius: 12px;
        }
        .settings-section h3 {
            margin-top: 0;
            color: var(--ink);
        }
        .avatar-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .avatar-option {
            font-size: 40px;
            cursor: pointer;
            padding: 5px;
            border: 3px solid transparent;
            border-radius: 10px;
            transition: border-color 0.2s;
        }
        .avatar-option.selected {
            border-color: var(--coral);
            background: #fff;
        }
        .stats-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }
        .stats-list li {
            background: transparent;
            border: none;
            padding: 5px 0;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            color: var(--text);
        }
        .btn-danger {
            background: #ff4d4d;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
            margin-top: 10px;
            border: 4px solid #1d1b4d;
            box-shadow: 5px 5px 0 #1d1b4d;
        }

        #welcomeScreen, #deviceScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .welcome-card {
            background: var(--paper);
            padding: 40px;
            border: 4px solid var(--ink);
            border-radius: 28px;
            box-shadow: 10px 10px 0 var(--ink);
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: slideUp 0.6s ease-out;
        }
        .welcome-card h2 {
            color: var(--ink);
            margin-top: 0;
        }
        .welcome-card input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 3px solid var(--ink);
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            background: var(--sun);
            color: #000000;
        }
        .welcome-card input:focus {
            outline: 4px solid var(--coral);
        }

        .device-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .device-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            background: var(--sun);
            border: 4px solid var(--ink);
            border-radius: 16px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 5px 5px 0 var(--ink);
            transition: transform 0.1s, box-shadow 0.1s;
            color: #000;
        }
        .device-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0 var(--ink);
        }
        .device-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0 var(--ink);
        }
        .device-btn span {
            font-size: 32px;
        }

        .games-menu-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--menu-bg);
            transition: background 0.5s;
        }
        .games-menu-header {
            padding: 10px 80px 10px 15px;
            background: #00e5b5;
            border-bottom: 2px solid #1a1a1a;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }
        .games-menu-header h3 {
            margin: 0;
            color: #1a1a1a;
            font-size: 1.1rem;
            white-space: nowrap;
        }
        .games-grid {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            flex: 1;
            overflow-y: auto;
        }
        .game-cell {
            width: 33.33%;
            height: 25%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--game-cell-bg);
            cursor: pointer;
            border: 1px solid var(--game-cell-border);
            font-size: 14px;
            font-weight: bold;
            flex-direction: column;
            color: var(--ink);
            transition: background 0.2s;
            padding: 5px;
            text-align: center;
        }
        .game-cell:hover {
            filter: brightness(0.9);
        }
        .game-cell span {
            font-size: 40px;
            margin-bottom: 5px;
        }

        .random-game-footer {
            padding: 15px;
            background: var(--menu-bg);
            border-top: 2px solid var(--game-cell-border);
            display: flex;
            justify-content: center;
        }
        .random-game-btn {
            width: 100%;
            max-width: 300px;
            padding: 15px;
            background: #ffd23f;
            border: 4px solid var(--ink);
            border-radius: 16px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 5px 5px 0 var(--ink);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .random-game-btn:active {
            transform: translate(5px, 5px);
            box-shadow: 0 0 0 var(--ink);
        }

        .color-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: border-color 0.2s, transform 0.2s;
        }
        .color-option:hover {
            transform: scale(1.1);
        }
        .color-option.selected {
            border-color: var(--coral);
            box-shadow: 0 0 0 2px var(--paper);
        }

        .modern-game-bg {
            background: linear-gradient(145deg, #0f0c29, #302b63, #24243e);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        .embedded-game {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            color: #fff;
            overflow-y: auto;
        }
        .embedded-game h2 {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            margin-top: 0;
        }
        .ttt-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            width: 240px;
            height: 240px;
            margin-bottom: 15px;
        }
        .ttt-cell {
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            font-size: 40px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            padding: 0;
            box-shadow: none;
            transition: background 0.2s, border-color 0.2s;
        }
        .ttt-cell:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
            transform: none;
            box-shadow: none;
        }
        .ttt-status {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 15px;
            min-height: 25px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            text-align: center;
        }
        .guess-input {
            padding: 10px;
            font-size: 18px;
            width: 120px;
            text-align: center;
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            outline: none;
        }
        .guess-input:focus {
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        .guess-message {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin: 10px 0;
            min-height: 25px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            text-align: center;
        }
        .guess-attempts {
            color: #aaa;
            margin-top: 15px;
        }
        .modern-game-bg button {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 3px solid rgba(255, 255, 255, 0.5);
            box-shadow: none;
        }
        .modern-game-bg button:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: none;
            transform: none;
        }
        .modern-game-bg button:active {
            background: rgba(255, 255, 255, 0.3);
            transform: none;
        }

        .device-switch {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .device-switch-btn {
            flex: 1;
            min-width: 90px;
            padding: 10px;
            background: var(--paper);
            border: 3px solid var(--ink);
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 3px 3px 0 var(--ink);
            transition: transform 0.1s, box-shadow 0.1s;
            color: var(--ink);
        }
        .device-switch-btn.active {
            background: var(--sun);
            color: #000;
        }
        .device-switch-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 0 0 0 var(--ink);
        }

        .game-canvas {
            border-radius: 12px;
            background: #1a1a2e;
            border: 3px solid rgba(255, 255, 255, 0.3);
            max-width: 100%;
            touch-action: none;
        }
        .hangman-word {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 8px;
            margin: 20px 0;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            text-align: center;
        }
        .hangman-letters {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            max-width: 400px;
            margin-top: 15px;
        }
        .hangman-letter-btn {
            width: 40px;
            height: 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            box-shadow: none;
            padding: 0;
        }
        .hangman-letter-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }
        .rps-choices {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .rps-choice {
            font-size: 60px;
            cursor: pointer;
            padding: 15px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s;
            user-select: none;
        }
        .rps-choice:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        .rps-result {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            margin: 15px 0;
            min-height: 30px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            text-align: center;
        }
        .reaction-target {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #3ddbb0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            cursor: pointer;
            margin: 20px auto;
            transition: background 0.2s;
        }
        .color-game-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }
        .color-game-btn {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            cursor: pointer;
            border: 4px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.2s;
        }
        .color-game-btn:hover {
            transform: scale(1.1);
        }
        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 280px;
            margin: 20px auto;
        }
        .puzzle-cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
        }
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 280px;
            margin: 20px auto;
        }
        .memory-card {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            color: #fff;
            user-select: none;
        }
        .memory-card.flipped {
            background: #3ddbb0;
        }
        .memory-card.matched {
            background: #ffd23f;
            color: #000;
        }
        .ttt-difficulty {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .ttt-diff-btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: none;
        }
        .ttt-diff-btn.active {
            background: #ffd23f;
            color: #000;
            border-color: #ffd23f;
        }

        .drawing-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px;
            width: 100%;
            height: 100%;
            background: var(--paper);
            overflow-y: auto;
        }
        .drawing-menu-btn {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: var(--mint);
            border: 3px solid var(--ink);
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            color: var(--ink);
            text-align: left;
            box-shadow: 4px 4px 0 var(--ink);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .drawing-menu-btn:active {
            transform: scale(0.98);
        }
        .drawing-menu-btn span {
            font-size: 32px;
        }
        .drawing-menu-btn div {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .drawing-menu-btn small {
            font-size: 12px;
            font-weight: normal;
            opacity: 0.7;
        }
        
        .drawing-workspace {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
            height: 100%;
            padding: 15px;
            background: #f0f0f0;
            box-sizing: border-box;
            align-items: center;
            justify-content: center;
        }
        .drawing-canvas-area {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: #fff;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            flex: 1;
            height: 100%;
            max-width: 850px;
            justify-content: center;
        }
        .drawing-canvas-area canvas {
            background: #fff;
            border: 2px solid #ccc;
            border-radius: 8px;
            touch-action: none;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .drawing-side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 200px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-height: 100%;
            overflow-y: auto;
        }
        .bot-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            margin-bottom: 5px;
        }
        .bot-face {
            font-size: 50px;
            animation: float 2s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .bot-text {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            line-height: 1.3;
            min-height: 36px;
        }
        .side-btn {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #ccc;
            background: #f9f9f9;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 2px 2px 0 #ccc;
            transition: transform 0.1s;
        }
        .side-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }
        .side-btn.check-btn {
            background: #3ddbb0;
            border-color: #1d1b4d;
            box-shadow: 3px 3px 0 #1d1b4d;
            font-size: 16px;
            padding: 14px;
        }
        .side-btn.next-btn {
            background: #ffd23f;
            border-color: #1d1b4d;
            box-shadow: 3px 3px 0 #1d1b4d;
            font-size: 16px;
            padding: 14px;
        }
        .side-btn.active-tool {
            background: #ffd23f;
            border-color: #1d1b4d;
            box-shadow: 2px 2px 0 #1d1b4d;
        }
        .color-palette {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .color-swatch {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #ccc;
            cursor: pointer;
            padding: 0;
        }
        .color-swatch.active {
            border-color: #ff6b6b;
            box-shadow: 0 0 0 2px #fff, 0 0 0 4px #ff6b6b;
        }
        .task-sample {
            max-width: 100%;
            border: 2px dashed #aaa;
            border-radius: 8px;
            background: #fff;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .drawing-workspace {
                flex-direction: column-reverse;
                padding: 5px;
                gap: 10px;
            }
            .drawing-side-panel {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
                padding: 10px;
                gap: 10px;
                height: auto;
                max-height: 40vh;
            }
            .bot-container {
                flex-direction: row;
                width: 100%;
                justify-content: center;
                margin-bottom: 0;
                gap: 10px;
            }
            .bot-face {
                font-size: 30px;
            }
            .bot-text {
                font-size: 12px;
                min-height: auto;
            }
            .side-btn {
                padding: 8px 12px;
                font-size: 13px;
                flex: 1 1 auto;
                text-align: center;
            }
            .color-palette {
                width: 100%;
                justify-content: center;
            }
            .color-swatch {
                width: 30px;
                height: 30px;
            }
            .drawing-canvas-area {
                padding: 5px;
                width: 100%;
                flex: 1;
                min-height: 0;
                height: 100%;
            }
        }
    </style>
</head>
<body>

    <div id="welcomeScreen">
        <div class="welcome-card">
            <h2>Добро пожаловать!</h2>
            <p>Давай познакомимся. Как тебя зовут?</p>
            <input type="text" id="inputName" placeholder="Введи своё имя..." maxlength="20">
            <button onclick="saveName()" style="width: 100%;">Далее ▶</button>
        </div>
    </div>

    <div id="deviceScreen" style="display: none;">
        <div class="welcome-card">
            <h2>С какого устройства вы зашли?</h2>
            <p>Это поможет нам настроить интерфейс и игры под вас.</p>
            <div class="device-options">
                <div class="device-btn" onclick="saveDevice('phone')">
                    <span>📱</span> Телефон
                </div>
                <div class="device-btn" onclick="saveDevice('tablet')">
                    <span>📟</span> Планшет
                </div>
                <div class="device-btn" onclick="saveDevice('desktop')">
                    <span>💻</span> Компьютер
                </div>
            </div>
        </div>
    </div>

    <!-- Шапка -->
    <div class="top-bar">
        <div class="top-group">
            <button id="btn-quests" class="corner-btn" onclick="openQuests()">
                📜 Квесты
                <span id="quest-badge" class="badge">1</span>
            </button>
            <div class="coin-balance">
                <div class="coin-icon"></div>
                <span id="coin-display">0</span>
            </div>
        </div>
        <div class="top-group">
            <button id="btn-settings" class="corner-btn">⚙️</button>
            <button id="btn-share" class="corner-btn">🔗 Поделиться</button>
        </div>
    </div>

    <main class="card">
        <div class="avatar" id="avatar">🐢</div>
        <h1 id="mainTitle">Привет, я Александр!</h1>
        <p id="greetingText">Учусь на веб-дизайнера</p>
        <ul>
            <li id="btn-games">🎮 Игры</li>
            <li id="btn-paint">🎨 Рисование</li>
            <li id="btn-space">🚀 Космос</li>
            <li id="btn-cats">🐱 Котики</li>
        </ul>
        <button id="btn">Нажми меня</button>
        <p id="hello"></p>
    </main>

    <button id="btn-top" title="Наверх">⬆️</button>

    <div id="myModal">
        <button id="closeModal">Закрыть ❌</button>
        <div id="modalContent"></div>
    </div>

    <script>
        // ============================================
        // === ОБЪЯВЛЕНИЕ ДАННЫХ (Должно быть в начале) ===
        // ============================================

        const desktopGames = [
            'dino', '2048', 'blockblast', 'sudoku', 'watersort', 'onet',
            'tictactoe', 'guessnumber', 'flappybird',
            'hangman', 'rps', 'reaction', 'colorgame', 'puzzle', 'memory'
        ];
        
        const mobileGames = [
            'blockblast', 'sudoku', 'watersort', 'onet',
            'tictactoe', 'guessnumber', 'flappybird',
            'hangman', 'rps', 'reaction', 'colorgame', 'puzzle', 'memory',
            'taptrainer', 'counter'
        ];

        const gameInfo = {
            'dino': { icon: '🦖', name: 'Динозаврик' },
            '2048': { icon: '🧩', name: '2048' },
            'blockblast': { icon: '🧱', name: 'Block Blast' },
            'sudoku': { icon: '🔢', name: 'Судоку' },
            'watersort': { icon: '🧪', name: 'Water Sort' },
            'onet': { icon: '🀄', name: 'Onet' },
            'tictactoe': { icon: '⭕', name: 'Крестики-нолики' },
            'guessnumber': { icon: '🎯', name: 'Угадай число' },
            'flappybird': { icon: '🐦', name: 'Flappy Bird' },
            'hangman': { icon: '🔤', name: 'Виселица' },
            'rps': { icon: '✊', name: 'Камень-ножницы' },
            'reaction': { icon: '⚡', name: 'Реакция' },
            'colorgame': { icon: '🎨', name: 'Угадай цвет' },
            'puzzle': { icon: '🔢', name: 'Пазл с числами' },
            'memory': { icon: '🃏', name: 'Найди пару' },
            'taptrainer': { icon: '👆', name: 'Тап-тренер' },
            'counter': { icon: '🔘', name: 'Счётчик' }
        };

        const avatars = ["🐢", "🦊", "🐼", "🦖", "🐱", "🐶", "🦁", "🐸", "🐵", "🐧", "🦄", "🐉"];
        const avatarColors = [
            { name: 'Жёлтый', hex: '#ffd23f' },
            { name: 'Мятный', hex: '#3ddbb0' },
            { name: 'Коралловый', hex: '#ff6b6b' },
            { name: 'Голубой', hex: '#6bc5ff' },
            { name: 'Лавандовый', hex: '#b19cd9' },
            { name: 'Персиковый', hex: '#ffb347' },
            { name: 'Розовый', hex: '#ff99cc' },
            { name: 'Салатовый', hex: '#a8e6cf' },
            { name: 'Серый', hex: '#c0c0c0' },
            { name: 'Белый', hex: '#ffffff' }
        ];

        // ============================================
        // === СИСТЕМА КВЕСТОВ И МОНЕТ ===
        // ============================================
        
        function generateQuests() {
            let quests = [];
            
            // Общие квесты
            quests.push({ id: 'c_1', title: 'Разминка', desc: 'Нажми кнопку «Нажми меня» 5 раз.', icon: '👆', target: 5, reward: 20 });
            quests.push({ id: 'c_2', title: 'Кликер', desc: 'Нажми кнопку «Нажми меня» 10 раз.', icon: '👆', target: 10, reward: 50 });
            quests.push({ id: 'c_3', title: 'Мастер клика', desc: 'Нажми кнопку «Нажми меня» 25 раз.', icon: '👆', target: 25, reward: 100 });
            quests.push({ id: 'c_4', title: 'Геймер', desc: 'Запусти любую игру 1 раз.', icon: '🎮', target: 1, reward: 15 });
            quests.push({ id: 'c_5', title: 'Игроман', desc: 'Запусти игры 3 раза.', icon: '🎮', target: 3, reward: 30 });
            quests.push({ id: 'c_6', title: 'Художник', desc: 'Открой раздел Рисование 1 раз.', icon: '🖌️', target: 1, reward: 20 });
            quests.push({ id: 'c_7', title: 'Исследователь', desc: 'Запусти игры 5 раз.', icon: '🎮', target: 5, reward: 50 });
            quests.push({ id: 'c_8', title: 'Победитель', desc: 'Победи в Крестики-нолики 1 раз.', icon: '⭕', target: 1, reward: 80 });
            quests.push({ id: 'c_9', title: 'Алхимик', desc: 'Пройди 1 уровень Water Sort.', icon: '🧪', target: 1, reward: 80 });
            quests.push({ id: 'c_10', title: 'Мега-кликер', desc: 'Нажми кнопку «Нажми меня» 50 раз.', icon: '👆', target: 50, reward: 200 });

            const gamesList = ['dino', '2048', 'blockblast', 'sudoku', 'watersort', 'onet', 'tictactoe', 'guessnumber', 'flappybird', 'hangman', 'rps', 'reaction', 'colorgame', 'puzzle', 'memory', 'taptrainer', 'counter'];
            
            // Генерируем квесты на основе запуска игр
            gamesList.forEach(game => {
                if (!gameInfo[game]) return;
                const icon = gameInfo[game].icon;
                const name = gameInfo[game].name;
                
                [1, 3, 5, 10].forEach((count, idx) => {
                    quests.push({
                        id: `g_${game}_${count}`,
                        title: `${name}: Уровень ${idx + 1}`,
                        desc: `Запусти игру ${name} ${count} раз(а).`,
                        icon: icon,
                        target: count,
                        reward: 15 * (idx + 1) + 10
                    });
                });
            });

            // Добиваем до 100
            while(quests.length < 100) {
                quests.push({
                    id: `extra_${quests.length}`,
                    title: `Испытание ${quests.length}`,
                    desc: `Запусти любую игру ${quests.length} раз.`,
                    icon: '🎮',
                    target: quests.length,
                    reward: quests.length * 5
                });
            }

            return quests.slice(0, 100);
        }

        const questsData = generateQuests();

        let playerCoins = parseInt(localStorage.getItem('playerCoins') || '0');
        let playerQuests = JSON.parse(localStorage.getItem('playerQuests') || '{}');

        questsData.forEach(q => {
            if (!playerQuests[q.id]) {
                playerQuests[q.id] = { progress: 0, claimed: false };
            }
        });

        function saveQuestData() {
            localStorage.setItem('playerCoins', playerCoins);
            localStorage.setItem('playerQuests', JSON.stringify(playerQuests));
            updateCoinDisplay();
            updateQuestBadge();
        }

        function updateCoinDisplay() {
            const el = document.getElementById('coin-display');
            if (el) el.textContent = playerCoins;
        }

        function updateQuestBadge() {
            const badge = document.getElementById('quest-badge');
            if (!badge) return;
            
            let hasClaimable = false;
            questsData.forEach(q => {
                const state = playerQuests[q.id];
                if (state.progress >= q.target && !state.claimed) {
                    hasClaimable = true;
                }
            });
            badge.style.display = hasClaimable ? 'flex' : 'none';
        }

        function addQuestProgress(questId, amount = 1) {
            if (!playerQuests[questId]) return;
            const quest = questsData.find(q => q.id === questId);
            if (!quest) return;

            const state = playerQuests[questId];
            if (state.claimed || state.progress >= quest.target) return;

            state.progress += amount;
            if (state.progress > quest.target) state.progress = quest.target;
            
            saveQuestData();
        }

        function openQuests() {
            const sortedQuests = [...questsData].sort((a, b) => {
                const stateA = playerQuests[a.id];
                const stateB = playerQuests[b.id];
                
                const aReady = stateA.progress >= a.target && !stateA.claimed;
                const bReady = stateB.progress >= b.target && !stateB.claimed;
                
                if (aReady && !bReady) return -1;
                if (!aReady && bReady) return 1;
                if (stateA.claimed && !stateB.claimed) return 1;
                if (!stateA.claimed && stateB.claimed) return -1;
                return 0;
            });

            let html = `<div class="quests-container">
                <div class="quest-header">
                    <h2>📜 Квесты</h2>
                    <p>Выполняй задания и получай монеты!</p>
                </div>
            `;

            sortedQuests.forEach(q => {
                const state = playerQuests[q.id];
                const isCompleted = state.progress >= q.target;
                const isClaimed = state.claimed;
                const progressText = isClaimed ? 'Получено' : `${state.progress} / ${q.target}`;

                html += `
                    <div class="quest-card ${isCompleted ? 'completed' : ''}">
                        <div class="quest-icon">${q.icon}</div>
                        <div class="quest-info">
                            <div class="quest-title">${q.title}</div>
                            <div class="quest-desc">${q.desc}</div>
                            <div class="quest-progress">${progressText}</div>
                        </div>
                        <div class="quest-reward">
                            <div class="quest-reward-amount">
                                <div class="coin-icon"></div>
                                ${q.reward}
                            </div>
                            ${isCompleted && !isClaimed 
                                ? `<button class="claim-btn" onclick="claimQuest('${q.id}')">Забрать</button>` 
                                : ''}
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            openModal(html);
        }

        function claimQuest(questId) {
            const quest = questsData.find(q => q.id === questId);
            const state = playerQuests[questId];
            
            if (!quest || !state || state.claimed || state.progress < quest.target) return;

            state.claimed = true;
            playerCoins += quest.reward;
            saveQuestData();
            
            openQuests();
        }

        // ============================================
        // === ОСТАЛЬНОЙ КОД ПРИЛОЖЕНИЯ ===
        // ============================================

        const welcomeScreen = document.getElementById("welcomeScreen");
        const deviceScreen = document.getElementById("deviceScreen");
        const inputName = document.getElementById("inputName");
        const mainTitle = document.getElementById("mainTitle");
        const greetingText = document.getElementById("greetingText");

        const savedName = localStorage.getItem("userName");
        const savedDevice = localStorage.getItem("userDevice");

        if (savedName) {
            welcomeScreen.style.display = "none";
            mainTitle.textContent = `Привет, ${savedName}!`;
            greetingText.textContent = "Как прошёл твой день? Надеюсь, отлично! Давай поиграем?";
            
            if (savedDevice) {
                deviceScreen.style.display = "none";
                applyDeviceSettings(savedDevice);
            } else {
                deviceScreen.style.display = "flex";
            }
        } else {
            welcomeScreen.style.display = "flex";
            deviceScreen.style.display = "none";
        }

        function saveName() {
            const name = inputName.value.trim();
            if (name === "") {
                alert("Пожалуйста, введи своё имя!");
                return;
            }
            localStorage.setItem("userName", name);
            welcomeScreen.style.display = "none";
            mainTitle.textContent = `Привет, ${name}!`;
            greetingText.textContent = "Как прошёл твой день? Надеюсь, отлично! Давай поиграем?";
            deviceScreen.style.display = "flex";
        }

        inputName.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                saveName();
            }
        });

        function saveDevice(device) {
            localStorage.setItem("userDevice", device);
            deviceScreen.style.display = "none";
            applyDeviceSettings(device);
        }

        function applyDeviceSettings(device) {
            window.userDevice = device;

        let tttBoard = ['', '', '', '', '', '', '', '', ''];

        function initTicTacToe() {
            tttBoard = ['', '', '', '', '', '', '', '', ''];

        function renderTicTacToe() {
            const boardEl = document.getElementById('ttt-board');
            if (!boardEl) return;
            boardEl.innerHTML = '';
            tttBoard.forEach((cell, index) => {
                const btn = document.createElement('button');

        function handleTicTacToeClick(index) {
            if (!tttGameActive || tttBoard[index] !== '' || tttCurrentPlayer !== 'X') return;
            
            tttBoard[index] = 'X';
            tttCurrentPlayer = 'O';
            renderTicTacToe();
            
            if (checkTicTacToeWin('X')) {
                document.getElementById('ttt-status').textContent = '🎉 Ты победил!';
                tttGameActive = false;
                addQuestProgress('c_8', 1);
                return;
            }
            if (tttBoard.every(cell => cell !== '')) {
                document.getElementById('ttt-status').textContent = '🤝 Ничья!';
                tttGameActive = false;
                return;
            }

            document.getElementById('ttt-status').textContent = 'Ход бота (⭕)...';
            
            setTimeout(() => {
                if (!tttGameActive) return;
                botMove();
            }, 500);
        }

        function botMove() {
            const emptyCells = tttBoard.map((cell, index) => cell === '' ? index : null).filter(val => val !== null);
            if (emptyCells.length === 0) return;
            
            let chosenIndex = null;
            
            if (tttDifficulty === 'easy') {
                chosenIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            } else if (tttDifficulty === 'medium') {
                if (Math.random() < 0.5) {
                    chosenIndex = getBestMove('O') ?? getBestMove('X') ?? emptyCells[Math.floor(Math.random() * emptyCells.length)];
                } else {
                    chosenIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                }
            } else {
                chosenIndex = getBestMove('O') ?? getBestMove('X') ?? emptyCells[Math.floor(Math.random() * emptyCells.length)];
            }
            
            if (chosenIndex === null || chosenIndex === undefined) {
                chosenIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            }
            
            tttBoard[chosenIndex] = 'O';
            tttCurrentPlayer = 'X';
            renderTicTacToe();

            if (checkTicTacToeWin('O')) {
                document.getElementById('ttt-status').textContent = '😢 Бот победил!';
                tttGameActive = false;
                return;
            }
            if (tttBoard.every(cell => cell !== '')) {
                document.getElementById('ttt-status').textContent = '🤝 Ничья!';
                tttGameActive = false;
                return;
            }
            document.getElementById('ttt-status').textContent = 'Твой ход (❌)';
        }

        function getBestMove(player) {
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            for (let p of winPatterns) {
                const vals = p.map(i => tttBoard[i]);
                const countPlayer = vals.filter(v => v === player).length;
                const countEmpty = vals.filter(v => v === '').length;
                if (countPlayer === 2 && countEmpty === 1) {
                    return p[vals.indexOf('')];
                }
            }
            return null;
        }

        function checkTicTacToeWin(player) {
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            return winPatterns.some(pattern => pattern.every(index => tttBoard[index] === player));
        }

        const FLAPPY_CFG = {
            gravity: 520,
            jumpVelocity: -320,

        function initFlappy() {
            const canvas = document.getElementById('flappyCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            flappyState = {
                birdY: 250, birdV: 0, pipes: [], score: 0, running: false,

                    else if (flappyState.running) flappyState.birdV = FLAPPY_CFG.jumpVelocity;
                }
            };

            canvas.ontouchstart = (e) => {
                e.preventDefault();

                else if (flappyState.running) flappyState.birdV = FLAPPY_CFG.jumpVelocity;
            };
        }

        function drawFlappy(ctx) {
            const w = 400, h = 500;
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, w, h);

            flappyState.pipes.forEach(p => {
                const gap = FLAPPY_CFG.pipeGap;
                ctx.fillStyle = '#4dffcc'; 
                ctx.fillRect(p.x, 0, 60, p.top);
                ctx.fillRect(p.x, p.top + gap, 60, h - p.top - gap);
                
                ctx.strokeStyle = '#1a1a2e';
                ctx.lineWidth = 2;
                ctx.strokeRect(p.x, 0, 60, p.top);
                ctx.strokeRect(p.x, p.top + gap, 60, h - p.top - gap);

                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(p.x + 8, 0, 10, p.top);
                ctx.fillRect(p.x + 8, p.top + gap, 10, h - p.top - gap);
            });

            ctx.save();
            ctx.translate(80, flappyState.birdY);
            const angle = Math.max(-0.5, Math.min(0.9, flappyState.birdV * 0.0015));
            ctx.rotate(angle);
            ctx.fillStyle = '#ffd23f';
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1d1b4d';
            ctx.beginPath();
            ctx.arc(5, -5, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.moveTo(12, 2);
            ctx.lineTo(22, 5);
            ctx.lineTo(12, 8);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Счёт: ' + flappyState.score, w / 2, 40);

            if (flappyState.gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 36px sans-serif';
                ctx.fillText('Игра окончена!', w / 2, h / 2 - 20);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 24px sans-serif';
                ctx.fillText('Счёт: ' + flappyState.score, w / 2, h / 2 + 20);
                ctx.font = '16px sans-serif';
                ctx.fillStyle = '#aaa';
                ctx.fillText('Нажми, чтобы начать заново', w / 2, h / 2 + 60);
            }

            if (!flappyState.running && !flappyState.gameOver && flappyState.frame === 0) {
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText('Нажми ПРОБЕЛ или кликни', w / 2, h / 2 + 80);
                ctx.font = '14px sans-serif';
                ctx.fillStyle = '#aaa';
                ctx.fillText('чтобы птичка летела вверх', w / 2, h / 2 + 105);
            }
        }

        function startFlappy() {
            const canvas = document.getElementById('flappyCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            flappyState = {
                birdY: 250, birdV: 0, pipes: [], score: 0, running: true,
                gameOver: false, animId: null, frame: 0,
                lastTime: performance.now(), pipeSpawnTimer: 0,
                startDelayTimer: FLAPPY_CFG.startDelay
            };
            flappyState.birdV = FLAPPY_CFG.firstJumpVelocity;
            flappyState.animId = requestAnimationFrame((t) => flappyLoop(t, ctx));
        }

        function flappyLoop(now, ctx) {
            if (!flappyState.running) return;

            let dt = (now - flappyState.lastTime) / 1000;
            flappyState.lastTime = now;
            if (dt > 0.05) dt = 0.05;
            if (dt <= 0) dt = 0.016;

            flappyState.frame++;

            flappyState.birdV += FLAPPY_CFG.gravity * dt;
            if (flappyState.birdV > FLAPPY_CFG.maxFallSpeed) {
                flappyState.birdV = FLAPPY_CFG.maxFallSpeed;
            }
            flappyState.birdY += flappyState.birdV * dt;

            if (flappyState.birdY > 485 || flappyState.birdY < 15) {
                flappyState.running = false;
                flappyState.gameOver = true;
                drawFlappy(ctx);
                return;
            }

            if (flappyState.startDelayTimer > 0) {
                flappyState.startDelayTimer -= dt;
            } else {
                flappyState.pipeSpawnTimer += dt;
                if (flappyState.pipeSpawnTimer >= FLAPPY_CFG.pipeInterval) {
                    flappyState.pipeSpawnTimer -= FLAPPY_CFG.pipeInterval;
                    const minTop = 60;
                    const maxTop = 500 - FLAPPY_CFG.pipeGap - 60;
                    const top = minTop + Math.random() * (maxTop - minTop);
                    flappyState.pipes.push({ x: 400, top: top });
                }
            }

            flappyState.pipes.forEach(p => p.x -= FLAPPY_CFG.pipeSpeed * dt);
            flappyState.pipes = flappyState.pipes.filter(p => p.x > -60);

            for (let p of flappyState.pipes) {
                const gap = FLAPPY_CFG.pipeGap;
                if (80 + 15 > p.x && 80 - 15 < p.x + 60) {
                    if (flappyState.birdY - 15 < p.top || flappyState.birdY + 15 > p.top + gap) {
                        flappyState.running = false;
                        flappyState.gameOver = true;
                        drawFlappy(ctx);
                        return;
                    }
                }
                if (!p.scored && p.x + 60 < 80) {
                    p.scored = true;
                    flappyState.score++;
                }
            }

            drawFlappy(ctx);
            flappyState.animId = requestAnimationFrame((t) => flappyLoop(t, ctx));
        }

        function initHangman() {

        function renderHangman() {

            const lettersEl = document.getElementById('hangman-letters');
            const statusEl = document.getElementById('hangman-status');
            if (!wordEl || !lettersEl || !statusEl) return;
            
            wordEl.textContent = hangmanState.word.split('').map(l =>

        function guessHangmanLetter(letter) {
            if (hangmanState.gameOver || hangmanState.guessed.has(letter)) return;
            hangmanState.guessed.add(letter);
            
            if (!hangmanState.word.includes(letter)) {
                hangmanState.wrong++;
            }
            
            const won = hangmanState.word.split('').every(l => hangmanState.guessed.has(l));
            if (won || hangmanState.wrong >= hangmanState.maxWrong) {
                hangmanState.gameOver = true;
            }

        }

        // --- ПАЗЛ С ЧИСЛАМИ ---
        let puzzleState = {};

        function shuffleArray(arr) {
            const array = [...arr];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initPuzzle() {
            const gridNumbers = shuffleArray(Array.from({length: 12}, (_, i) => i + 1));
            const searchQueue = shuffleArray(Array.from({length: 12}, (_, i) => i + 1));
            
            puzzleState = { 
                gridNumbers: gridNumbers,
                searchQueue: searchQueue,
                currentIndex: 0
            };
            
            renderPuzzle();

        function renderPuzzle() {
            const grid = document.getElementById('puzzle-grid');
            if (!grid) return;
            grid.innerHTML = '';
            
            puzzleState.gridNumbers.forEach((num) => {
                const cell = document.createElement('div');
                cell.className = 'puzzle-cell';
                cell.textContent = num;
                cell.onclick = () => clickPuzzle(num, cell);
                grid.appendChild(cell);
            });
            
            const targetNumber = puzzleState.searchQueue[puzzleState.currentIndex];
            document.getElementById('puzzle-status').textContent = `Найди число: ${targetNumber}`;
        }

        function clickPuzzle(num, cell) {
            const targetNumber = puzzleState.searchQueue[puzzleState.currentIndex];
            
            if (num === targetNumber) {
                cell.style.background = '#3ddbb0';
                cell.style.color = '#000';
                cell.style.pointerEvents = 'none';
                
                puzzleState.currentIndex++;
                
                if (puzzleState.currentIndex >= 12) {
