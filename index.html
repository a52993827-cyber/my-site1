<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт</title>
    <style>
        :root {
            --ink: #1d1b4d;
            --sun: #ffd23f;
            --coral: #ff6b6b;
            --mint: #3ddbb0;
            --paper: #fff8ec;
            --bg: linear-gradient(135deg, #ff6b6b, #ffd23f, #3ddbb0);
            --text: #333;
            --settings-bg: #f0f0f0;
            --menu-bg: #f0f0f0;
            --game-cell-bg: #e8e8e8;
            --game-cell-border: #bbb;
            --avatar-bg: #ffd23f;
        }

        body.dark-theme {
            --ink: #d0d0d0;
            --sun: #e6b800;
            --coral: #ff6b6b;
            --mint: #2e8b57;
            --paper: #2a2a2a;
            --bg: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            --text: #b0b0b0;
            --settings-bg: #3a3a3a;
            --menu-bg: #2a2a2a;
            --game-cell-bg: #3a3a3a;
            --game-cell-border: #555;
        }

        * { box-sizing: border-box;}
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            transition: background 0.5s;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px 28px;
            background: var(--paper);
            border: 4px solid var(--ink);
            border-radius: 28px;
            box-shadow: 10px 10px 0 var(--ink);
            text-align: center;
            animation: slideUp 0.6s ease-out;
            transition: background 0.5s, border-color 0.5s;
        }
        .avatar {
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            font-size: 60px;
            background: var(--avatar-bg);
            border: 4px solid var(--ink);
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.5s, border-color 0.5s, transform 0.2s;
            user-select: none;
        }
        .avatar:active {
            transform: scale(0.95);
        }
        h1{
            margin: 0 0 6px;
            font-size: 2rem;
            color: var(--ink);
        }
        p {
            line-height: 1.5;
            color: var(--text);
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 20px 0 26px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
        }
        li {
            padding: 8px 14px;
            background: var(--mint);
            border: 3px solid var(--ink);
            border-radius: 999px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
            color: var(--ink);
        }
        li:active {
            transform: scale(0.98);
        }

        /* --- КНОПКИ --- */
        button {
            font: inherit;
            font-weight: bold;
            padding: 14px 28px;
            color: #000000;
            background: var(--sun);
            border: 4px solid var(--ink);
            border-radius: 16px;
            box-shadow: 5px 5px 0 var(--ink);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0 var(--ink);
        }
        button:active {
            transform: translate(5px, 5px);
            box-shadow: 0 0 0 var(--ink);
        }
        button:focus-visible {
            outline: 4px solid var(--coral);
            outline-offset: 4px;
        }
        #hello {
            min-height: 1.5em;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--ink);
        }

        /* --- МОДАЛЬНОЕ ОКНО --- */
        #myModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #closeModal {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: var(--sun);
            border: 4px solid var(--ink);
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            z-index: 1001;
            box-shadow: 5px 5px 0 var(--ink);
            color: #000000;
        }
        #closeModal:active {
            transform: translate(5px, 5px);
            box-shadow: 0 0 0 var(--ink);
        }
        #modalContent {
            width: 90%;
            height: 90%;
            background: var(--paper);
            border-radius: 20px;
            border: 4px solid var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: var(--ink);
        }

        .corner-btn {
            position: fixed;
            top: 20px;
            z-index: 999;
            padding: 10px 20px;
            background: var(--mint);
            border: 3px solid var(--ink);
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--ink);
            color: #000000;
        }

        #btn-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            padding: 0;
            border-radius: 50%;
            font-size: 24px;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 998;
        }

        /* --- ПАНЕЛЬ НАСТРОЕК --- */
        .settings-panel {
            width: 100%;
            height: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            background: var(--paper);
            overflow-y: auto;
        }
        .settings-section {
            margin-bottom: 20px;
            padding: 15px;
            background: var(--settings-bg);
            border: 2px solid var(--ink);
            border-radius: 12px;
        }
        .settings-section h3 {
            margin-top: 0;
            color: var(--ink);
        }
        .avatar-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .avatar-option {
            font-size: 40px;
            cursor: pointer;
            padding: 5px;
            border: 3px solid transparent;
            border-radius: 10px;
            transition: border-color 0.2s;
        }
        .avatar-option.selected {
            border-color: var(--coral);
            background: #fff;
        }
        .stats-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }
        .stats-list li {
            background: transparent;
            border: none;
            padding: 5px 0;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            color: var(--text);
        }
        .btn-danger {
            background: #ff4d4d;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
            margin-top: 10px;
            border: 4px solid #1d1b4d;
            box-shadow: 5px 5px 0 #1d1b4d;
        }

        /* --- ОКНО РЕГИСТРАЦИИ --- */
        #welcomeScreen, #deviceScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .welcome-card {
            background: var(--paper);
            padding: 40px;
            border: 4px solid var(--ink);
            border-radius: 28px;
            box-shadow: 10px 10px 0 var(--ink);
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: slideUp 0.6s ease-out;
        }
        .welcome-card h2 {
            color: var(--ink);
            margin-top: 0;
        }
        .welcome-card input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 3px solid var(--ink);
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            background: var(--sun);
            color: #000000;
        }
        .welcome-card input:focus {
            outline: 4px solid var(--coral);
        }

        /* --- ВЫБОР УСТРОЙСТВА --- */
        .device-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .device-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            background: var(--sun);
            border: 4px solid var(--ink);
            border-radius: 16px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 5px 5px 0 var(--ink);
            transition: transform 0.1s, box-shadow 0.1s;
            color: #000;
        }
        .device-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0 var(--ink);
        }
        .device-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0 var(--ink);
        }
        .device-btn span {
            font-size: 32px;
        }

        /* --- МЕНЮ ИГР --- */
        .games-menu-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--menu-bg);
            transition: background 0.5s;
        }
        .games-menu-header {
            padding: 10px 70px 10px 10px;
            background: #00e5b5;
            border-bottom: 2px solid #1a1a1a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        .games-menu-header h3 {
            margin: 0;
            color: #1a1a1a;
        }
        .random-btn {
            padding: 5px 15px;
            background: #ffd23f;
            border: 2px solid #1a1a1a;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 0 #1a1a1a;
            color: #000;
        }
        .games-grid {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            flex: 1;
            overflow-y: auto;
        }
        .game-cell {
            width: 33%;
            height: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--game-cell-bg);
            cursor: pointer;
            border: 1px solid var(--game-cell-border);
            font-size: 16px;
            font-weight: bold;
            flex-direction: column;
            color: var(--ink);
            transition: background 0.2s;
        }
        .game-cell:hover {
            filter: brightness(0.9);
        }
        .game-cell span {
            font-size: 60px;
            margin-bottom: 5px;
        }

        /* --- ПАЛИТРА ЦВЕТОВ ДЛЯ АВАТАРКИ --- */
        .color-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: border-color 0.2s, transform 0.2s;
        }
        .color-option:hover {
            transform: scale(1.1);
        }
        .color-option.selected {
            border-color: var(--coral);
            box-shadow: 0 0 0 2px var(--paper);
        }

        /* --- СОВРЕМЕННЫЙ ФОН ДЛЯ ВСТРОЕННЫХ ИГР --- */
        .modern-game-bg {
            background: linear-gradient(145deg, #0f0c29, #302b63, #24243e);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        .embedded-game {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            color: #fff;
        }
        .embedded-game h2 {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            margin-top: 0;
        }
        .ttt-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            width: 240px;
            height: 240px;
            margin-bottom: 15px;
        }
        .ttt-cell {
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            font-size: 40px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            padding: 0;
            box-shadow: none;
            transition: background 0.2s, border-color 0.2s;
        }
        .ttt-cell:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
            transform: none;
            box-shadow: none;
        }
        .ttt-status {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 15px;
            min-height: 25px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }
        .guess-input {
            padding: 10px;
            font-size: 18px;
            width: 120px;
            text-align: center;
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            outline: none;
        }
        .guess-input:focus {
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        .guess-message {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin: 10px 0;
            min-height: 25px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }
        .guess-attempts {
            color: #aaa;
            margin-top: 15px;
        }
        /* Переопределяем стили кнопок внутри современных игр */
        .modern-game-bg button {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 3px solid rgba(255, 255, 255, 0.5);
            box-shadow: none;
        }
        .modern-game-bg button:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: none;
            transform: none;
        }
        .modern-game-bg button:active {
            background: rgba(255, 255, 255, 0.3);
            transform: none;
        }
    </style>
</head>
<body>

    <!-- Окно приветствия (Имя) -->
    <div id="welcomeScreen">
        <div class="welcome-card">
            <h2>Добро пожаловать!</h2>
            <p>Давай познакомимся. Как тебя зовут?</p>
            <input type="text" id="inputName" placeholder="Введи своё имя..." maxlength="20">
            <button onclick="saveName()" style="width: 100%;">Далее ▶</button>
        </div>
    </div>

    <!-- Окно выбора устройства -->
    <div id="deviceScreen" style="display: none;">
        <div class="welcome-card">
            <h2>С какого устройства вы зашли?</h2>
            <p>Это поможет нам настроить интерфейс и игры под вас.</p>
            <div class="device-options">
                <div class="device-btn" onclick="saveDevice('phone')">
                    <span>📱</span> Телефон
                </div>
                <div class="device-btn" onclick="saveDevice('tablet')">
                    <span>📟</span> Планшет
                </div>
                <div class="device-btn" onclick="saveDevice('desktop')">
                    <span>💻</span> Компьютер
                </div>
            </div>
        </div>
    </div>

    <button id="btn-settings" class="corner-btn" style="left: 20px;">⚙️</button>
    <button id="btn-share" class="corner-btn" style="right: 20px;">🔗 Поделиться</button>

    <main class="card">
        <div class="avatar" id="avatar">🐢</div>
        <h1 id="mainTitle">Привет, я Александр!</h1>
        <p id="greetingText">Учусь на веб-дизайнера</p>
        <ul>
            <li id="btn-games">🎮 Игры</li>
            <li id="btn-paint">🎨 Рисование</li>
            <li id="btn-space">🚀 Космос</li>
            <li id="btn-cats">🐱 Котики</li>
        </ul>
        <button id="btn">Нажми меня</button>
        <p id="hello"></p>
    </main>

    <button id="btn-top" title="Наверх">⬆️</button>

    <div id="myModal">
        <button id="closeModal">Закрыть ❌</button>
        <div id="modalContent">
            <!-- Контент появится здесь -->
        </div>
    </div>

    <script>
        // --- РЕГИСТРАЦИЯ / ПРИВЕТСТВИЕ ---
        const welcomeScreen = document.getElementById("welcomeScreen");
        const deviceScreen = document.getElementById("deviceScreen");
        const inputName = document.getElementById("inputName");
        const mainTitle = document.getElementById("mainTitle");
        const greetingText = document.getElementById("greetingText");

        // Проверяем, сохранены ли имя и устройство
        const savedName = localStorage.getItem("userName");
        const savedDevice = localStorage.getItem("userDevice");

        if (savedName) {
            welcomeScreen.style.display = "none";
            mainTitle.textContent = `Привет, ${savedName}!`;
            greetingText.textContent = "Как прошёл твой день? Надеюсь, отлично! Давай поиграем?";
            
            if (savedDevice) {
                deviceScreen.style.display = "none";
                applyDeviceSettings(savedDevice);
            } else {
                deviceScreen.style.display = "flex";
            }
        } else {
            welcomeScreen.style.display = "flex";
            deviceScreen.style.display = "none";
        }

        function saveName() {
            const name = inputName.value.trim();
            if (name === "") {
                alert("Пожалуйста, введи своё имя!");
                return;
            }
            localStorage.setItem("userName", name);
            welcomeScreen.style.display = "none";
            mainTitle.textContent = `Привет, ${name}!`;
            greetingText.textContent = "Как прошёл твой день? Надеюсь, отлично! Давай поиграем?";
            
            // Показываем экран выбора устройства
            deviceScreen.style.display = "flex";
        }

        inputName.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                saveName();
            }
        });

        // --- ВЫБОР УСТРОЙСТВА ---
        function saveDevice(device) {
            localStorage.setItem("userDevice", device);
            deviceScreen.style.display = "none";
            applyDeviceSettings(device);
        }

        function applyDeviceSettings(device) {
            // Сохраняем устройство в глобальную переменную для использования в играх
            window.userDevice = device;
            
            // Можно добавить визуальные изменения, если нужно
            if (device === 'phone') {
                // Например, немного уменьшить отступы на телефоне
                document.body.style.padding = '12px';
            } else {
                document.body.style.padding = '24px';
            }
        }

        // --- Данные ---
        const avatars = ["🐢", "🦊", "🐼", "🦖", "🐱", "🐶", "🦁", "🐸", "🐵", "🐧", "🦄", "🐉"];
        // Список всех игр
        const allGamesList = ['dino', '2048', 'blockblast', 'sudoku', 'watersort', 'onet', 'tictactoe', 'guessnumber'];
        
        // Функция для получения доступных игр в зависимости от устройства
        function getAvailableGames() {
            const device = localStorage.getItem("userDevice");
            if (device === 'phone' || device === 'tablet') {
                // Исключаем игры, которые не работают на мобильных
                return allGamesList.filter(game => game !== 'dino' && game !== '2048');
            }
            return allGamesList;
        }

        const avatarColors = [
            { name: 'Жёлтый', hex: '#ffd23f' },
            { name: 'Мятный', hex: '#3ddbb0' },
            { name: 'Коралловый', hex: '#ff6b6b' },
            { name: 'Голубой', hex: '#6bc5ff' },
            { name: 'Лавандовый', hex: '#b19cd9' },
            { name: 'Персиковый', hex: '#ffb347' },
            { name: 'Розовый', hex: '#ff99cc' },
            { name: 'Салатовый', hex: '#a8e6cf' },
            { name: 'Серый', hex: '#c0c0c0' },
            { name: 'Белый', hex: '#ffffff' }
        ];

        // --- Тёмная тема ---
        const body = document.body;
        if (localStorage.getItem("theme") === "dark") {
            body.classList.add("dark-theme");
        }

        // --- Загрузка аватара и его цвета ---
        const avatarElement = document.getElementById("avatar");
        const savedAvatar = localStorage.getItem("savedAvatar") || "🐢";
        avatarElement.textContent = savedAvatar;

        const savedAvatarColor = localStorage.getItem("savedAvatarColor") || "#ffd23f";
        document.documentElement.style.setProperty('--avatar-bg', savedAvatarColor);

        // --- Модальное окно ---
        const modal = document.getElementById("myModal");
        const modalContent = document.getElementById("modalContent");
        const closeBtn = document.getElementById("closeModal");

        function openModal(htmlContent) {
            modalContent.innerHTML = htmlContent;
            modal.style.display = "flex";
        }

        closeBtn.addEventListener("click", () => {
            modal.style.display = "none";
            modalContent.innerHTML = "";
        });

        function closeModalFunc() {
            modal.style.display = "none";
            modalContent.innerHTML = "";
        }

        // --- 1. Кнопка "Нажми меня" ---
        const phrases = ["Ура, я это сделал!"];
        let n = 0;
        document.getElementById("btn").addEventListener("click", function () {
            document.getElementById("hello").textContent = phrases[n % phrases.length];
            n++;
        });

        // --- 2. Настройки ---
        document.getElementById("btn-settings").addEventListener("click", () => {
            const isDark = body.classList.contains("dark-theme");
            const currentAvatar = localStorage.getItem("savedAvatar") || "🐢";
            const currentName = localStorage.getItem("userName") || "Гость";
            const currentColor = localStorage.getItem("savedAvatarColor") || "#ffd23f";
            const currentDevice = localStorage.getItem("userDevice") || "Не выбрано";

            // Для статистики используем все игры, чтобы видеть полную картину
            let statsHtml = '';
            allGamesList.forEach(game => {
                let count = parseInt(localStorage.getItem("playCount_" + game) || "0");
                let names = {
                    'dino': '🦖 Динозаврик',
                    '2048': '🧩 2048',
                    'blockblast': '🧱 Block Blast',
                    'sudoku': '🔢 Судоку',
                    'watersort': '🧪 Water Sort',
                    'onet': '🀄 Onet',
                    'tictactoe': '⭕ Крестики-нолики',
                    'guessnumber': '🔢 Угадай число'
                };
                statsHtml += `<li><span>${names[game]}</span> <span>${count} раз</span></li>`;
            });

            let colorOptionsHtml = avatarColors.map(color => `
                <div class="color-option ${color.hex === currentColor ? 'selected' : ''}" 
                     style="background-color: ${color.hex};" 
                     title="${color.name}"
                     onclick="selectAvatarColor('${color.hex}')">
                </div>
            `).join('');

            openModal(`
                <div class="settings-panel">
                    <h2 style="text-align: center; margin-top: 0;">⚙️ Настройки</h2>
                    
                    <div class="settings-section">
                        <h3>Твоё имя</h3>
                        <p style="font-size: 20px; font-weight: bold;">${currentName}</p>
                        <button onclick="changeName()" style="width: 100%; padding: 10px; margin-top: 10px;">✏️ Сменить имя</button>
                    </div>

                    <div class="settings-section">
                        <h3>Твоё устройство</h3>
                        <p style="font-size: 20px; font-weight: bold; text-transform: capitalize;">${currentDevice === 'phone' ? '📱 Телефон' : currentDevice === 'tablet' ? '📟 Планшет' : currentDevice === 'desktop' ? '💻 Компьютер' : 'Не выбрано'}</p>
                        <button onclick="changeDevice()" style="width: 100%; padding: 10px; margin-top: 10px;">🔄 Сменить устройство</button>
                    </div>
                    
                    <div class="settings-section">
                        <h3>Выбери аватар</h3>
                        <div class="avatar-list">
                            ${avatars.map(emoji => `
                                <span class="avatar-option ${emoji === currentAvatar ? 'selected' : ''}" 
                                      onclick="selectAvatar('${emoji}')">${emoji}</span>
                            `).join('')}
                        </div>
                    </div>

                    <div class="settings-section">
                        <h3>Цвет фона аватарки</h3>
                        <div class="color-list">
                            ${colorOptionsHtml}
                        </div>
                    </div>

                    <div class="settings-section">
                        <h3>Тема оформления</h3>
                        <button onclick="toggleThemeFromSettings()" style="width: 100%; padding: 10px;">
                            ${isDark ? '☀️ Включить светлую тему' : '🌙 Включить тёмную тему'}
                        </button>
                    </div>
                    
                    <div class="settings-section">
                        <h3>Статистика игр</h3>
                        <ul class="stats-list">${statsHtml}</ul>
                    </div>
                    
                    <div class="settings-section" style="border-color: #ff4d4d;">
                        <h3 style="color: #ff4d4d;">Опасная зона</h3>
                        <button class="btn-danger" onclick="resetAllSettings()">🗑️ Сбросить всё</button>
                    </div>
                </div>
            `);
        });

        function changeName() {
            const newName = prompt("Введи новое имя:", localStorage.getItem("userName") || "");
            if (newName && newName.trim() !== "") {
                localStorage.setItem("userName", newName.trim());
                mainTitle.textContent = `Привет, ${newName.trim()}!`;
                document.getElementById("btn-settings").click();
            }
        }

        function changeDevice() {
            // Сбрасываем устройство, чтобы показать экран выбора заново
            localStorage.removeItem("userDevice");
            document.getElementById("btn-settings").click(); // Закрываем настройки
            deviceScreen.style.display = "flex"; // Показываем экран выбора
        }

        function selectAvatar(emoji) {
            localStorage.setItem("savedAvatar", emoji);
            avatarElement.textContent = emoji;
            document.querySelectorAll('.avatar-option').forEach(el => {
                el.classList.toggle('selected', el.textContent === emoji);
            });
        }

        function selectAvatarColor(hex) {
            localStorage.setItem("savedAvatarColor", hex);
            document.documentElement.style.setProperty('--avatar-bg', hex);
            document.getElementById("btn-settings").click();
        }

        function toggleThemeFromSettings() {
            body.classList.toggle("dark-theme");
            const isDark = body.classList.contains("dark-theme");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            document.getElementById("btn-settings").click();
        }

        function resetAllSettings() {
            if (confirm("Сбросить ВСЕ настройки, имя и статистику?")) {
                localStorage.clear();
                location.reload();
            }
        }

        // --- 3. ИГРЫ ---
        function backToGamesMenu() {
            document.getElementById("btn-games").click();
        }

        function saveGameResult(game) {
            let count = parseInt(localStorage.getItem("playCount_" + game) || "0") + 1;
            localStorage.setItem("playCount_" + game, count);
        }

        document.getElementById("btn-games").addEventListener("click", () => {
            const availableGames = getAvailableGames();
            
            // Формируем HTML для доступных игр
            let gamesHtml = '';
            availableGames.forEach(game => {
                let icon = '';
                let name = '';
                if (game === 'dino') { icon = '🦖'; name = 'Динозаврик'; }
                else if (game === '2048') { icon = '🧩'; name = '2048'; }
                else if (game === 'blockblast') { icon = '🧱'; name = 'Block Blast'; }
                else if (game === 'sudoku') { icon = '🔢'; name = 'Судоку'; }
                else if (game === 'watersort') { icon = '🧪'; name = 'Water Sort'; }
                else if (game === 'onet') { icon = '🀄'; name = 'Onet'; }
                else if (game === 'tictactoe') { icon = '⭕'; name = 'Крестики-нолики'; }
                else if (game === 'guessnumber') { icon = '🎯'; name = 'Угадай число'; }
                
                gamesHtml += `<div class="game-cell" onclick="showRules('${game}')"><span>${icon}</span>${name}</div>`;
            });

            openModal(`
                <div class="games-menu-container">
                    <div class="games-menu-header">
                        <h3>Выбери игру:</h3>
                        <button class="random-btn" onclick="startRandomGame()">🎲 Случайная</button>
                    </div>
                    <div class="games-grid">
                        ${gamesHtml}
                    </div>
                </div>
            `);
        });

        function startRandomGame() {
            const availableGames = getAvailableGames();
            const randomGame = availableGames[Math.floor(Math.random() * availableGames.length)];
            showRules(randomGame);
        }

        function showRules(gameType) {
            let rulesText = "";
            let warningText = ""; 

            if (gameType === 'dino') {
                rulesText = "Нажимай ПРОБЕЛ или СТРЕЛКУ ВВЕРХ, чтобы динозаврик прыгал. Не врезайся в кактусы!";
                warningText = "Перед началом игры обязательно нажми левой кнопкой мыши по игровому полю! К сожалению игра на мобильных устройствах не работает! Спасибо за понимание.";
            } else if (gameType === '2048') {
                rulesText = "Используй СТРЕЛКИ на клавиатуре, чтобы двигать плитки. Соединяй одинаковые цифры, чтобы получить 2048!";
                warningText = "Перед началом игры обязательно нажми левой кнопкой мыши по игровому полю! К сожалению игра на мобильных устройствах не работает! Спасибо за понимание.";
            } else if (gameType === 'blockblast') {
                rulesText = "Перетаскивай блоки на поле, чтобы заполнить линии и очистить их. Игра закончится, когда не будет места для нового блока.";
                warningText = "Перед началом игры нажми левой кнопкой мыши по полю, чтобы игра слушала твои действия!";
            } else if (gameType === 'sudoku') {
                rulesText = "Заполни сетку 9x9 цифрами от 1 до 9 так, чтобы в каждой строке, столбце и квадрате 3x3 цифры не повторялись.";
                warningText = "Перед началом игры нажми левой кнопкой мыши по полю, чтобы игра слушала твои действия!";
            } else if (gameType === 'watersort') {
                rulesText = "Переливай воду между колбами, чтобы собрать в каждой колбе воду одного цвета. Нажимай на колбу, чтобы выбрать, и на другую — чтобы перелить.";
                warningText = "Перед началом игры нажми левой кнопкой мыши по полю, чтобы игра слушала твои действия!";
            } else if (gameType === 'onet') {
                rulesText = "Находи одинаковые картинки и соединяй их линией, которая не пересекает другие картинки. Соединяй как можно быстрее!";
                warningText = "Перед началом игры нажми левой кнопкой мыши по полю, чтобы игра слушала твои действия!";
            } else if (gameType === 'tictactoe') {
                rulesText = "Классические крестики-нолики. Ты играешь за ❌, бот — за ⭕. Нажимай на пустые клетки, чтобы сделать ход. Побеждает тот, кто первым соберёт три своих знака в ряд!";
                warningText = "";
            } else if (gameType === 'guessnumber') {
                rulesText = "Я загадал число от 1 до 100. Попробуй угадать его за минимальное количество попыток! После каждой попытки я подскажу, больше или меньше твоё число.";
                warningText = "";
            }

            openModal(`
                <div style="width: 100%; height: 100%; display: flex; flex-direction: column; background: #fff8ec; padding: 20px; box-sizing: border-box;">
                    <h2 style="color: #1d1b4d; text-align: center;">Правила игры</h2>
                    <p style="color: #333; font-size: 18px; line-height: 1.6; flex: 1;">${rulesText}</p>
                    ${warningText ? `<p style="color: red; font-weight: bold; font-size: 16px; margin-bottom: 20px;">${warningText}</p>` : ''}
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <button onclick="backToGamesMenu()" style="padding: 12px 24px; background: #ff4d4d; border: 4px solid #1d1b4d; border-radius: 16px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 5px 5px 0 #1d1b4d; color: white;">← В меню игр</button>
                        <button onclick="startGame('${gameType}')" style="padding: 12px 24px; background: #3ddbb0; border: 4px solid #1d1b4d; border-radius: 16px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 5px 5px 0 #1d1b4d;">Играть ▶</button>
                    </div>
                </div>
            `);
        }

        // --- ЗАПУСК ИГР ---
        function startGame(gameType) {
            saveGameResult(gameType);

            if (gameType === 'tictactoe') {
                openModal(`
                    <div class="modern-game-bg" style="width: 100%; height: 100%;">
                        <div class="embedded-game" id="ttt-container">
                            <h2>Крестики-нолики</h2>
                            <div class="ttt-status" id="ttt-status">Твой ход (❌)</div>
                            <div class="ttt-board" id="ttt-board"></div>
                            <button onclick="resetTicTacToe()">Новая игра</button>
                        </div>
                    </div>
                `);
                setTimeout(() => initTicTacToe(), 50);
                return;
            }

            if (gameType === 'guessnumber') {
                openModal(`
                    <div class="modern-game-bg" style="width: 100%; height: 100%;">
                        <div class="embedded-game" id="guess-container">
                            <h2>Угадай число (1-100)</h2>
                            <div class="guess-message" id="guess-message">Введи число и нажми "Проверить"</div>
                            <input type="number" class="guess-input" id="guess-input" min="1" max="100">
                            <div style="display: flex; gap: 10px; margin-top: 10px;">
                                <button onclick="checkGuess()">Проверить</button>
                                <button onclick="resetGuessGame()">Заново</button>
                            </div>
                            <p class="guess-attempts" id="guess-attempts">Попыток: 0</p>
                        </div>
                    </div>
                `);
                setTimeout(() => initGuessGame(), 50);
                return;
            }

            let gameUrl = '';
            if (gameType === 'dino') gameUrl = 'https://imkennyyip.github.io/chrome-dinosaur-game/';
            else if (gameType === '2048') gameUrl = 'https://monicatvera.github.io/2048/';
            else if (gameType === 'blockblast') gameUrl = 'https://blockblast.pro/';
            else if (gameType === 'sudoku') gameUrl = 'https://sudokum.ru/';
            else if (gameType === 'watersort') gameUrl = 'https://cpscount.com/water-sort/';
            else if (gameType === 'onet') gameUrl = 'https://gamesnacks.com/games/onetconnectclassic/';

            openModal(`
                <div style="width: 100%; height: 100%; display: flex; flex-direction: column;">
                    <div style="padding: 10px; background: #1a1a1a; display: flex; gap: 10px; justify-content: center;">
                        <button onclick="backToGamesMenu()" style="padding: 8px 20px; background: #ff4d4d; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; box-shadow: none;">❌ Выйти в меню</button>
                    </div>
                    <iframe src="${gameUrl}" style="width: 100%; height: 100%; border: none;" allowfullscreen></iframe>
                </div>
            `);
        }

        // --- ЛОГИКА КРЕСТИКОВ-НОЛИКОВ ---
        let tttBoard = ['', '', '', '', '', '', '', '', ''];
        let tttCurrentPlayer = 'X';
        let tttGameActive = true;
        let tttBotEnabled = true;

        function initTicTacToe() {
            tttBoard = ['', '', '', '', '', '', '', '', ''];
            tttCurrentPlayer = 'X';
            tttGameActive = true;
            tttBotEnabled = true;
            renderTicTacToe();
            document.getElementById('ttt-status').textContent = 'Твой ход (❌)';
        }

        function renderTicTacToe() {
            const boardEl = document.getElementById('ttt-board');
            if (!boardEl) return;
            boardEl.innerHTML = '';
            tttBoard.forEach((cell, index) => {
                const btn = document.createElement('button');
                btn.className = 'ttt-cell';
                btn.textContent = cell;
                btn.onclick = () => handleTicTacToeClick(index);
                boardEl.appendChild(btn);
            });
        }

        function handleTicTacToeClick(index) {
            if (!tttGameActive || tttBoard[index] !== '' || tttCurrentPlayer !== 'X') return;
            
            tttBoard[index] = 'X';
            tttCurrentPlayer = 'O';
            renderTicTacToe();
            
            if (checkTicTacToeWin('X')) {
                document.getElementById('ttt-status').textContent = '🎉 Ты победил!';
                tttGameActive = false;
                return;
            }
            if (tttBoard.every(cell => cell !== '')) {
                document.getElementById('ttt-status').textContent = '🤝 Ничья!';
                tttGameActive = false;
                return;
            }

            document.getElementById('ttt-status').textContent = 'Ход бота (⭕)...';
            
            setTimeout(() => {
                if (!tttGameActive) return;
                botMove();
            }, 500);
        }

        function botMove() {
            const emptyCells = tttBoard.map((cell, index) => cell === '' ? index : null).filter(val => val !== null);
            if (emptyCells.length === 0) return;
            
            const randomIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            tttBoard[randomIndex] = 'O';
            tttCurrentPlayer = 'X';
            renderTicTacToe();

            if (checkTicTacToeWin('O')) {
                document.getElementById('ttt-status').textContent = '😢 Бот победил!';
                tttGameActive = false;
                return;
            }
            if (tttBoard.every(cell => cell !== '')) {
                document.getElementById('ttt-status').textContent = '🤝 Ничья!';
                tttGameActive = false;
                return;
            }
            document.getElementById('ttt-status').textContent = 'Твой ход (❌)';
        }

        function checkTicTacToeWin(player) {
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            return winPatterns.some(pattern => pattern.every(index => tttBoard[index] === player));
        }

        function resetTicTacToe() {
            initTicTacToe();
        }

        // --- ЛОГИКА УГАДАЙ ЧИСЛО ---
        let guessTarget = 0;
        let guessAttempts = 0;

        function initGuessGame() {
            guessTarget = Math.floor(Math.random() * 100) + 1;
            guessAttempts = 0;
            const msg = document.getElementById('guess-message');
            if (msg) {
                msg.textContent = 'Введи число и нажми "Проверить"';
                msg.style.color = '#fff';
            }
            const input = document.getElementById('guess-input');
            if (input) input.value = '';
            const att = document.getElementById('guess-attempts');
            if (att) att.textContent = 'Попыток: 0';
        }

        function checkGuess() {
            const input = document.getElementById('guess-input');
            const message = document.getElementById('guess-message');
            const attemptsEl = document.getElementById('guess-attempts');
            
            if (!input || !message || !attemptsEl) return;

            const guess = parseInt(input.value);
            if (isNaN(guess) || guess < 1 || guess > 100) {
                message.textContent = 'Пожалуйста, введи число от 1 до 100.';
                message.style.color = '#ff6b6b';
                return;
            }

            guessAttempts++;
            attemptsEl.textContent = `Попыток: ${guessAttempts}`;

            if (guess === guessTarget) {
                message.textContent = `🎉 Поздравляю! Ты угадал число ${guessTarget} за ${guessAttempts} попыток!`;
                message.style.color = '#3ddbb0';
            } else if (guess < guessTarget) {
                message.textContent = `📈 Моё число больше, чем ${guess}.`;
                message.style.color = '#ff6b6b';
            } else {
                message.textContent = `📉 Моё число меньше, чем ${guess}.`;
                message.style.color = '#ff6b6b';
            }
            input.value = '';
            input.focus();
        }

        function resetGuessGame() {
            initGuessGame();
        }

        // --- ОСТАЛЬНЫЕ КНОПКИ ---
        document.getElementById("btn-paint").addEventListener("click", () => {
            openModal(`<iframe src="https://jspaint.app/" style="width: 100%; height: 100%; border: none;"></iframe>`);
        });

        document.getElementById("btn-space").addEventListener("click", () => {
            openModal(`<img src="space.gif.gif" alt="Космос" style="max-width: 100%; max-height: 100%; object-fit: contain;">`);
        });

        document.getElementById("btn-cats").addEventListener("click", () => {
            openModal(`<img src="cat.jpeg.JPEG" alt="Котик" style="max-width: 100%; max-height: 100%; object-fit: contain;">`);
        });

        document.getElementById("btn-share").addEventListener("click", async () => {
            const url = "https://a52993827-cyber.github.io/my-site/html/";
            try {
                await navigator.clipboard.writeText(url);
                alert("Ссылка скопирована! Можешь отправить её другу: " + url);
            } catch (err) {
                prompt("Скопируй эту ссылку и отправь другу:", url);
            }
        });

        // Кнопка "Наверх"
        const btnTop = document.getElementById("btn-top");
        window.addEventListener("scroll", () => {
            if (window.scrollY > 200) {
                btnTop.style.display = "flex";
            } else {
                btnTop.style.display = "none";
            }
        });
        btnTop.addEventListener("click", () => {
            window.scrollTo({ top: 0, behavior: "smooth" });
        });
    </script>
</body>
</html>
