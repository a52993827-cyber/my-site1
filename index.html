        let minesweeperState = {};
        function initMinesweeper() {
            const cols = 8;
            const rows = 8;
            const minesCount = 10;
            
            let board = [];
            let mines = new Set();
            
            // Расставляем мины
            while (mines.size < minesCount) {
                mines.add(Math.floor(Math.random() * rows * cols));
            }
            
            for (let i = 0; i < rows * cols; i++) {
                board.push({
                    isMine: mines.has(i),
                    isRevealed: false,
                    isFlagged: false,
                    neighborMines: 0
                });
            }
            
            // Считаем соседей
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    if (board[i * cols + j].isMine) continue;
                    let count = 0;
                    for (let dx = -1; dx <= 1; dx++) {
                        for (let dy = -1; dy <= 1; dy++) {
                            if (dx === 0 && dy === 0) continue;
                            const nx = i + dx;
                            const ny = j + dy;
                            if (nx >= 0 && nx < rows && ny >= 0 && ny < cols) {
                                if (board[nx * cols + ny].isMine) count++;
                            }
                        }
                    }
                    board[i * cols + j].neighborMines = count;
                }
            }
            
            minesweeperState = { board, cols, rows, gameOver: false };
            renderMinesweeper();
        }

        function renderMinesweeper() {
            const container = document.getElementById('minesweeper-container');
            if (!container) return;
            
            let html = '<div class="minesweeper-grid">';
            minesweeperState.board.forEach((cell, idx) => {
                let content = '';
                let className = 'minesweeper-cell';
                
                if (cell.isRevealed) {
                    className += ' revealed';
                    if (cell.isMine) {
                        content = '💣';
                        className += ' mine';
                    } else if (cell.neighborMines > 0) {
                        content = cell.neighborMines;
                    }
                } else if (cell.isFlagged) {
                    content = '🚩';
                    className += ' flag';
                }
                
                html += `<div class="${className}" onclick="revealMinesweeperCell(${idx})" oncontextmenu="flagMinesweeperCell(event, ${idx})">${content}</div>`;
            });
            html += '</div>';
            
            if (minesweeperState.gameOver) {
                html += '<button onclick="initMinesweeper()" style="margin-top:10px; background: #3ddbb0; color: #000;">Заново</button>';
            }
            
            container.innerHTML = html;
        }

        function revealMinesweeperCell(idx) {
            if (minesweeperState.gameOver) return;
            const cell = minesweeperState.board[idx];
            if (cell.isRevealed || cell.isFlagged) return;
            
            if (cell.isMine) {
                // Проигрыш
                minesweeperState.gameOver = true;
                minesweeperState.board.forEach(c => c.isRevealed = true);
                renderMinesweeper();
                setTimeout(() => alert('💥 Ты подорвался на мине!'), 100);
                return;
            }
            
            cell.isRevealed = true;
            
            // Если пустая, открываем соседей
            if (cell.neighborMines === 0) {
                const r = Math.floor(idx / minesweeperState.cols);
                const c = idx % minesweeperState.cols;
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        if (dx === 0 && dy === 0) continue;
                        const nr = r + dx;
                        const nc = c + dy;
                        if (nr >= 0 && nr < minesweeperState.rows && nc >= 0 && nc < minesweeperState.cols) {
                            revealMinesweeperCell(nr * minesweeperState.cols + nc);
                        }
                    }
                }
            }
            
            renderMinesweeper();
            checkMinesweeperWin();
        }

        function flagMinesweeperCell(e, idx) {
            e.preventDefault();
            if (minesweeperState.gameOver) return;
            const cell = minesweeperState.board[idx];
            if (cell.isRevealed) return;
            cell.isFlagged = !cell.isFlagged;
            renderMinesweeper();
        }

        function checkMinesweeperWin() {
            const allRevealed = minesweeperState.board.every(c => c.isRevealed || c.isFlagged);
            if (allRevealed) {
                minesweeperState.gameOver = true;
                renderMinesweeper();
                setTimeout(() => alert('🎉 Ты выиграл!'), 100);
            }
        }

        // --- ЗМЕЙКА ---
        let snakeState = {};
        function initSnake() {
            const canvas = document.getElementById('snakeCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            snakeState = {
                snake: [{x: 10, y: 10}],
                direction: {x: 0, y: 0},
                food: {x: 15, y: 15},
                score: 0,
                gameOver: false,
                animId: null,
                lastTime: 0
            };
            
            // Первая еда
            placeSnakeFood();
            
            document.onkeydown = (e) => {
                if (snakeState.gameOver) return;
                switch(e.key) {
                    case 'ArrowUp': if (snakeState.direction.y === 0) snakeState.direction = {x: 0, y: -1}; break;
                    case 'ArrowDown': if (snakeState.direction.y === 0) snakeState.direction = {x: 0, y: 1}; break;
                    case 'ArrowLeft': if (snakeState.direction.x === 0) snakeState.direction = {x: -1, y: 0}; break;
                    case 'ArrowRight': if (snakeState.direction.x === 0) snakeState.direction = {x: 1, y: 0}; break;
                }
            };
            
            drawSnake(ctx);
        }

        function placeSnakeFood() {
            let newFood;
            do {
                newFood = {x: Math.floor(Math.random() * 20), y: Math.floor(Math.random() * 20)};
            } while (snakeState.snake.some(s => s.x === newFood.x && s.y === newFood.y));
            snakeState.food = newFood;
        }

        function drawSnake(ctx) {
            const w = 300, h = 300;
            const cellSize = 15;
            
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, w, h);
            
            // Еда
            ctx.fillStyle = '#ff6b6b';
            ctx.fillRect(snakeState.food.x * cellSize, snakeState.food.y * cellSize, cellSize, cellSize);
            
            // Змейка
            snakeState.snake.forEach((s, i) => {
                ctx.fillStyle = i === 0 ? '#3ddbb0' : '#2e8b57';
                ctx.fillRect(s.x * cellSize, s.y * cellSize, cellSize, cellSize);
            });
            
            // Счёт
            ctx.fillStyle = '#fff';
            ctx.font = '20px Arial';
            ctx.fillText('Счёт: ' + snakeState.score, 10, 25);
            
            if (snakeState.gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Игра окончена!', w/2, h/2 - 20);
                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.fillText('Счёт: ' + snakeState.score, w/2, h/2 + 20);
            }
        }

        function startSnake() {
            const canvas = document.getElementById('snakeCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            initSnake();
            snakeState.direction = {x: 1, y: 0};
            snakeState.lastTime = performance.now();
            snakeState.animId = requestAnimationFrame((t) => snakeLoop(t, ctx));
        }

        function snakeLoop(now, ctx) {
            if (!snakeState.gameOver) {
                const dt = now - snakeState.lastTime;
                if (dt > 150) {
                    snakeState.lastTime = now;
                    
                    const head = {...snakeState.snake[0]};
                    head.x += snakeState.direction.x;
                    head.y += snakeState.direction.y;
                    
                    // Проверка выхода за границы
                    if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20) {
                        snakeState.gameOver = true;
                        drawSnake(ctx);
                        return;
                    }
                    
                    // Проверка на себя
                    if (snakeState.snake.some(s => s.x === head.x && s.y === head.y)) {
                        snakeState.gameOver = true;
                        drawSnake(ctx);
                        return;
                    }
                    
                    snakeState.snake.unshift(head);
                    
                    if (head.x === snakeState.food.x && head.y === snakeState.food.y) {
                        snakeState.score++;
                        placeSnakeFood();
                    } else {
                        snakeState.snake.pop();
                    }
                    
                    drawSnake(ctx);
                }
            }
            
            if (!snakeState.gameOver) {
                snakeState.animId = requestAnimationFrame((t) => snakeLoop(t, ctx));
            }
        }

        // --- АРКАНОИД ---
        let breakoutState = {};
        function initBreakout() {
            const canvas = document.getElementById('breakoutCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            breakoutState = {
                paddleX: 120,
                ballX: 150,
                ballY: 300,
                ballDX: 3,
                ballDY: -3,
                bricks: [],
                score: 0,
                gameOver: false,
                animId: null
            };
            
            // Создаём кирпичи
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 5; c++) {
                    breakoutState.bricks.push({
                        x: c * 60,
                        y: r * 20 + 30,
                        width: 60,
                        height: 20,
                        active: true
                    });
                }
            }
            
            document.onkeydown = (e) => {
                if (e.key === 'ArrowLeft') breakoutState.paddleX = Math.max(0, breakoutState.paddleX - 20);
                if (e.key === 'ArrowRight') breakoutState.paddleX = Math.min(240, breakoutState.paddleX + 20);
            };
            
            canvas.onmousemove = (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                breakoutState.paddleX = Math.max(0, Math.min(240, x - 30));
            };
            
            drawBreakout(ctx);
        }

        function drawBreakout(ctx) {
            const w = 300, h = 400;
            
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, w, h);
            
            // Кирпичи
            breakoutState.bricks.forEach(b => {
                if (b.active) {
                    ctx.fillStyle = '#ff6b6b';
                    ctx.fillRect(b.x, b.y, b.width, b.height);
                    ctx.strokeStyle = '#fff';
                    ctx.strokeRect(b.x, b.y, b.width, b.height);
                }
            });
            
            // Платформа
            ctx.fillStyle = '#3ddbb0';
            ctx.fillRect(breakoutState.paddleX, 370, 60, 10);
            
            // Мяч
            ctx.beginPath();
            ctx.arc(breakoutState.ballX, breakoutState.ballY, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffd23f';
            ctx.fill();
            
            // Счёт
            ctx.fillStyle = '#fff';
            ctx.font = '20px Arial';
            ctx.fillText('Счёт: ' + breakoutState.score, 10, 25);
            
            if (breakoutState.gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Игра окончена!', w/2, h/2 - 20);
                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.fillText('Счёт: ' + breakoutState.score, w/2, h/2 + 20);
            }
        }

        function startBreakout() {
            const canvas = document.getElementById('breakoutCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            initBreakout();
            breakoutState.animId = requestAnimationFrame((t) => breakoutLoop(t, ctx));
        }

        function breakoutLoop(now, ctx) {
            if (breakoutState.gameOver) return;
            
            breakoutState.ballX += breakoutState.ballDX;
            breakoutState.ballY += breakoutState.ballDY;
            
            // Отскок от стен
            if (breakoutState.ballX <= 5 || breakoutState.ballX >= 295) breakoutState.ballDX *= -1;
            if (breakoutState.ballY <= 5) breakoutState.ballDY *= -1;
            
            // Отскок от платформы
            if (breakoutState.ballY >= 360 && breakoutState.ballY <= 375 &&
                breakoutState.ballX >= breakoutState.paddleX && breakoutState.ballX <= breakoutState.paddleX + 60) {
                breakoutState.ballDY = -Math.abs(breakoutState.ballDY);
            }
            
            // Проигрыш
            if (breakoutState.ballY > 400) {
                breakoutState.gameOver = true;
                drawBreakout(ctx);
                return;
            }
            
            // Проверка столкновений с кирпичами
            breakoutState.bricks.forEach(b => {
                if (b.active) {
                    if (breakoutState.ballX > b.x && breakoutState.ballX < b.x + b.width &&
                        breakoutState.ballY > b.y && breakoutState.ballY < b.y + b.height) {
                        b.active = false;
                        breakoutState.ballDY *= -1;
                        breakoutState.score++;
                    }
                }
            });
            
            // Победа
            if (breakoutState.bricks.every(b => !b.active)) {
                breakoutState.gameOver = true;
                drawBreakout(ctx);
                return;
            }
            
            drawBreakout(ctx);
            breakoutState.animId = requestAnimationFrame((t) => breakoutLoop(t, ctx));
        }

        // ============================================
        // === WATER SORT (200 уровней, анимация, звук) ===
        // ============================================

        const WATER_COLORS = [
            '#ff6b6b', '#3ddbb0', '#6bc5ff', '#ffd23f',
            '#b19cd9', '#ffb347', '#ff99cc', '#a8e6cf',
            '#c0c0c0', '#ffffff', '#8b4513', '#00e5b5'
        ];

        const WATER_TUBE_CAPACITY = 4;

        let waterSortState = {
            tubes: [],
            selectedTube: -1,
            level: 1,
            animating: false,
            moves: 0,
            capacity: 4
        };

        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ctx = getAudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'select') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(650, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
                    osc.start(); osc.stop(ctx.currentTime + 0.12);
                } else if (type === 'pour') {
                    const bufferSize = Math.floor(ctx.sampleRate * 0.4);
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
                    }
                    const noise = ctx.createBufferSource();
                    noise.buffer = buffer;
                    const noiseGain = ctx.createGain();
                    noiseGain.gain.setValueAtTime(0.06, ctx.currentTime);
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    noise.connect(noiseGain);
                    noiseGain.connect(ctx.destination);
                    noise.start();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.35);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                    osc.start(); osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'win') {
                    [523, 659, 784, 1047].forEach((freq, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.type = 'square';
                        o.frequency.value = freq;
                        o.connect(g); g.connect(ctx.destination);
                        g.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.12);
                        g.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + i * 0.12 + 0.02);
                        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.12 + 0.25);
                        o.start(ctx.currentTime + i * 0.12);
                        o.stop(ctx.currentTime + i * 0.12 + 0.3);
                    });
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
                    osc.start(); osc.stop(ctx.currentTime + 0.25);
                }
            } catch (e) { /* игнорируем ошибки аудио */ }
        }

        function getLevelConfig(level) {
            let colors, empty, capacity = 4;
            if (level <= 20) { colors = 3; empty = 2; }
            else if (level <= 50) { colors = 4; empty = 2; }
            else if (level <= 90) { colors = 5; empty = 2; }
            else if (level <= 140) { colors = 6; empty = 2; }
            else if (level <= 170) { colors = 7; empty = 1; }
            else { colors = 8; empty = 1; }
            return { colors, empty, capacity, seed: level * 1337 + 42 };
        }

        function mulberry32(seed) {
            return function() {
                seed |= 0; seed = seed + 0x6D2B79F5 | 0;
                let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function shuffleWithRng(arr, rng) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function loadProgress() {
            const saved = parseInt(localStorage.getItem('waterSortLevel') || '1');
            waterSortState.level = Math.max(1, Math.min(200, saved));
        }

        function saveProgress() {
            localStorage.setItem('waterSortLevel', waterSortState.level);
        }

        function initWaterSort() {
            loadProgress();
            buildLevel(waterSortState.level);
            renderWaterSort();
            updateWaterSortHud();
        }

        function buildLevel(level) {
            const cfg = getLevelConfig(level);
            const rng = mulberry32(cfg.seed);

            let liquids = [];
            for (let c = 0; c < cfg.colors; c++) {
                for (let k = 0; k < cfg.capacity; k++) {
                    liquids.push(WATER_COLORS[c % WATER_COLORS.length]);
                }
            }
            liquids = shuffleWithRng(liquids, rng);

            const tubes = [];
            for (let i = 0; i < cfg.colors; i++) {
                const tube = [];
                for (let j = 0; j < cfg.capacity; j++) {
                    tube.push(liquids.pop());
                }
                tubes.push(tube);
            }
            for (let i = 0; i < cfg.empty; i++) tubes.push([]);

            waterSortState.tubes = tubes;
            waterSortState.selectedTube = -1;
            waterSortState.animating = false;
            waterSortState.moves = 0;
            waterSortState.capacity = cfg.capacity;
        }

        function updateWaterSortHud() {
            const lvlEl = document.getElementById('watersort-level');
            const movesEl = document.getElementById('watersort-moves');
            if (lvlEl) lvlEl.textContent = `Уровень ${waterSortState.level} / 200`;
            if (movesEl) movesEl.textContent = `Ходов: ${waterSortState.moves}`;
        }

        function renderWaterSort() {
            const area = document.getElementById('watersort-area');
            if (!area) return;
            area.innerHTML = '';
            area.style.position = 'relative';

            const capacity = waterSortState.capacity || 4;

            waterSortState.tubes.forEach((tube, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'watersort-tube-wrapper';
                wrapper.dataset.index = index;
                wrapper.style.cssText = `
                    position: relative;
                    width: 54px;
                    height: 190px;
                    cursor: pointer;
                    display: flex;
                    justify-content: center;
                    align-items: flex-end;
                    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
                `;

                if (waterSortState.selectedTube === index) {
                    wrapper.style.transform = 'translateY(-18px)';
                }

                const tubeEl = document.createElement('div');
                tubeEl.className = 'watersort-tube';
                tubeEl.style.cssText = `
                    width: 46px;
                    height: 180px;
                    border: 4px solid rgba(255,255,255,0.85);
                    border-top: none;
                    border-radius: 0 0 23px 23px;
                    display: flex;
                    flex-direction: column-reverse;
                    justify-content: flex-start;
                    align-items: stretch;
                    position: relative;
                    background: rgba(0,0,0,0.25);
                    overflow: hidden;
                    transition: border-color 0.2s, box-shadow 0.2s;
                `;

                if (waterSortState.selectedTube === index) {
                    tubeEl.style.borderColor = '#ffd23f';
                    tubeEl.style.boxShadow = '0 0 16px rgba(255,210,63,0.9)';
                }

                tube.forEach(color => {
                    const seg = document.createElement('div');
                    seg.style.cssText = `
                        width: 100%;
                        height: ${100 / capacity}%;
                        background: ${color};
                        flex-shrink: 0;
                        border-bottom: 1px solid rgba(0,0,0,0.12);
                        transition: height 0.25s, opacity 0.25s;
                    `;
                    tubeEl.appendChild(seg);
                });

                wrapper.appendChild(tubeEl);
                wrapper.onclick = () => handleWaterSortClick(index);
                area.appendChild(wrapper);
            });
        }

        function setWaterStatus(text) {
            const el = document.getElementById('watersort-status');
            if (el) el.textContent = text;
        }

        function handleWaterSortClick(index) {
            if (waterSortState.animating) return;

            const tubes = waterSortState.tubes;

            if (waterSortState.selectedTube === index) {
                waterSortState.selectedTube = -1;
                renderWaterSort();
                setWaterStatus('Нажми на колбу, чтобы выбрать');
                playSound('select');
                return;
            }

            if (waterSortState.selectedTube === -1) {
                if (tubes[index].length > 0) {
                    waterSortState.selectedTube = index;
                    renderWaterSort();
                    setWaterStatus('Выбери колбу, куда перелить');
                    playSound('select');
                }
                return;
            }

            const fromIdx = waterSortState.selectedTube;
            const fromTube = tubes[fromIdx];
            const toTube = tubes[index];
            const capacity = waterSortState.capacity;

            if (toTube.length >= capacity) {
                waterSortState.selectedTube = -1;
                renderWaterSort();
                setWaterStatus('Колба полна!');
                playSound('error');
                return;
            }

            const colorToMove = fromTube[fromTube.length - 1];
            const topColor = toTube.length > 0 ? toTube[toTube.length - 1] : null;

            if (toTube.length > 0 && topColor !== colorToMove) {
                waterSortState.selectedTube = -1;
                renderWaterSort();
                setWaterStatus('Нельзя смешивать разные цвета!');
                playSound('error');
                return;
            }

            let count = 0;
            for (let i = fromTube.length - 1; i >= 0; i--) {
                if (fromTube[i] === colorToMove) count++;
                else break;
            }
            const space = capacity - toTube.length;
            const amount = Math.min(count, space);

            animatePour(fromIdx, index, colorToMove, amount);
        }

        function animatePour(fromIdx, toIdx, color, amount) {
            waterSortState.animating = true;
            waterSortState.selectedTube = -1;

            const area = document.getElementById('watersort-area');
            if (!area) { finishPour(fromIdx, toIdx, color, amount); return; }

            const wrappers = area.querySelectorAll('.watersort-tube-wrapper');
            const fromWrapper = wrappers[fromIdx];
            const toWrapper = wrappers[toIdx];

            if (!fromWrapper || !toWrapper) {
                finishPour(fromIdx, toIdx, color, amount);
                return;
            }

            const fromTubeEl = fromWrapper.querySelector('.watersort-tube');
            const toTubeEl = toWrapper.querySelector('.watersort-tube');

            fromWrapper.style.transform = 'translateY(-40px) rotate(35deg)';
            fromWrapper.style.zIndex = '10';
            fromWrapper.style.transition = 'transform 0.3s ease-out';

            const fromRect = fromTubeEl.getBoundingClientRect();
            const toRect = toTubeEl.getBoundingClientRect();
            const areaRect = area.getBoundingClientRect();

            const startX = fromRect.right - 8;
            const startY = fromRect.top + 20;
            const endX = toRect.left + toRect.width / 2;
            const endY = toRect.top;

            const stream = document.createElement('div');
            stream.style.cssText = `
                position: absolute;
                left: ${startX - areaRect.left}px;
                top: ${startY - areaRect.top}px;
                width: 8px;
                height: 0px;
                background: ${color};
                border-radius: 4px;
                pointer-events: none;
                z-index: 20;
                box-shadow: 0 0 8px ${color};
                transform-origin: top center;
                transition: height 0.35s ease-in, left 0.35s ease-in, top 0.35s ease-in;
            `;
            area.appendChild(stream);

            requestAnimationFrame(() => {
                stream.style.left = `${endX - areaRect.left - 4}px`;
                stream.style.top = `${endY - areaRect.top}px`;
                stream.style.height = `${Math.abs(endY - startY) + 20}px`;
            });

            playSound('pour');

            setTimeout(() => {
                const fromSegs = fromTubeEl.querySelectorAll('div');
                for (let i = 0; i < amount; i++) {
                    const seg = fromSegs[fromSegs.length - 1 - i];
                    if (seg) {
                        seg.style.height = '0%';
                        seg.style.opacity = '0';
                    }
                }

                const capacity = waterSortState.capacity;
                const segHeight = 100 / capacity;
                for (let i = 0; i < amount; i++) {
                    const seg = document.createElement('div');
                    seg.style.cssText = `
                        width: 100%;
                        height: 0%;
                        background: ${color};
                        flex-shrink: 0;
                        border-bottom: 1px solid rgba(0,0,0,0.12);
                        transition: height 0.3s ease-out;
                    `;
                    toTubeEl.appendChild(seg);
                    requestAnimationFrame(() => {
                        seg.style.height = `${segHeight}%`;
                    });
                }
            }, 350);

            setTimeout(() => {
                if (stream.parentNode) stream.remove();
                fromWrapper.style.transform = 'translateY(0) rotate(0deg)';
                fromWrapper.style.zIndex = '';
                finishPour(fromIdx, toIdx, color, amount);
            }, 750);
        }

        function finishPour(fromIdx, toIdx, color, amount) {
            const tubes = waterSortState.tubes;
            const fromTube = tubes[fromIdx];
            const toTube = tubes[toIdx];

            for (let i = 0; i < amount; i++) {
                toTube.push(fromTube.pop());
            }

            waterSortState.moves++;
            waterSortState.animating = false;

            renderWaterSort();
            updateWaterSortHud();
            checkWaterSortWin();
        }

        function checkWaterSortWin() {
            const capacity = waterSortState.capacity;
            const isWin = waterSortState.tubes.every(tube => {
                if (tube.length === 0) return true;
                if (tube.length !== capacity) return false;
                return tube.every(c => c === tube[0]);
            });

            if (isWin) {
                playSound('win');
                setWaterStatus('🎉 Уровень пройден!');
                addQuestProgress('c_9', 1);

                setTimeout(() => {
                    if (waterSortState.level >= 200) {
                        setWaterStatus('🏆 Поздравляю! Ты прошёл все 200 уровней!');
                        setTimeout(() => {
                            if (confirm('Ты прошёл все 200 уровней! Начать заново?')) {
                                waterSortState.level = 1;
                                saveProgress();
                                buildLevel(1);
                                renderWaterSort();
                                updateWaterSortHud();
                                setWaterStatus('Нажми на колбу, чтобы выбрать');
                            }
                        }, 800);
                    } else {
                        waterSortState.level++;
                        saveProgress();
                        buildLevel(waterSortState.level);
                        renderWaterSort();
                        updateWaterSortHud();
                        setWaterStatus('Нажми на колбу, чтобы выбрать');
                    }
                }, 1400);
            } else {
                setWaterStatus('Продолжай...');
            }
        }

        let drawTool = 'brush';
        let drawColor = '#000';
        let isDrawing = false;
        let lastX = 0, lastY = 0;

        function initFreeDraw(w, h, isMobile) {
            const canvas = document.getElementById('freeCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDraw = (e) => {
                e.preventDefault();
                isDrawing = true;
                const pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getPos(e);
                
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                
                if (drawTool === 'eraser') {
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = isMobile ? 30 : 20;
                } else {
                    ctx.strokeStyle = drawColor;
                    ctx.lineWidth = isMobile ? 10 : 6;
                }
                ctx.stroke();
                
                lastX = pos.x;
                lastY = pos.y;
            };

            const stopDraw = () => { isDrawing = false; };

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('mouseout', stopDraw);
            
            canvas.addEventListener('touchstart', startDraw, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stopDraw);
            canvas.addEventListener('touchcancel', stopDraw);
        }

        function setDrawTool(tool) {
            drawTool = tool;
            const brush = document.getElementById('tool-brush');
            const eraser = document.getElementById('tool-eraser');
            if (brush) brush.classList.toggle('active-tool', tool === 'brush');
            if (eraser) eraser.classList.toggle('active-tool', tool === 'eraser');
        }

        function setDrawColor(color, el) {
            drawColor = color;
            document.querySelectorAll('.color-swatch').forEach(swatch => swatch.classList.remove('active'));

        let copyTargetShape = '';

            refCtx.clearRect(0, 0, refCanvas.width, refCanvas.height);
            drawShape(refCtx, copyTargetShape, refCanvas.width / 2, refCanvas.height / 2, refCanvas.width * 0.7);

            const ctx = mainCanvas.getContext('2d');
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 4;
            
            let drawing = false;
            let lastX = 0, lastY = 0;

            const getPos = (e) => {
                const rect = mainCanvas.getBoundingClientRect();
                const scaleX = mainCanvas.width / rect.width;
                const scaleY = mainCanvas.height / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const start = (e) => {
                e.preventDefault();
                drawing = true;
                const pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
            };

            const draw = (e) => {
                if (!drawing) return;
                e.preventDefault();
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                lastX = pos.x;
                lastY = pos.y;
            };

            const stop = () => { drawing = false; };

            mainCanvas.addEventListener('mousedown', start);
            mainCanvas.addEventListener('mousemove', draw);
            mainCanvas.addEventListener('mouseup', stop);
            mainCanvas.addEventListener('mouseout', stop);
            
            mainCanvas.addEventListener('touchstart', start, { passive: false });
            mainCanvas.addEventListener('touchmove', draw, { passive: false });
            mainCanvas.addEventListener('touchend', stop);
            mainCanvas.addEventListener('touchcancel', stop);

            document.getElementById('copy-bot-face').textContent = '🤖';

        let completeTask = '';
        function initCompleteGame(w, h) {
            const canvas = document.getElementById('completeCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, w, h);
            
            const tasks = ['house_no_roof', 'car_no_wheels', 'smiley_no_eyes'];
            completeTask = tasks[Math.floor(Math.random() * tasks.length)];
            
            ctx.strokeStyle = '#333';
            ctx.fillStyle = '#ddd';
            ctx.lineWidth = 4;
            
            if (completeTask === 'house_no_roof') {
                ctx.fillRect(w/4, h/2, w/2, h/3);
                ctx.strokeRect(w/4, h/2, w/2, h/3);
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(w/2 - 20, h/2 + h/4, 40, h/12 + 20);
                ctx.fillStyle = '#add8e6';
                ctx.fillRect(w/4 + 20, h/2 + 20, 30, 30);
            } 
            else if (completeTask === 'car_no_wheels') {
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.roundRect(w/4, h/2, w/2, h/5, 10);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#6bc5ff';
                ctx.beginPath();
                ctx.moveTo(w/4 + 40, h/2);
                ctx.lineTo(w/4 + 70, h/2 - 40);
                ctx.lineTo(w/2 + 30, h/2 - 40);
                ctx.lineTo(w/2 + 60, h/2);
                ctx.fill();
                ctx.stroke();
            }
            else if (completeTask === 'smiley_no_eyes') {
                ctx.fillStyle = '#ffd23f';
                ctx.beginPath();
                ctx.arc(w/2, h/2, w/4, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(w/2, h/2 + 20, w/6, 0, Math.PI);
                ctx.stroke();
            }

            let drawing = false;
            let lastX = 0, lastY = 0;

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const start = (e) => {
                e.preventDefault();
                drawing = true;
                const pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 4;
            };

            const draw = (e) => {
                if (!drawing) return;
                e.preventDefault();
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                lastX = pos.x;
                lastY = pos.y;
            };

            const stop = () => { drawing = false; };

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('mouseout', stop);
            
            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stop);
            canvas.addEventListener('touchcancel', stop);

            document.getElementById('complete-bot-face').textContent = '🤖';
            document.getElementById('complete-bot-text').textContent = 'Дорисуй то, чего не хватает!';
            document.getElementById('complete-next-btn').style.display = 'none';
        }

        function checkCompleteDrawing() {
            const canvas = document.getElementById('completeCanvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            
            const botFace = document.getElementById('complete-bot-face');
            const botText = document.getElementById('complete-bot-text');
            const nextBtn = document.getElementById('complete-next-btn');

            let success = false;
            
            if (completeTask === 'house_no_roof') {
                const imgData = ctx.getImageData(w/4, h/4, w/2, h/4).data;
                let darkPixels = 0;
                for (let i = 3; i < imgData.length; i += 4) {
                    if (imgData[i] > 0) darkPixels++;
                }
                if (darkPixels > 100) success = true;
            } 
            else if (completeTask === 'car_no_wheels') {
                const imgData1 = ctx.getImageData(w/4, h/2 + h/5, w/4, h/4).data;
                const imgData2 = ctx.getImageData(w/2, h/2 + h/5, w/4, h/4).data;
                let pixels1 = 0, pixels2 = 0;
                for (let i = 3; i < imgData1.length; i += 4) if (imgData1[i] > 0) pixels1++;
                for (let i = 3; i < imgData2.length; i += 4) if (imgData2[i] > 0) pixels2++;
                if (pixels1 > 50 && pixels2 > 50) success = true;
            }
            else if (completeTask === 'smiley_no_eyes') {
                const imgData = ctx.getImageData(w/2 - 40, h/2 - 40, 80, 40).data;
                let darkPixels = 0;
                for (let i = 3; i < imgData.length; i += 4) {
                    if (imgData[i] > 0) darkPixels++;
                }
                if (darkPixels > 30) success = true;
            }

            if (success) {
                botFace.textContent = '🎉';
                botText.textContent = 'Отлично! Теперь всё правильно!';
                nextBtn.style.display = 'block';
            } else {
                botFace.textContent = '🤔';
                botText.textContent = 'Кажется, чего-то не хватает. Попробуй ещё!';
            }
        }

        let eraseTask = '';
        let eraseOriginalPixels = 0;
        function initEraseGame(w, h) {
            const canvas = document.getElementById('eraseCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, w, h);
            
            const tasks = ['sun_and_cloud', 'car_extra_wheel', 'tree_extra_branch'];
            eraseTask = tasks[Math.floor(Math.random() * tasks.length)];
            
            ctx.lineWidth = 4;
            
            if (eraseTask === 'sun_and_cloud') {
                ctx.fillStyle = '#ffd23f';
                ctx.strokeStyle = '#333';
                ctx.beginPath();
                ctx.arc(w/2, h/2, w/6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                for (let i = 0; i < 8; i++) {
                    const angle = (i * Math.PI) / 4;
                    ctx.beginPath();
                    ctx.moveTo(w/2 + Math.cos(angle) * (w/6 + 10), h/2 + Math.sin(angle) * (w/6 + 10));
                    ctx.lineTo(w/2 + Math.cos(angle) * (w/6 + 25), h/2 + Math.sin(angle) * (w/6 + 25));
                    ctx.stroke();
                }
                ctx.fillStyle = 'rgba(200, 200, 200, 0.8)';
                ctx.beginPath();
                ctx.arc(w/2 - 40, h/2 - 40, 30, 0, Math.PI * 2);
                ctx.arc(w/2 + 10, h/2 - 50, 40, 0, Math.PI * 2);
                ctx.arc(w/2 + 50, h/2 - 20, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
            else if (eraseTask === 'car_extra_wheel') {
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.roundRect(w/4, h/2, w/2, h/5, 10);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#6bc5ff';
                ctx.beginPath();
                ctx.moveTo(w/4 + 40, h/2);
                ctx.lineTo(w/4 + 70, h/2 - 40);
                ctx.lineTo(w/2 + 30, h/2 - 40);
                ctx.lineTo(w/2 + 60, h/2);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#333';
                ctx.beginPath(); ctx.arc(w/4 + 30, h/2 + h/5, 25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(w/2 + 50, h/2 + h/5, 25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#333';
                ctx.beginPath(); ctx.arc(w/2, h/2 + h/5, 25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
            else if (eraseTask === 'tree_extra_branch') {
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(w/2 - 20, h/2, 40, h/3);
                ctx.strokeRect(w/2 - 20, h/2, 40, h/3);
                ctx.fillStyle = '#3ddbb0';
                ctx.beginPath();
                ctx.arc(w/2, h/3, w/5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.strokeStyle = '#8b4513';
                ctx.lineWidth = 10;
                ctx.beginPath();
                ctx.moveTo(w/2 + 20, h/2 + 40);
                ctx.lineTo(w/2 + 80, h/2 + 20);
                ctx.stroke();
            }

            eraseOriginalPixels = countPixelsInZone(ctx, w, h, eraseTask);

            let drawing = false;
            let lastX = 0, lastY = 0;

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const start = (e) => {
                e.preventDefault();
                drawing = true;
                const pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 40; // УВЕЛИЧЕННЫЙ ЛАСТИК
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 20, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            };

            const draw = (e) => {
                if (!drawing) return;
                e.preventDefault();
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                lastX = pos.x;
                lastY = pos.y;
            };

            const stop = () => { drawing = false; };

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('mouseout', stop);
            
            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stop);
            canvas.addEventListener('touchcancel', stop);

            document.getElementById('erase-bot-face').textContent = '🤖';
            document.getElementById('erase-bot-text').textContent = 'Сотри то, чего не должно быть!';
            document.getElementById('erase-next-btn').style.display = 'none';
        }

        function countPixelsInZone(ctx, w, h, task) {
            let imgData;
            if (task === 'sun_and_cloud') {
                imgData = ctx.getImageData(w/2 - 70, h/2 - 70, 140, 90).data;
            } else if (task === 'car_extra_wheel') {
                imgData = ctx.getImageData(w/2 - 35, h/2 + h/5 - 35, 70, 70).data;
            } else if (task === 'tree_extra_branch') {
                imgData = ctx.getImageData(w/2 + 10, h/2 + 10, 80, 60).data;
            }
            let count = 0;
            for (let i = 3; i < imgData.length; i += 4) {
                if (imgData[i] > 0) count++;
            }
            return count;
        }

        function checkEraseDrawing() {
            const canvas = document.getElementById('eraseCanvas');
            const ctx = canvas.getContext('2d');

            const botFace = document.getElementById('erase-bot-face');
            const botText = document.getElementById('erase-bot-text');
            const nextBtn = document.getElementById('erase-next-btn');

            const currentPixels = countPixelsInZone(ctx, w, h, eraseTask);
            
            // ДОБРЫЙ БОТ: Достаточно стереть 30% лишнего (было 20%)
            if (currentPixels < eraseOriginalPixels * 0.3) {

            }

        function drawShape(ctx, type, cx, cy, size) {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.fillStyle = '#ddd';
            
            if (type === 'house') {
                ctx.fillRect(cx - size/2, cy, size, size*0.7);
                ctx.strokeRect(cx - size/2, cy, size, size*0.7);
                ctx.beginPath();
                ctx.moveTo(cx - size/2 - 10, cy);
                ctx.lineTo(cx, cy - size*0.5);
                ctx.lineTo(cx + size/2 + 10, cy);
                ctx.closePath();
                ctx.fillStyle = '#ff6b6b';
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(cx - 15, cy + size*0.3, 30, size*0.4);
                ctx.fillStyle = '#add8e6';
                ctx.fillRect(cx - size*0.35, cy + size*0.1, 25, 25);
            } 
            else if (type === 'car') {
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.roundRect(cx - size/2, cy, size, size*0.4, 10);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#6bc5ff';
                ctx.beginPath();
                ctx.moveTo(cx - size*0.2, cy);
                ctx.lineTo(cx - size*0.1, cy - size*0.3);
                ctx.lineTo(cx + size*0.2, cy - size*0.3);
                ctx.lineTo(cx + size*0.3, cy);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#333';
                ctx.beginPath(); ctx.arc(cx - size*0.3, cy + size*0.4, size*0.15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx + size*0.3, cy + size*0.4, size*0.15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
            else if (type === 'tree') {
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(cx - size*0.1, cy, size*0.2, size*0.6);
                ctx.strokeRect(cx - size*0.1, cy, size*0.2, size*0.6);
                ctx.fillStyle = '#3ddbb0';
                ctx.beginPath();
                ctx.arc(cx, cy, size*0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }

                    catGameState.coins += income;
                    catGameState.totalCoins += income;
                    updateCatUI();
                }
            }, 100);
        }

        function renderCatSidebar() {
            const sidebar = document.getElementById('cat-sidebar');
            if (!sidebar) return;

            // Проверяем, есть ли уже элементы. Если нет — создаем их один раз.
            if (sidebar.children.length === 0) {
                let html = '';
                catUpgradesInfo.forEach(info => {
                    html += `
                        <div class="cat-upgrade-item" id="upg-${info.id}" onclick="buyCatUpgrade('${info.id}')">
                            <div class="cat-upgrade-icon">${info.icon}</div>
                            <div class="cat-upgrade-info">
                                <div class="cat-upgrade-name">${info.name}</div>
                                <div class="cat-upgrade-cost" id="cost-${info.id}">${coinSvg} 0</div>
                                <div class="cat-upgrade-amount" id="amount-${info.id}">+0/s • x0</div>
                            </div>
                        </div>
                    `;
                });
                
                html += `
                    <button class="btn-withdraw" onclick="withdrawCatCoins()">
                        💸 Вывести в реальные монеты
                    </button>
                `;
                sidebar.innerHTML = html;
            }

            // Обновляем только текст внутри (цена, доход), чтобы не сбивать hover-эффект
            catUpgradesInfo.forEach(info => {
                const cost = getCatUpgradeCost(info.id);
                const level = catGameState.upgrades[info.id];
                const canAfford = catGameState.coins >= cost;
                const income = (info.baseIncome * catGameState.prestigeMultiplier).toFixed(1);

                const itemEl = document.getElementById(`upg-${info.id}`);
                if (itemEl) {
                    itemEl.classList.toggle('disabled', !canAfford);
                }

                const costEl = document.getElementById(`cost-${info.id}`);
                if (costEl) {
                    costEl.innerHTML = `${coinSvg} ${cost.toLocaleString()}`;
                }
                
                const amountEl = document.getElementById(`amount-${info.id}`);
                if (amountEl) {
                    amountEl.textContent = `+${income}/s • x${level}`;
                }
            });
        }

        function updateCatUI() {
            const coinsEl = document.getElementById('cat-coins-display');
            const passiveEl = document.getElementById('cat-passive-display');
            if (coinsEl) coinsEl.textContent = Math.floor(catGameState.coins).toLocaleString();
            if (passiveEl) passiveEl.textContent = getCatIncomePerSec().toFixed(1);
            
            renderCatSidebar();
        }

        function clickCat(e) {
            const income = 1 * catGameState.prestigeMultiplier;
            catGameState.coins += income;
            catGameState.totalCoins += income;
            
            const charEl = document.querySelector('.cat-character-svg');
            if (charEl) {
                charEl.style.transform = 'scale(0.9)';
                setTimeout(() => charEl.style.transform = 'scale(1)', 100);
            }

            const floatEl = document.createElement('div');
            floatEl.className = 'cat-click-anim';
            floatEl.textContent = '+' + income;
            
            const mainArea = document.getElementById('cat-main-area');
            const mainAreaRect = mainArea.getBoundingClientRect();
            
            floatEl.style.left = (e.clientX - mainAreaRect.left - 20) + 'px';
            floatEl.style.top = (e.clientY - mainAreaRect.top - 20) + 'px';
            
            mainArea.appendChild(floatEl);
            setTimeout(() => floatEl.remove(), 800);

            updateCatUI();
            saveCatGame();
        }

        function buyCatUpgrade(id) {
            const cost = getCatUpgradeCost(id);
            if (catGameState.coins >= cost) {
                catGameState.coins -= cost;
                catGameState.upgrades[id]++;
                updateCatUI();
                saveCatGame();
            }
        }

        function prestigeCatGame() {
            if (catGameState.totalCoins < 120000) {
                alert("Для престижа нужно заработать минимум 120,000 монет за всё время!");
                return;
            }
            if (confirm("Престиж сбросит ваш прогресс, но даст множитель дохода. Продолжить?")) {
                const newMult = catGameState.prestigeMultiplier + 0.5;
                catGameState = {
                    coins: 0,
                    totalCoins: 0,
                    upgrades: {food:0,treat:0,toy:0,litter:0,accessory:0},
                    prestigeMultiplier: newMult
                };
                updateCatUI();
                saveCatGame();
                alert(`Престиж выполнен! Ваш новый множитель: x${newMult}`);
            }
        }

        // Кастомное окно для вывода
        function withdrawCatCoins() {
            const amountToWithdraw = Math.floor(catGameState.coins);
            if (amountToWithdraw <= 0) {
                alert("У вас нет монет для вывода!");
                return;
            }

            // Заменяем стандартный confirm на красивое модальное окно
            openModal(`
                <div class="withdraw-modal">
                    <div style="font-size: 60px; margin-bottom: 15px;">⚠️</div>
                    <h2>Внимание!</h2>
                    <p class="warning-text">При выводе в реальные монеты, сумма вашего кликера будет разделена на 3.</p>
                    
                    <div class="amount-display">
                        ${coinSvg} <span>${amountToWithdraw.toLocaleString()}</span>
                    </div>

                    <div class="btn-group">
                        <button class="btn-cancel" onclick="openCatClicker()">Отмена</button>
                        <button class="btn-confirm" onclick="confirmWithdraw()">Вывести</button>
                    </div>
                </div>
            `);
        }

        function confirmWithdraw() {
            const amountToWithdraw = Math.floor(catGameState.coins);
            const converted = Math.floor(amountToWithdraw / 3);
            
            // Обнуляем баланс кликера
            catGameState.coins = 0;
            saveCatGame();
            
            // Начисляем в основной кошелек
            playerCoins += converted;
            saveQuestData();
            
            // Возвращаемся в кликер и обновляем UI
            openCatClicker();
            
            alert(`Успешно выведено!\nВаш баланс кликера обнулен.\nНа основной счет зачислено: ${converted.toLocaleString()} монет (сумма была поделена на 3).`);
        }

        // --- КНОПКА ПОДЕЛИТЬСЯ ---
        document.getElementById("btn-share").addEventListener("click", async () => {
            const url = "https://a52993827-cyber.github.io/my-site/html/";
            try {
                await navigator.clipboard.writeText(url);
                alert("Ссылка скопирована! Можешь отправить её другу: " + url);
            } catch (err) {
                prompt("Скопируй эту ссылку и отправь другу:", url);
            }
        });

        const btnTop = document.getElementById("btn-top");
        window.addEventListener("scroll", () => {
            if (window.scrollY > 200) {
                btnTop.style.display = "flex";
            } else {
                btnTop.style.display = "none";
            }
        });
        btnTop.addEventListener("click", () => {
            window.scrollTo({ top: 0, behavior: "smooth" });
        });

        // Инициализация при запуске
        updateCoinDisplay();
        updateQuestBadge();
    </script>
</body>
</html>
