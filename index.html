        // --- САПЁР ---
        let minesweeperState = {};
        function initMinesweeper() {
            const cols = 8;
            const rows = 8;
            const minesCount = 10;
            
            let board = [];
            let mines = new Set();
            
            while (mines.size < minesCount) {
                mines.add(Math.floor(Math.random() * rows * cols));
            }
            
            for (let i = 0; i < rows * cols; i++) {
                board.push({
                    isMine: mines.has(i),
                    isRevealed: false,
                    isFlagged: false,
                    neighborMines: 0
                });
            }
            
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    if (board[i * cols + j].isMine) continue;
                    let count = 0;
                    for (let dx = -1; dx <= 1; dx++) {
                        for (let dy = -1; dy <= 1; dy++) {
                            if (dx === 0 && dy === 0) continue;
                            const nx = i + dx;
                            const ny = j + dy;
                            if (nx >= 0 && nx < rows && ny >= 0 && ny < cols) {
                                if (board[nx * cols + ny].isMine) count++;
                            }
                        }
                    }
                    board[i * cols + j].neighborMines = count;
                }
            }
            
            minesweeperState = { board, cols, rows, gameOver: false };
            renderMinesweeper();
        }

        function renderMinesweeper() {
            const container = document.getElementById('minesweeper-container');
            if (!container) return;
            
            let html = '<div class="minesweeper-grid">';
            minesweeperState.board.forEach((cell, idx) => {
                let content = '';
                let className = 'minesweeper-cell';
                
                if (cell.isRevealed) {
                    className += ' revealed';
                    if (cell.isMine) {
                        content = '💣';
                        className += ' mine';
                    } else if (cell.neighborMines > 0) {
                        content = cell.neighborMines;
                    }
                } else if (cell.isFlagged) {
                    content = '🚩';
                    className += ' flag';
                }
                
                html += `<div class="${className}" onclick="revealMinesweeperCell(${idx})" oncontextmenu="flagMinesweeperCell(event, ${idx})">${content}</div>`;
            });
            html += '</div>';
            
            if (minesweeperState.gameOver) {
                html += '<button onclick="initMinesweeper()" style="margin-top:10px; background: #3ddbb0; color: #000;">Заново</button>';
            }
            
            container.innerHTML = html;
        }

        function revealMinesweeperCell(idx) {
            if (minesweeperState.gameOver) return;
            const cell = minesweeperState.board[idx];
            if (cell.isRevealed || cell.isFlagged) return;
            
            if (cell.isMine) {
                minesweeperState.gameOver = true;
                minesweeperState.board.forEach(c => c.isRevealed = true);
                renderMinesweeper();
                setTimeout(() => alert('💥 Ты подорвался на мине!'), 100);
                return;
            }
            
            cell.isRevealed = true;
            
            if (cell.neighborMines === 0) {
                const r = Math.floor(idx / minesweeperState.cols);
                const c = idx % minesweeperState.cols;
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        if (dx === 0 && dy === 0) continue;
                        const nr = r + dx;
                        const nc = c + dy;
                        if (nr >= 0 && nr < minesweeperState.rows && nc >= 0 && nc < minesweeperState.cols) {
                            revealMinesweeperCell(nr * minesweeperState.cols + nc);
                        }
                    }
                }
            }
            
            renderMinesweeper();
            checkMinesweeperWin();
        }

        function flagMinesweeperCell(e, idx) {
            e.preventDefault();
            if (minesweeperState.gameOver) return;
            const cell = minesweeperState.board[idx];
            if (cell.isRevealed) return;
            cell.isFlagged = !cell.isFlagged;
            renderMinesweeper();
        }

        function checkMinesweeperWin() {
            const allRevealed = minesweeperState.board.every(c => c.isRevealed || c.isFlagged);
            if (allRevealed) {
                minesweeperState.gameOver = true;
                renderMinesweeper();
                setTimeout(() => alert('🎉 Ты выиграл!'), 100);
            }
        }

        // --- ЗМЕЙКА ---
        let snakeState = {};
        function initSnake() {
            const canvas = document.getElementById('snakeCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            snakeState = {
                snake: [{x: 10, y: 10}],
                direction: {x: 0, y: 0},
                food: {x: 15, y: 15},
                score: 0,
                gameOver: false,
                animId: null,
                lastTime: 0
            };
            
            placeSnakeFood();
            
            document.onkeydown = (e) => {
                if (snakeState.gameOver) return;
                switch(e.key) {
                    case 'ArrowUp': if (snakeState.direction.y === 0) snakeState.direction = {x: 0, y: -1}; break;
                    case 'ArrowDown': if (snakeState.direction.y === 0) snakeState.direction = {x: 0, y: 1}; break;
                    case 'ArrowLeft': if (snakeState.direction.x === 0) snakeState.direction = {x: -1, y: 0}; break;
                    case 'ArrowRight': if (snakeState.direction.x === 0) snakeState.direction = {x: 1, y: 0}; break;
                }
            };
            
            drawSnake(ctx);
        }

        function placeSnakeFood() {
            let newFood;
            do {
                newFood = {x: Math.floor(Math.random() * 20), y: Math.floor(Math.random() * 20)};
            } while (snakeState.snake.some(s => s.x === newFood.x && s.y === newFood.y));
            snakeState.food = newFood;
        }

        function drawSnake(ctx) {
            const w = 300, h = 300;
            const cellSize = 15;
            
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, w, h);
            
            ctx.fillStyle = '#ff6b6b';
            ctx.fillRect(snakeState.food.x * cellSize, snakeState.food.y * cellSize, cellSize, cellSize);
            
            snakeState.snake.forEach((s, i) => {
                ctx.fillStyle = i === 0 ? '#3ddbb0' : '#2e8b57';
                ctx.fillRect(s.x * cellSize, s.y * cellSize, cellSize, cellSize);
            });
            
            ctx.fillStyle = '#fff';
            ctx.font = '20px Arial';
            ctx.fillText('Счёт: ' + snakeState.score, 10, 25);
            
            if (snakeState.gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Игра окончена!', w/2, h/2 - 20);
                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.fillText('Счёт: ' + snakeState.score, w/2, h/2 + 20);
            }
        }

        function startSnake() {
            const canvas = document.getElementById('snakeCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            initSnake();
            snakeState.direction = {x: 1, y: 0};
            snakeState.lastTime = performance.now();
            snakeState.animId = requestAnimationFrame((t) => snakeLoop(t, ctx));
        }

        function snakeLoop(now, ctx) {
            if (!snakeState.gameOver) {
                const dt = now - snakeState.lastTime;
                if (dt > 150) {
                    snakeState.lastTime = now;
                    
                    const head = {...snakeState.snake[0]};
                    head.x += snakeState.direction.x;
                    head.y += snakeState.direction.y;
                    
                    if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20) {
                        snakeState.gameOver = true;
                        drawSnake(ctx);
                        return;
                    }
                    
                    if (snakeState.snake.some(s => s.x === head.x && s.y === head.y)) {
                        snakeState.gameOver = true;
                        drawSnake(ctx);
                        return;
                    }
                    
                    snakeState.snake.unshift(head);
                    
                    if (head.x === snakeState.food.x && head.y === snakeState.food.y) {
                        snakeState.score++;
                        placeSnakeFood();
                    } else {
                        snakeState.snake.pop();
                    }
                    
                    drawSnake(ctx);
                }
            }
            
            if (!snakeState.gameOver) {
                snakeState.animId = requestAnimationFrame((t) => snakeLoop(t, ctx));
            }
        }

        // --- АРКАНОИД (ИСПРАВЛЕН) ---
        let breakoutState = {};
        function initBreakout() {
            const canvas = document.getElementById('breakoutCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            breakoutState = {
                paddleX: 120,
                ballX: 150,
                ballY: 300,
                ballDX: 3,
                ballDY: -3,
                bricks: [],
                score: 0,
                gameOver: false,
                animId: null,
                level: 1
            };
            
            const rows = 3 + Math.floor(breakoutState.level / 2);
            const cols = 5;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    breakoutState.bricks.push({
                        x: c * 60,
                        y: r * 20 + 30,
                        width: 60,
                        height: 20,
                        active: true,
                        color: `hsl(${r * 30}, 70%, 60%)`
                    });
                }
            }
            
            document.onkeydown = (e) => {
                if (e.key === 'ArrowLeft') breakoutState.paddleX = Math.max(0, breakoutState.paddleX - 20);
                if (e.key === 'ArrowRight') breakoutState.paddleX = Math.min(240, breakoutState.paddleX + 20);
            };
            
            canvas.onmousemove = (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                breakoutState.paddleX = Math.max(0, Math.min(240, x - 30));
            };
            
            drawBreakout(ctx);
        }

        function drawBreakout(ctx) {
            const w = 300, h = 400;
            
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, w, h);
            
            breakoutState.bricks.forEach(b => {
                if (b.active) {
                    ctx.fillStyle = b.color;
                    ctx.fillRect(b.x, b.y, b.width, b.height);
                    ctx.strokeStyle = '#fff';
                    ctx.strokeRect(b.x, b.y, b.width, b.height);
                }
            });
            
            ctx.fillStyle = '#3ddbb0';
            ctx.fillRect(breakoutState.paddleX, 370, 60, 10);
            
            ctx.beginPath();
            ctx.arc(breakoutState.ballX, breakoutState.ballY, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffd23f';
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.font = '20px Arial';
            ctx.fillText('Счёт: ' + breakoutState.score, 10, 25);
            ctx.fillText('Уровень: ' + breakoutState.level, 10, 50);
            
            if (breakoutState.gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Игра окончена!', w/2, h/2 - 20);
                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.fillText('Счёт: ' + breakoutState.score, w/2, h/2 + 20);
            }
        }

        function startBreakout() {
            const canvas = document.getElementById('breakoutCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            initBreakout();
            breakoutState.animId = requestAnimationFrame((t) => breakoutLoop(t, ctx));
        }

        function breakoutLoop(now, ctx) {
            if (breakoutState.gameOver) return;
            
            breakoutState.ballX += breakoutState.ballDX;
            breakoutState.ballY += breakoutState.ballDY;
            
            if (breakoutState.ballX <= 5 || breakoutState.ballX >= 295) breakoutState.ballDX *= -1;
            if (breakoutState.ballY <= 5) breakoutState.ballDY *= -1;
            
            if (breakoutState.ballY >= 360 && breakoutState.ballY <= 375 &&
                breakoutState.ballX >= breakoutState.paddleX && breakoutState.ballX <= breakoutState.paddleX + 60) {
                breakoutState.ballDY = -Math.abs(breakoutState.ballDY);
                breakoutState.ballDX += (Math.random() - 0.5) * 2;
            }
            
            if (breakoutState.ballY > 400) {
                breakoutState.gameOver = true;
                drawBreakout(ctx);
                return;
            }
            
            breakoutState.bricks.forEach(b => {
                if (b.active) {
                    if (breakoutState.ballX > b.x && breakoutState.ballX < b.x + b.width &&
                        breakoutState.ballY > b.y && breakoutState.ballY < b.y + b.height) {
                        b.active = false;
                        breakoutState.ballDY *= -1;
                        breakoutState.score++;
                    }
                }
            });
            
            if (breakoutState.bricks.every(b => !b.active)) {
                breakoutState.level++;
                breakoutState.ballX = 150;
                breakoutState.ballY = 300;
                breakoutState.ballDX = 3 * (Math.random() > 0.5 ? 1 : -1);
                breakoutState.ballDY = -3;
                
                const rows = 3 + Math.floor(breakoutState.level / 2);
                const cols = 5;
                breakoutState.bricks = [];
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        breakoutState.bricks.push({
                            x: c * 60,
                            y: r * 20 + 30,
                            width: 60,
                            height: 20,
                            active: true,
                            color: `hsl(${r * 30}, 70%, 60%)`
                        });
                    }
                }
            }
            
            drawBreakout(ctx);
            breakoutState.animId = requestAnimationFrame((t) => breakoutLoop(t, ctx));
        }

        // ============================================
        // === WATER SORT (200 уровней, анимация, звук) ===
        // ============================================

        const WATER_COLORS = [
            '#ff6b6b', '#3ddbb0', '#6bc5ff', '#ffd23f',
            '#b19cd9', '#ffb347', '#ff99cc', '#a8e6cf',
            '#c0c0c0', '#ffffff', '#8b4513', '#00e5b5'
        ];

        const WATER_TUBE_CAPACITY = 4;

        let waterSortState = {
            tubes: [],
            selectedTube: -1,
            level: 1,
            animating: false,
            moves: 0,
            capacity: 4
        };

        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ctx = getAudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'select') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(650, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
                    osc.start(); osc.stop(ctx.currentTime + 0.12);
                } else if (type === 'pour') {
                    const bufferSize = Math.floor(ctx.sampleRate * 0.4);
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
                    }
                    const noise = ctx.createBufferSource();
                    noise.buffer = buffer;
                    const noiseGain = ctx.createGain();
                    noiseGain.gain.setValueAtTime(0.06, ctx.currentTime);
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    noise.connect(noiseGain);
                    noiseGain.connect(ctx.destination);
                    noise.start();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.35);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                    osc.start(); osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'win') {
                    [523, 659, 784, 1047].forEach((freq, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.type = 'square';
                        o.frequency.value = freq;
                        o.connect(g); g.connect(ctx.destination);
                        g.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.12);
                        g.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + i * 0.12 + 0.02);
                        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.12 + 0.25);
                        o.start(ctx.currentTime + i * 0.12);
                        o.stop(ctx.currentTime + i * 0.12 + 0.3);
                    });
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
                    osc.start(); osc.stop(ctx.currentTime + 0.25);
                }
            } catch (e) { /* игнорируем ошибки аудио */ }
        }

        function getLevelConfig(level) {
            let colors, empty, capacity = 4;
            if (level <= 20) { colors = 3; empty = 2; }
            else if (level <= 50) { colors = 4; empty = 2; }
            else if (level <= 90) { colors = 5; empty = 2; }
            else if (level <= 140) { colors = 6; empty = 2; }
            else if (level <= 170) { colors = 7; empty = 1; }
            else { colors = 8; empty = 1; }
            return { colors, empty, capacity, seed: level * 1337 + 42 };
        }

        function mulberry32(seed) {
            return function() {
                seed |= 0; seed = seed + 0x6D2B79F5 | 0;
                let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function shuffleWithRng(arr, rng) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function loadProgress() {
            const saved = parseInt(localStorage.getItem('waterSortLevel') || '1');
            waterSortState.level = Math.max(1, Math.min(200, saved));
        }

        function saveProgress() {
            localStorage.setItem('waterSortLevel', waterSortState.level);
        }

        function initWaterSort() {
            loadProgress();
            buildLevel(waterSortState.level);
            renderWaterSort();
            updateWaterSortHud();
        }

        function buildLevel(level) {
            const cfg = getLevelConfig(level);
            const rng = mulberry32(cfg.seed);

            let liquids = [];
            for (let c = 0; c < cfg.colors; c++) {
                for (let k = 0; k < cfg.capacity; k++) {
                    liquids.push(WATER_COLORS[c % WATER_COLORS.length]);
                }
            }
            liquids = shuffleWithRng(liquids, rng);

            const tubes = [];
            for (let i = 0; i < cfg.colors; i++) {
                const tube = [];
                for (let j = 0; j < cfg.capacity; j++) {
                    tube.push(liquids.pop());
                }
                tubes.push(tube);
            }
            for (let i = 0; i < cfg.empty; i++) tubes.push([]);

            waterSortState.tubes = tubes;
            waterSortState.selectedTube = -1;
            waterSortState.animating = false;
            waterSortState.moves = 0;
            waterSortState.capacity = cfg.capacity;
        }

        function updateWaterSortHud() {
            const lvlEl = document.getElementById('watersort-level');
            const movesEl = document.getElementById('watersort-moves');
            if (lvlEl) lvlEl.textContent = `Уровень ${waterSortState.level} / 200`;
            if (movesEl) movesEl.textContent = `Ходов: ${waterSortState.moves}`;
        }

        function renderWaterSort() {
            const area = document.getElementById('watersort-area');
            if (!area) return;
            area.innerHTML = '';
            area.style.position = 'relative';

            const capacity = waterSortState.capacity || 4;

            waterSortState.tubes.forEach((tube, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'watersort-tube-wrapper';
                wrapper.dataset.index = index;
                wrapper.style.cssText = `
                    position: relative;
                    width: 54px;
                    height: 190px;
                    cursor: pointer;
                    display: flex;
                    justify-content: center;
                    align-items: flex-end;
                    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
                `;

                if (waterSortState.selectedTube === index) {
                    wrapper.style.transform = 'translateY(-18px)';
                }

                const tubeEl = document.createElement('div');
                tubeEl.className = 'watersort-tube';
                tubeEl.style.cssText = `
                    width: 46px;
                    height: 180px;
                    border: 4px solid rgba(255,255,255,0.85);
                    border-top: none;
                    border-radius: 0 0 23px 23px;
                    display: flex;
                    flex-direction: column-reverse;
                    justify-content: flex-start;
                    align-items: stretch;
                    position: relative;
                    background: rgba(0,0,0,0.25);
                    overflow: hidden;
                    transition: border-color 0.2s, box-shadow 0.2s;
                `;

                if (waterSortState.selectedTube === index) {
                    tubeEl.style.borderColor = '#ffd23f';
                    tubeEl.style.boxShadow = '0 0 16px rgba(255,210,63,0.9)';
                }

                tube.forEach(color => {
                    const seg = document.createElement('div');
                    seg.style.cssText = `
                        width: 100%;
                        height: ${100 / capacity}%;
                        background: ${color};
                        flex-shrink: 0;
                        border-bottom: 1px solid rgba(0,0,0,0.12);
                        transition: height 0.25s, opacity 0.25s;
                    `;
                    tubeEl.appendChild(seg);
                });

                wrapper.appendChild(tubeEl);
                wrapper.onclick = () => handleWaterSortClick(index);
                area.appendChild(wrapper);
            });
        }

        function setWaterStatus(text) {
            const el = document.getElementById('watersort-status');
            if (el) el.textContent = text;
        }

        function handleWaterSortClick(index) {
            if (waterSortState.animating) return;

            const tubes = waterSortState.tubes;

            if (waterSortState.selectedTube === index) {
                waterSortState.selectedTube = -1;
                renderWaterSort();
                setWaterStatus('Нажми на колбу, чтобы выбрать');
                playSound('select');
                return;
            }

            if (waterSortState.selectedTube === -1) {
                if (tubes[index].length > 0) {
                    waterSortState.selectedTube = index;
                    renderWaterSort();
                    setWaterStatus('Выбери колбу, куда перелить');
                    playSound('select');
                }
                return;
            }

            const fromIdx = waterSortState.selectedTube;
            const fromTube = tubes[fromIdx];
            const toTube = tubes[index];
            const capacity = waterSortState.capacity;

            if (toTube.length >= capacity) {
                waterSortState.selectedTube = -1;
                renderWaterSort();
                setWaterStatus('Колба полна!');
                playSound('error');
                return;
            }

            const colorToMove = fromTube[fromTube.length - 1];
            const topColor = toTube.length > 0 ? toTube[toTube.length - 1] : null;

            if (toTube.length > 0 && topColor !== colorToMove) {
                waterSortState.selectedTube = -1;
                renderWaterSort();
                setWaterStatus('Нельзя смешивать разные цвета!');
                playSound('error');
                return;
            }

            let count = 0;
            for (let i = fromTube.length - 1; i >= 0; i--) {
                if (fromTube[i] === colorToMove) count++;
                else break;
            }
            const space = capacity - toTube.length;
            const amount = Math.min(count, space);

            animatePour(fromIdx, index, colorToMove, amount);
        }

        function animatePour(fromIdx, toIdx, color, amount) {
            waterSortState.animating = true;
            waterSortState.selectedTube = -1;

            const area = document.getElementById('watersort-area');
            if (!area) { finishPour(fromIdx, toIdx, color, amount); return; }

            const wrappers = area.querySelectorAll('.watersort-tube-wrapper');
            const fromWrapper = wrappers[fromIdx];
            const toWrapper = wrappers[toIdx];

            if (!fromWrapper || !toWrapper) {
                finishPour(fromIdx, toIdx, color, amount);
                return;
            }

            const fromTubeEl = fromWrapper.querySelector('.watersort-tube');
            const toTubeEl = toWrapper.querySelector('.watersort-tube');

            const fromRect = fromTubeEl.getBoundingClientRect();
            const toRect = toTubeEl.getBoundingClientRect();
            const areaRect = area.getBoundingClientRect();

            // ИСПРАВЛЕННЫЙ НАКЛОН (зависит от положения на экране)
            const angle = (fromRect.left < toRect.left) ? 35 : -35;

            fromWrapper.style.transform = `translateY(-40px) rotate(${angle}deg)`;
            fromWrapper.style.zIndex = '10';
            fromWrapper.style.transition = 'transform 0.3s ease-out';

            const startX = fromIdx < toIdx ? fromRect.right - 8 : fromRect.left + 8;
            const startY = fromRect.top + 20;
            const endX = toRect.left + toRect.width / 2;
            const endY = toRect.top;

            const stream = document.createElement('div');
            stream.style.cssText = `
                position: absolute;
                left: ${startX - areaRect.left}px;
                top: ${startY - areaRect.top}px;
                width: 8px;
                height: 0px;
                background: ${color};
                border-radius: 4px;
                pointer-events: none;
                z-index: 20;
                box-shadow: 0 0 8px ${color};
                transform-origin: top center;
                transition: height 0.35s ease-in, left 0.35s ease-in, top 0.35s ease-in;
            `;
            area.appendChild(stream);

            requestAnimationFrame(() => {
                stream.style.left = `${endX - areaRect.left - 4}px`;
                stream.style.top = `${endY - areaRect.top}px`;
                stream.style.height = `${Math.abs(endY - startY) + 20}px`;
            });

            playSound('pour');

            setTimeout(() => {
                const fromSegs = fromTubeEl.querySelectorAll('div');
                for (let i = 0; i < amount; i++) {
                    const seg = fromSegs[fromSegs.length - 1 - i];
                    if (seg) {
                        seg.style.height = '0%';
                        seg.style.opacity = '0';
                    }
                }

                const capacity = waterSortState.capacity;
                const segHeight = 100 / capacity;
                for (let i = 0; i < amount; i++) {
                    const seg = document.createElement('div');
                    seg.style.cssText = `
                        width: 100%;
                        height: 0%;
                        background: ${color};
                        flex-shrink: 0;
                        border-bottom: 1px solid rgba(0,0,0,0.12);
                        transition: height 0.3s ease-out;
                    `;
                    toTubeEl.appendChild(seg);
                    requestAnimationFrame(() => {
                        seg.style.height = `${segHeight}%`;
                    });
                }
            }, 350);

            setTimeout(() => {
                if (stream.parentNode) stream.remove();
                fromWrapper.style.transform = 'translateY(0) rotate(0deg)';
                fromWrapper.style.zIndex = '';
                finishPour(fromIdx, toIdx, color, amount);
            }, 750);
        }

        function finishPour(fromIdx, toIdx, color, amount) {
            const tubes = waterSortState.tubes;
            const fromTube = tubes[fromIdx];
            const toTube = tubes[toIdx];

            for (let i = 0; i < amount; i++) {
                toTube.push(fromTube.pop());

            waterSortState.moves++;
            waterSortState.animating = false;

            renderWaterSort();
            updateWaterSortHud();
            checkWaterSortWin();

        // --- ПЯТНАШКИ (15 PUZZLE) ---
        let p15State = { board: [], emptyIdx: 15, gameOver: false };

        function init15Puzzle() {
            let solved = Array.from({length: 15}, (_, i) => i + 1);
            solved.push(0);
            
            let empty = 15;
            for (let i = 0; i < 100; i++) {
                const neighbors = [];
                const r = Math.floor(empty / 4);
                const c = empty % 4;
                if (r > 0) neighbors.push(empty - 4);
                if (r < 3) neighbors.push(empty + 4);
                if (c > 0) neighbors.push(empty - 1);
                if (c < 3) neighbors.push(empty + 1);
                
                const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
                [solved[empty], solved[randomNeighbor]] = [solved[randomNeighbor], solved[empty]];
                empty = randomNeighbor;
            }
            
            p15State = { board: solved, emptyIdx: empty, gameOver: false };
            render15Puzzle();
            document.getElementById('p15-status').textContent = 'Собери числа по порядку';
        }

        function render15Puzzle() {
            const container = document.getElementById('p15-board');
            if (!container) return;
            container.innerHTML = '';
            
            p15State.board.forEach((num, idx) => {
                const cell = document.createElement('div');
                cell.style.cssText = `
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: ${num === 0 ? 'transparent' : 'rgba(255,255,255,0.2)'};
                    border: ${num === 0 ? 'none' : '2px solid rgba(255,255,255,0.5)'};
                    border-radius: 8px;
                    font-size: 24px;
                    font-weight: bold;
                    cursor: ${num === 0 ? 'default' : 'pointer'};
                    color: #fff;
                    user-select: none;
                `;
                cell.textContent = num === 0 ? '' : num;
                if (num !== 0) {
                    cell.onclick = () => move15Puzzle(idx);
                }
                container.appendChild(cell);
            });
        }

        function move15Puzzle(idx) {
            if (p15State.gameOver) return;
            
            const r1 = Math.floor(idx / 4);
            const c1 = idx % 4;
            const r2 = Math.floor(p15State.emptyIdx / 4);
            const c2 = p15State.emptyIdx % 4;
            
            if (Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1) {
                [p15State.board[idx], p15State.board[p15State.emptyIdx]] = [p15State.board[p15State.emptyIdx], p15State.board[idx]];
                p15State.emptyIdx = idx;
                render15Puzzle();
                check15PuzzleWin();
            }
        }

        function check15PuzzleWin() {
            for (let i = 0; i < 15; i++) {
                if (p15State.board[i] !== i + 1) return;
            }
            p15State.gameOver = true;
            document.getElementById('p15-status').textContent = '🎉 Победа! Ты собрал пятнашки!';
            addQuestProgress('g_15puzzle_1', 1);
            setTimeout(() => {
                if(confirm("Пятнашки собраны! Начать заново?")) init15Puzzle();
            }, 500);
        }

        // --- САЙМОН ---
        let simonState = { sequence: [], playerStep: 0, playing: false, accepting: false };

        function initSimon() {
            simonState = { sequence: [], playerStep: 0, playing: false, accepting: false };
            document.getElementById('simon-status').textContent = 'Нажми "Старт"';
            
            ['red', 'blue', 'green', 'yellow'].forEach(color => {

        function startSimon() {

        function nextSimonRound() {

            simonState.accepting = false;
            document.getElementById('simon-status').textContent = 'Смотри последовательность...';

        function playSimonSequence() {
            simonState.playing = true;
            let i = 0;

                if (i >= simonState.sequence.length) {
                    clearInterval(interval);
                    simonState.playing = false;

        function clickSimon(colorIdx) {

        // --- ТЕТРИС ---
        let tetrisState = { board: [], currentPiece: null, score: 0, running: false, interval: null };

        function initTetris() {
            tetrisState.board = Array.from({length: 20}, () => Array(10).fill(0));
            tetrisState.currentPiece = null;
            tetrisState.score = 0;
            tetrisState.running = false;
            drawTetris();
        }

        function startTetris() {
            initTetris();
            tetrisState.running = true;
            spawnTetrisPiece();
            if (tetrisState.interval) clearInterval(tetrisState.interval);
            tetrisState.interval = setInterval(tetrisDrop, 500);
        }

        function spawnTetrisPiece() {
            const pieces = [
                { shape: [[1,1,1,1]], color: '#6bc5ff' },
                { shape: [[1,1],[1,1]], color: '#ffd23f' },
                { shape: [[0,1,0],[1,1,1]], color: '#b19cd9' },
                { shape: [[1,0,0],[1,1,1]], color: '#3ddbb0' },
                { shape: [[0,0,1],[1,1,1]], color: '#ffb347' },
                { shape: [[0,1,1],[1,1,0]], color: '#ff6b6b' },
                { shape: [[1,1,0],[0,1,1]], color: '#a8e6cf' }
            ];
            const p = pieces[Math.floor(Math.random() * pieces.length)];
            tetrisState.currentPiece = {
                shape: p.shape,
                color: p.color,
                x: Math.floor((10 - p.shape[0].length) / 2),
                y: 0
            };
            if (checkTetrisCollision()) {
                tetrisState.running = false;
                clearInterval(tetrisState.interval);
                alert("Игра окончена! Счёт: " + tetrisState.score);
            }
        }

        function tetrisDrop() {
            if (!tetrisState.running) return;
            tetrisState.currentPiece.y++;
            if (checkTetrisCollision()) {
                tetrisState.currentPiece.y--;
                lockTetrisPiece();
                checkTetrisLines();
                spawnTetrisPiece();
            }
            drawTetris();
        }

        function moveTetris(dx) {
            if (!tetrisState.running) return;
            tetrisState.currentPiece.x += dx;
            if (checkTetrisCollision()) tetrisState.currentPiece.x -= dx;
            drawTetris();
        }

        function rotateTetris() {
            if (!tetrisState.running) return;
            const oldShape = tetrisState.currentPiece.shape;
            const newShape = oldShape[0].map((_, i) => oldShape.map(row => row[i]).reverse());
            tetrisState.currentPiece.shape = newShape;
            if (checkTetrisCollision()) tetrisState.currentPiece.shape = oldShape;
            drawTetris();
        }

        function checkTetrisCollision() {
            const p = tetrisState.currentPiece;
            for (let y = 0; y < p.shape.length; y++) {
                for (let x = 0; x < p.shape[y].length; x++) {
                    if (p.shape[y][x]) {
                        const boardX = p.x + x;
                        const boardY = p.y + y;
                        if (boardX < 0 || boardX >= 10 || boardY >= 20 || (boardY >= 0 && tetrisState.board[boardY][boardX])) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function lockTetrisPiece() {
            const p = tetrisState.currentPiece;
            for (let y = 0; y < p.shape.length; y++) {
                for (let x = 0; x < p.shape[y].length; x++) {
                    if (p.shape[y][x]) {
                        if (p.y + y >= 0) tetrisState.board[p.y + y][p.x + x] = p.color;
                    }
                }
            }
        }

        function checkTetrisLines() {
            for (let y = 19; y >= 0; y--) {
                if (tetrisState.board[y].every(cell => cell !== 0)) {
                    tetrisState.board.splice(y, 1);
                    tetrisState.board.unshift(Array(10).fill(0));
                    tetrisState.score += 10;
                    y++;
                }
            }
        }

        function drawTetris() {
            const canvas = document.getElementById('tetrisCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const size = 20;

            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < 20; y++) {
                for (let x = 0; x < 10; x++) {
                    if (tetrisState.board[y][x]) {
                        ctx.fillStyle = tetrisState.board[y][x];
                        ctx.fillRect(x * size, y * size, size - 1, size - 1);
                    }
                }
            }

            if (tetrisState.currentPiece) {
                const p = tetrisState.currentPiece;
                ctx.fillStyle = p.color;
                for (let y = 0; y < p.shape.length; y++) {
                    for (let x = 0; x < p.shape[y].length; x++) {
                        if (p.shape[y][x]) {
                            ctx.fillRect((p.x + x) * size, (p.y + y) * size, size - 1, size - 1);
                        }
                    }
                }
            }

            ctx.fillStyle = '#fff';
            ctx.font = '20px Arial';
            ctx.fillText('Счёт: ' + tetrisState.score, 10, 25);
        }

        document.addEventListener('keydown', (e) => {
            if (!tetrisState.running) return;
            if (e.key === 'ArrowLeft') { moveTetris(-1); e.preventDefault(); }
            if (e.key === 'ArrowRight') { moveTetris(1); e.preventDefault(); }
            if (e.key === 'ArrowDown') { tetrisDrop(); e.preventDefault(); }
            if (e.key === 'ArrowUp') { rotateTetris(); e.preventDefault(); }
        });

        // --- ЛАБИРИНТ (ИСПРАВЛЕН) ---
        let mazeState = {};
        function initMaze() {
            let level = parseInt(localStorage.getItem('mazeLevel') || '1');
            if (level < 1 || level > 200) level = 1;
            
            const size = Math.min(11 + Math.floor(level / 10), 21); 
            const cellSize = Math.floor(300 / size);
            
            mazeState = {
                grid: [],
                player: { x: 1, y: 1 },
                exit: { x: size - 2, y: size - 2 },
                gameOver: false,
                size: size,
                cellSize: cellSize,
                level: level
            };

            for (let y = 0; y < size; y++) {
                let row = [];
                for (let x = 0; x < size; x++) {
                    row.push(1);
                }
                mazeState.grid.push(row);
            }

            const stack = [{x: 1, y: 1}];
            mazeState.grid[1][1] = 0;

            while (stack.length > 0) {
                const current = stack[stack.length - 1];
                const neighbors = [];
                const dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]];
                for (const [dx, dy] of dirs) {
                    const nx = current.x + dx;
                    const ny = current.y + dy;
                    if (nx > 0 && nx < size - 1 && ny > 0 && ny < size - 1 && mazeState.grid[ny][nx] === 1) {
                        neighbors.push({x: nx, y: ny, dx: dx/2, dy: dy/2});
                    }
                }
                if (neighbors.length > 0) {
                    const next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    mazeState.grid[current.y + next.dy][current.x + next.dx] = 0;
                    mazeState.grid[next.y][next.x] = 0;
                    stack.push({x: next.x, y: next.y});
                } else {
                    stack.pop();
                }
            }

            mazeState.grid[mazeState.exit.y][mazeState.exit.x] = 0;
            if (mazeState.exit.y - 1 > 0) mazeState.grid[mazeState.exit.y - 1][mazeState.exit.x] = 0;

            document.onkeydown = (e) => {
                if (mazeState.gameOver) return;
                let dx = 0, dy = 0;
                if (e.key === 'ArrowUp') dy = -1;
                if (e.key === 'ArrowDown') dy = 1;
                if (e.key === 'ArrowLeft') dx = -1;
                if (e.key === 'ArrowRight') dx = 1;
                if (dx === 0 && dy === 0) return;

                const nx = mazeState.player.x + dx;
                const ny = mazeState.player.y + dy;

                if (nx >= 0 && nx < size && ny >= 0 && ny < size && mazeState.grid[ny][nx] === 0) {
                    mazeState.player.x = nx;
                    mazeState.player.y = ny;
                    drawMaze();
                    checkMazeWin();
                }
                e.preventDefault();
            };

            setTimeout(() => {
                drawMaze();
            }, 50);
            
            document.getElementById('maze-status').textContent = `Уровень ${level} / 200. Найди выход`;
        }

        function drawMaze() {
            const canvas = document.getElementById('mazeCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const cellSize = mazeState.cellSize;

            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, 300, 300);

            for (let y = 0; y < mazeState.size; y++) {
                for (let x = 0; x < mazeState.size; x++) {
                    if (mazeState.grid[y][x] === 1) {
                        ctx.fillStyle = '#555';
                        ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
                    }
                }
            }

            ctx.fillStyle = '#ffd23f';
            ctx.fillRect(mazeState.exit.x * cellSize, mazeState.exit.y * cellSize, cellSize, cellSize);

            ctx.fillStyle = '#3ddbb0';
            ctx.fillRect(mazeState.player.x * cellSize, mazeState.player.y * cellSize, cellSize, cellSize);
        }

        function checkMazeWin() {
            if (mazeState.player.x === mazeState.exit.x && mazeState.player.y === mazeState.exit.y) {
                mazeState.gameOver = true;
                document.getElementById('maze-status').textContent = `🎉 Уровень ${mazeState.level} пройден!`;
                addQuestProgress('g_maze_1', 1);
                
                if (mazeState.level < 200) {
                    localStorage.setItem('mazeLevel', mazeState.level + 1);
                    setTimeout(() => {
                        initMaze(); 
                    }, 1000);
                } else {
                    setTimeout(() => alert("Поздравляю! Ты прошел все 200 уровней лабиринта!"), 100);
                }
            }
        }

        // --- СЛАЙД-ПАЗЛ (УНИКАЛЬНЫЙ) ---
        let slidingState = { board: [], emptyIdx: 8, gameOver: false, targetImage: null };

        function initSlidingPuzzle() {
            let solved = [1, 2, 3, 4, 5, 6, 7, 8, 0];
            let empty = 8;
            
            for (let i = 0; i < 50; i++) {
                const neighbors = [];
                const r = Math.floor(empty / 3);
                const c = empty % 3;
                if (r > 0) neighbors.push(empty - 3);
                if (r < 2) neighbors.push(empty + 3);
                if (c > 0) neighbors.push(empty - 1);
                if (c < 2) neighbors.push(empty + 1);
                
                const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
                [solved[empty], solved[randomNeighbor]] = [solved[randomNeighbor], solved[empty]];
                empty = randomNeighbor;
            }

            slidingState = { board: solved, emptyIdx: empty, gameOver: false };
            renderSlidingPuzzle();
            document.getElementById('sliding-status').textContent = 'Собери числа по порядку';
        }

                cell.style.cssText = `
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: ${num === 0 ? 'transparent' : 'rgba(255,255,255,0.2)'};
                    border: ${num === 0 ? 'none' : '2px solid rgba(255,255,255,0.5)'};

                cell.textContent = num === 0 ? '' : num;
                if (num !== 0) {
                    cell.onclick = () => moveSlidingPuzzle(idx);
                }
                container.appendChild(cell);
            });
        }

        function moveSlidingPuzzle(idx) {
            if (slidingState.gameOver) return;

            const r1 = Math.floor(idx / 3);
            const c1 = idx % 3;
            const r2 = Math.floor(slidingState.emptyIdx / 3);
            const c2 = slidingState.emptyIdx % 3;

            if (Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1) {
                [slidingState.board[idx], slidingState.board[slidingState.emptyIdx]] = [slidingState.board[slidingState.emptyIdx], slidingState.board[idx]];
                slidingState.emptyIdx = idx;
                renderSlidingPuzzle();
                checkSlidingPuzzleWin();
            }

        let drawTool = 'brush';
        let drawColor = '#000';
        let isDrawing = false;
        let lastX = 0, lastY = 0;

        function initFreeDraw(w, h, isMobile) {
            const canvas = document.getElementById('freeCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDraw = (e) => {
                e.preventDefault();
                isDrawing = true;
                const pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getPos(e);
                
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                
                if (drawTool === 'eraser') {
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = isMobile ? 30 : 20;
                } else {
                    ctx.strokeStyle = drawColor;
                    ctx.lineWidth = isMobile ? 10 : 6;
                }
                ctx.stroke();
                
                lastX = pos.x;
                lastY = pos.y;
            };

            const stopDraw = () => { isDrawing = false; };

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('mouseout', stopDraw);
            
            canvas.addEventListener('touchstart', startDraw, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stopDraw);
            canvas.addEventListener('touchcancel', stopDraw);
        }

        function setDrawTool(tool) {
            drawTool = tool;
            const brush = document.getElementById('tool-brush');
            const eraser = document.getElementById('tool-eraser');
            if (brush) brush.classList.toggle('active-tool', tool === 'brush');
            if (eraser) eraser.classList.toggle('active-tool', tool === 'eraser');

        function setDrawColor(color, el) {
            drawColor = color;
            document.querySelectorAll('.color-swatch').forEach(swatch => swatch.classList.remove('active'));

        let eraseTask = '';
        let eraseOriginalPixels = 0;
        function initEraseGame(w, h) {
            const canvas = document.getElementById('eraseCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, w, h);

                ctx.strokeStyle = '#333';
                ctx.beginPath();
                ctx.arc(w/2, h/2, w/6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                for (let i = 0; i < 8; i++) {
                    const angle = (i * Math.PI) / 4;
                    ctx.beginPath();
                    ctx.moveTo(w/2 + Math.cos(angle) * (w/6 + 10), h/2 + Math.sin(angle) * (w/6 + 10));
                    ctx.lineTo(w/2 + Math.cos(angle) * (w/6 + 25), h/2 + Math.sin(angle) * (w/6 + 25));
                    ctx.stroke();
                }
                ctx.fillStyle = 'rgba(200, 200, 200, 0.8)';
                ctx.beginPath();
                ctx.arc(w/2 - 40, h/2 - 40, 30, 0, Math.PI * 2);
                ctx.arc(w/2 + 10, h/2 - 50, 40, 0, Math.PI * 2);
                ctx.arc(w/2 + 50, h/2 - 20, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
            else if (eraseTask === 'car_extra_wheel') {
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.roundRect(w/4, h/2, w/2, h/5, 10);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#6bc5ff';
                ctx.beginPath();
                ctx.moveTo(w/4 + 40, h/2);
                ctx.lineTo(w/4 + 70, h/2 - 40);
                ctx.lineTo(w/2 + 30, h/2 - 40);
                ctx.lineTo(w/2 + 60, h/2);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#333';
                ctx.beginPath(); ctx.arc(w/4 + 30, h/2 + h/5, 25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(w/2 + 50, h/2 + h/5, 25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#333';
                ctx.beginPath(); ctx.arc(w/2, h/2 + h/5, 25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
            else if (eraseTask === 'tree_extra_branch') {
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(w/2 - 20, h/2, 40, h/3);
                ctx.strokeRect(w/2 - 20, h/2, 40, h/3);
                ctx.fillStyle = '#3ddbb0';
                ctx.beginPath();
                ctx.arc(w/2, h/3, w/5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.strokeStyle = '#8b4513';
                ctx.lineWidth = 10;
                ctx.beginPath();
                ctx.moveTo(w/2 + 20, h/2 + 40);
                ctx.lineTo(w/2 + 80, h/2 + 20);
                ctx.stroke();
            }

            eraseOriginalPixels = countPixelsInZone(ctx, w, h, eraseTask);

            let drawing = false;
            let lastX = 0, lastY = 0;

            const getPos = (e) => {

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

                e.preventDefault();
                drawing = true;
                const pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 40;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 20, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            };

            const draw = (e) => {
                if (!drawing) return;
                e.preventDefault();
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                lastX = pos.x;
                lastY = pos.y;
            };

            const stop = () => { drawing = false; };

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('mouseout', stop);
            
            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stop);
            canvas.addEventListener('touchcancel', stop);

            document.getElementById('erase-bot-face').textContent = '🤖';
            document.getElementById('erase-bot-text').textContent = 'Сотри то, чего не должно быть!';
            document.getElementById('erase-next-btn').style.display = 'none';
        }

        function countPixelsInZone(ctx, w, h, task) {
            let imgData;
            if (task === 'sun_and_cloud') {
                imgData = ctx.getImageData(w/2 - 70, h/2 - 70, 140, 90).data;
            } else if (task === 'car_extra_wheel') {
                imgData = ctx.getImageData(w/2 - 35, h/2 + h/5 - 35, 70, 70).data;
            } else if (task === 'tree_extra_branch') {
                imgData = ctx.getImageData(w/2 + 10, h/2 + 10, 80, 60).data;
            }
            let count = 0;
            for (let i = 3; i < imgData.length; i += 4) {
                if (imgData[i] > 0) count++;
            }
            return count;
        }

            const currentPixels = countPixelsInZone(ctx, w, h, eraseTask);

        function drawShape(ctx, type, cx, cy, size) {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.fillStyle = '#ddd';
            
            if (type === 'house') {
                ctx.fillRect(cx - size/2, cy, size, size*0.7);
                ctx.strokeRect(cx - size/2, cy, size, size*0.7);
                ctx.beginPath();
                ctx.moveTo(cx - size/2 - 10, cy);
                ctx.lineTo(cx, cy - size*0.5);
                ctx.lineTo(cx + size/2 + 10, cy);
                ctx.closePath();
                ctx.fillStyle = '#ff6b6b';
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(cx - 15, cy + size*0.3, 30, size*0.4);
                ctx.fillStyle = '#add8e6';
                ctx.fillRect(cx - size*0.35, cy + size*0.1, 25, 25);
            } 
            else if (type === 'car') {
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.roundRect(cx - size/2, cy, size, size*0.4, 10);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#6bc5ff';
                ctx.beginPath();
                ctx.moveTo(cx - size*0.2, cy);
                ctx.lineTo(cx - size*0.1, cy - size*0.3);
                ctx.lineTo(cx + size*0.2, cy - size*0.3);
                ctx.lineTo(cx + size*0.3, cy);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#333';
                ctx.beginPath(); ctx.arc(cx - size*0.3, cy + size*0.4, size*0.15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx + size*0.3, cy + size*0.4, size*0.15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
            else if (type === 'tree') {
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(cx - size*0.1, cy, size*0.2, size*0.6);
                ctx.strokeRect(cx - size*0.1, cy, size*0.2, size*0.6);
                ctx.fillStyle = '#3ddbb0';
                ctx.beginPath();
                ctx.arc(cx, cy, size*0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }
